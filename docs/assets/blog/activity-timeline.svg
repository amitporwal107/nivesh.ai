<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Commit activity by month: May 82, June 115, July 5 (partial)">
  <rect x="0" y="0" width="720" height="360" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#0f172a">Commit activity by month</text>
  <text x="36" y="60" font-size="13" fill="#64748b">201 commits over ~6 weeks · one branch + PR per task</text>

  <!-- baseline -->
  <line x1="60" y1="300" x2="690" y2="300" stroke="#e5e7eb"/>

  <!-- May 82 -->
  <rect x="110" y="129" width="110" height="171" rx="6" fill="#4f46e5"/>
  <text x="165" y="120" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">82</text>
  <text x="165" y="324" font-size="14" fill="#334155" text-anchor="middle">May</text>

  <!-- Jun 115 -->
  <rect x="320" y="60" width="110" height="240" rx="6" fill="#4f46e5"/>
  <text x="375" y="51" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">115</text>
  <text x="375" y="324" font-size="14" fill="#334155" text-anchor="middle">June</text>

  <!-- Jul 5 partial -->
  <rect x="530" y="289" width="110" height="11" rx="4" fill="#14b8a6"/>
  <text x="585" y="280" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">5</text>
  <text x="585" y="324" font-size="14" fill="#334155" text-anchor="middle">July*</text>

  <text x="36" y="349" font-size="11" fill="#94a3b8">* July partial — first days of the month only</text>
</svg>
