          description: "Comma-separated AMFI scheme codes (max 100). E.g. `120503,120504`."
      responses:
        "200":
          description: Latest NAV map

  /v1/mf/nav/{scheme_code}:
    get:
      tags: [mutual_funds]
      operationId: mf_nav_series
      summary: NAV time series for a scheme
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/scheme_code_path'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: NAV series

  /v1/mf/holdings/{scheme_code}:
    get:
      tags: [mutual_funds]
      operationId: mf_scheme_holdings
