        - url: https://query.nidp.internal
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
        - name: target_date
          in: query
          schema:
            type: string
            format: date
        - name: limit_dates
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Archive file listing

  /query/archive/{ingester}/{target_date}/{filename}:
    get:
      tags: [query_archive]
      operationId: query_archive_download
      summary: Download an archive file
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
        - name: target_date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: filename
          in: path
          required: true
