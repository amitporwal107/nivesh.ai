      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/scheme_code_path'
        - name: as_of_month
          in: query
          schema:
            type: string
            format: date
          description: "First day of the month (YYYY-MM-01). Defaults to latest."
        - name: instrument_type
          in: query
          schema:
            type: string
            enum: [EQUITY, DEBT, CASH, DERIVATIVE, REIT]
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Scheme holdings

  /v1/mf/holdings/overlap:
    get:
      tags: [mutual_funds]
      operationId: mf_holdings_overlap
      summary: Equity holding overlap between two schemes
      security:
        - ApiKeyAuth: []
      parameters:
        - name: scheme_a
          in: query
          required: true
          schema:
            type: string
        - name: scheme_b
          in: query
          required: true
          schema:
            type: string
        - name: as_of_month
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Overlap analysis

  /v1/mf/schemes/{scheme_code}/events:
    get:
      tags: [mutual_funds]
      operationId: mf_scheme_events
      summary: "Lifecycle events: TER changes, manager changes, risk shifts, mergers"
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/scheme_code_path'
        - name: event_types
          in: query
          schema:
            type: string
          description: "Comma-separated: ter_change, manager_change, risk_change, merger, rename, launch, closure."
        - name: start
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Scheme lifecycle events

  /v1/mf/schemes/{scheme_code}/disclosure:
    get:
      tags: [mutual_funds]
      operationId: mf_scheme_disclosure
      summary: "TER, risk-o-meter, and fund manager history"
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/scheme_code_path'
        - name: history
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 4
          description: Number of historical snapshots to include.
      responses:
        "200":
          description: Scheme disclosure history

  /v1/mf/circulars:
    get:
      tags: [mutual_funds]
      operationId: mf_circulars
      summary: "AMFI notices, circulars, and addenda"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [notice, circular, addendum]
        - name: start
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          schema:
            type: string
          description: Title keyword search.
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: AMFI circulars

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — MF Performance
  # ══════════════════════════════════════════════════════════════════════════
  /v1/mf/performance/{scheme_code}:
    get:
      tags: [mf_performance]
      operationId: mf_performance_scheme
      summary: Performance metrics for a single scheme
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/scheme_code_path'
      responses:
        "200":
          description: Scheme performance

  /v1/mf/performance/category/{category}:
    get:
      tags: [mf_performance]
      operationId: mf_performance_category
      summary: Top-N schemes within a category
      security:
        - ApiKeyAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            example: "Large Cap"
        - name: metric
          in: query
          schema:
            type: string
            enum: [composite_rank, return_1y, return_3y, sharpe_1y, sortino_1y]
            default: composite_rank
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Category leaderboard

  /v1/mf/performance/screener/top:
    get:
      tags: [mf_performance]
      operationId: mf_screener_top
      summary: Top funds across all categories by a single metric
      security:
        - ApiKeyAuth: []
      parameters:
        - name: metric
          in: query
          schema:
            type: string
            enum: [return_1y, sharpe_1y, sortino_1y, composite_rank]
            default: composite_rank
        - name: category_filter
          in: query
          schema:
            type: string
          description: Optional category substring filter.
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Top funds

  /v1/mf/performance/screener/advanced:
    get:
      tags: [mf_performance]
      operationId: mf_screener_advanced
      summary: Composite-score-filtered MF screener
      security:
        - ApiKeyAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [composite_score, return_3y, return_1y, return_5y, sharpe, ter, aum]
            default: composite_score
        - name: min_composite
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: max_ter
          in: query
          schema:
            type: number
        - name: min_return_3y
          in: query
          schema:
            type: number
        - name: min_sharpe
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Screener results

  /v1/mf/performance/scorecard/{scheme_code}:
    get:
      tags: [mf_performance]
      operationId: mf_scorecard_scheme
      summary: Full category scorecard for a scheme
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/scheme_code_path'
      responses:
        "200":
          description: Scheme scorecard

  /v1/mf/performance/scorecard/category/{sub_category}:
    get:
      tags: [mf_performance]
      operationId: mf_scorecard_category
      summary: Category leaderboard with composite scores
      security:
        - ApiKeyAuth: []
      parameters:
        - name: sub_category
          in: path
          required: true
          schema:
            type: string
            example: "Large Cap"
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [composite_score, ret_1y, ret_3y, ret_5y, sharpe, sortino, alpha, maxdd, ter, aum]
            default: composite_score
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Category scorecard leaderboard

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY API — Health
  # ════════════════════════════════════════════════════════════════════════════
  /query/health:
    get:
      tags: [query_health]
      operationId: query_health
      summary: Query API liveness + DB readiness check
      description: No auth required.
      servers:
        - url: https://query.nidp.internal
          description: NIDP Query API
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY API — Catalog
  # ════════════════════════════════════════════════════════════════════════════
  /query/catalog:
    get:
      tags: [query_catalog]
      operationId: query_catalog
      summary: "Full warehouse table catalog with row counts and coverage dates"
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      responses:
        "200":
          description: Full warehouse catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      type: object
                      properties:
                        table_name:
                          type: string
                        domain:
                          type: string
                        row_count:
                          type: integer
                        first_date:
                          type: string
                          format: date
                          nullable: true
                        last_date:
                          type: string
                          format: date
                          nullable: true
                  domain_rollup:
                    type: object

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY API — Feeds
  # ════════════════════════════════════════════════════════════════════════════
  /query/feeds:
    get:
      tags: [query_feeds]
      operationId: query_feeds_list
      summary: Per-ingester health view with trailing-week calendar
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      responses:
        "200":
          description: Feed health summary

  /query/feeds/{ingester}/runs:
    get:
      tags: [query_feeds]
      operationId: query_feed_runs
      summary: Per-ingester run history
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
          description: Ingester name (e.g. nse_eod, mf_nav).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Run history

  /query/feeds/{ingester}/calendar:
    get:
      tags: [query_feeds]
      operationId: query_feed_calendar
      summary: Per-day status for the last N days
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
      responses:
        "200":
          description: Daily status calendar

  /query/feeds/{ingester}/logs:
    get:
      tags: [query_vm_ops]
      operationId: query_feed_logs
      summary: Tail the last N lines of the ingester's VM log file
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
        - name: lines
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: Log tail

  /query/feeds/{ingester}/execute:
    post:
      tags: [query_vm_ops]
      operationId: query_feed_execute
      summary: Spawn run_service.sh in the background for an ingester
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
        - name: target_date
          in: query
          schema:
            type: string
            format: date
          description: Override the target date (YYYY-MM-DD).
      responses:
        "200":
          description: Execution started

  /query/feeds/{ingester}/log_path:
    get:
      tags: [query_vm_ops]
      operationId: query_feed_log_path
      summary: Return the on-disk log path for the ingester
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Log path

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY API — Validation
  # ════════════════════════════════════════════════════════════════════════════
  /query/validation:
    get:
      tags: [query_validation]
      operationId: query_validation_latest
      summary: Latest validation runs per (ingester, date)
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Validation runs

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY API — Quality
  # ════════════════════════════════════════════════════════════════════════════
  /query/quality:
    get:
      tags: [query_quality]
      operationId: query_quality_latest
      summary: Latest quality score per domain
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: domain
          in: query
          schema:
            type: string
            enum: [mf, equity, all]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Quality scores

  /query/certification:
    get:
      tags: [query_quality]
      operationId: query_certification
      summary: "Certified dates — only dates that passed the quality gate"
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Certified dates

  /query/consistency:
    get:
      tags: [query_quality]
      operationId: query_consistency
      summary: Latest consistency run per (target_date, domain)
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
      responses:
        "200":
          description: Consistency runs

  /query/consistency/findings:
    get:
      tags: [query_quality]
      operationId: query_consistency_findings
      summary: "Individual consistency findings, newest first"
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: dimension
          in: query
          schema:
            type: string
            enum: [CROSS_SOURCE, INTERNAL, TEMPORAL, API, POINT_IN_TIME]
        - name: severity
          in: query
          schema:
            type: string
            enum: [INFO, WARN, ERROR, CRITICAL]
        - name: entity_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Consistency findings

  /query/publish-gate:
    get:
      tags: [query_quality]
      operationId: query_publish_gate
      summary: "Go/no-go publish decision per (date, domain)"
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Publish gate decisions

  /query/exception-queue:
    get:
      tags: [query_quality]
      operationId: query_exception_queue
      summary: Items in the manual-review queue (ops dashboard)
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: resolved
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Exception queue items

  /query/exception-queue/{queue_id}:
    patch:
      tags: [query_quality]
      operationId: query_resolve_exception
      summary: Mark an exception queue item as resolved
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: queue_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, OVERRIDE, ESCALATE]
                resolution_note:
                  type: string
                  default: ""
                resolved_by:
                  type: string
                  default: ops
      responses:
        "200":
          description: Exception resolved

  /query/quarantine:
    get:
      tags: [query_quality]
      operationId: query_quarantine
      summary: Dates condemned by the quality gate
      security:
        - BearerAuth: []
      servers:
        - url: https://query.nidp.internal
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
      responses:
        "200":
          description: Quarantined dates

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY API — Archive
  # ════════════════════════════════════════════════════════════════════════════
  /query/archive/{ingester}:
    get:
