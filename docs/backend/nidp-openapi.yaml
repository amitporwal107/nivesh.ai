        - ApiKeyAuth: []
      responses:
        "200":
          description: Policy list

  /v1/replay/start:
    post:
      tags: [replay]
      operationId: replay_start
      summary: Kick off a new replay (returns replay_id immediately)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date]
              properties:
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                domains:
                  type: array
                  items:
                    type: string
                    enum: [mf, equity]
                  default: [mf, equity]
                policy_version:
                  type: string
                  default: v1
                parallel:
                  type: integer
                  minimum: 1
                  maximum: 32
                  default: 4
                inject_failures:
                  type: boolean
                  default: false
                reset_data:
                  type: boolean
                  default: false
                failure_seed:
                  type: integer
                  nullable: true
                failure_rate:
                  type: number
                  minimum: 0.0
                  maximum: 1.0
                  default: 0.10
                skip_weekends:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Replay started
          content:
            application/json:
              schema:
                type: object
                properties:
                  replay_id:
                    type: string

