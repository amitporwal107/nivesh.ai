openapi: 3.1.0
info:
  title: NIDP — Nivesh Indian Data Platform
  version: 1.0.0
  description: |
    Consolidated OpenAPI specification for all NIDP services.

    ## Services

    | Service | Base URL | Audience |
    |---------|----------|----------|
    | **DaaS API** | `https://daas.nivesh.ai` | External — partner/client API key required |
    | **Query API** | `https://query.nidp.internal` | Internal — VPC-only, Bearer token |

    ## DaaS Authentication

    Every `/v1/*` endpoint requires an API key issued by Nivesh ops:

    ```
    X-API-Key: nvd_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # or
    Authorization: Bearer nvd_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    ```

    `/admin/*` endpoints require the internal `NIDP_DAAS_INTERNAL_TOKEN` Bearer token.

    ## Query API Authentication

    All endpoints require:

    ```
    Authorization: Bearer <NIDP_QUERY_API_TOKEN>
    ```

    ## Rate Limits (DaaS)

    Each key has a per-minute RPM cap and a daily quota. Every response includes:
    - `X-RateLimit-Limit` / `X-RateLimit-Remaining` / `X-RateLimit-Reset`
    - `X-Daily-Limit` / `X-Daily-Remaining`

    A 429 response includes a `Retry-After` header.

    ## Pagination (DaaS)

    List endpoints accept `limit` (1–5000, default 100) and `offset`.
    Response envelopes include `pagination.next_offset` when more rows are available.

    ## Conventions

    - Dates: `YYYY-MM-DD`; timestamps: ISO 8601 UTC
    - Symbols: canonical NSE tickers, upper-cased server-side
    - Numeric values decoded from `NUMERIC` to JSON numbers

  contact:
    name: Nivesh
    url: https://nivesh.com
  license:
    name: Commercial — see Nivesh DaaS terms

servers:
  - url: https://daas.nivesh.ai
    description: NIDP Data-as-a-Service API (external)
  - url: https://query.nidp.internal
    description: NIDP Query API (internal VPC)

tags:
  # ── DaaS tags ──────────────────────────────────────────────────────────────
  - name: health
    description: Liveness probes — no auth required.
  - name: admin
    description: "Key lifecycle management. Requires `NIDP_DAAS_INTERNAL_TOKEN` Bearer auth."
  - name: me
    description: Caller identity, plan, and daily usage.
  - name: catalog
    description: Dataset index with live row counts.
  - name: prices
    description: NSE EOD OHLCV — raw bhavcopy and split/bonus/dividend-adjusted series.
  - name: corporate_actions
    description: Dividend, split, bonus, and rights calendar.
  - name: indices
    description: Index list and effective-dated constituent membership.
  - name: reference
    description: Symbol master, sector list, and NSE trading holidays.
  - name: financials
    description: Quarterly financials and shareholding pattern.
  - name: fno
    description: "F&O bhavcopy — futures and options OHLCV, options chain, expiry calendar."
  - name: flows
    description: "FII / DII net flows, bulk deals, and block deals."
  - name: announcements
    description: NSE + BSE corporate filings and exchange announcements.
  - name: macro
    description: RBI G-Sec yields and global macro series from FRED.
  - name: snapshots
    description: Pre-computed market-wide and per-stock daily snapshots.
  - name: features
    description: Engineered features from the Nivesh S4/S5 strategy pipeline.
  - name: mutual_funds
    description: "MF AMCs, schemes, daily NAV, monthly holdings, portfolio overlap, lifecycle events, TER/risk-o-meter, AMFI circulars."
  - name: mf_performance
    description: MF performance metrics, category leaderboards, composite-score screener.
  - name: events
    description: Corporate event calendar and AI-generated market signals.
  - name: intelligence
    description: Security master, entity graph, correlation matrix, portfolio intelligence.
  - name: dq_ai
    description: "AI-driven data quality: smell detection, expectation authoring, proposal review."
  - name: replay
    description: 90-day replay engine — policies, runs, per-date outcomes.
  - name: backfill
    description: Backfill status and per-job grid.
  # ── Query API tags ──────────────────────────────────────────────────────────
  - name: query_health
    description: Query API liveness probe.
  - name: query_catalog
    description: Full warehouse table catalog with row counts and coverage dates.
  - name: query_feeds
    description: Per-ingester health view, run history, daily calendar.
  - name: query_validation
    description: Latest validation runs per ingester.
  - name: query_quality
    description: "Quality scores, certification gates, consistency runs, exception queue, quarantine."
  - name: query_vm_ops
    description: VM log tailing and on-demand ingester execution.
  - name: query_archive
    description: Raw-feed file archive listing and download.

# ────────────────────────────────────────────────────────────────────────────
# Security Schemes
# ────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Pass your `nvd_...` token in the `X-API-Key` header."
    BearerAuth:
      type: http
      scheme: bearer
      description: "Internal admin token (`NIDP_DAAS_INTERNAL_TOKEN`) for `/admin/*` endpoints; or `NIDP_QUERY_API_TOKEN` for Query API."

  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 100
      description: Maximum rows to return.
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Row offset for pagination.
    symbol_path:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        example: RELIANCE
      description: Canonical NSE ticker symbol (upper-cased server-side).
    scheme_code_path:
      name: scheme_code
      in: path
      required: true
      schema:
        type: string
        example: "120503"
      description: AMFI scheme code.
    start_date:
      name: start
      in: query
      schema:
        type: string
        format: date
        example: "2024-01-01"
      description: "Start date (YYYY-MM-DD), inclusive."
    end_date:
      name: end
      in: query
      schema:
        type: string
        format: date
        example: "2024-12-31"
      description: "End date (YYYY-MM-DD), inclusive."

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: "not_found"
            request_id:
              type: string
              nullable: true

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          nullable: true
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: integer
          nullable: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [ok, error]
        ts:
          type: string
          format: date-time

    CatalogEntry:
      type: object
      properties:
        dataset:
          type: string
        rows:
          type: integer
        first_date:
          type: string
          format: date
          nullable: true
        last_date:
          type: string
          format: date
          nullable: true
        description:
          type: string

    EodBar:
      type: object
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
        trades:
          type: integer
          nullable: true
        series:
          type: string

    AdjustedBar:
      allOf:
        - $ref: '#/components/schemas/EodBar'
        - type: object
          properties:
            adj_close:
              type: number
            adj_factor:
              type: number

    ApiKey:
      type: object
      properties:
        key_id:
          type: string
          format: uuid
        name:
          type: string
        owner_email:
          type: string
          format: email
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
        rate_limit_rpm:
          type: integer
          nullable: true
        daily_quota:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        notes:
          type: string
          nullable: true

# ────────────────────────────────────────────────────────────────────────────
# Paths
# ────────────────────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Health
  # ══════════════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [health]
      operationId: daas_health
      summary: Liveness + DB readiness check
      description: Returns 200 when the service is healthy. No auth required.
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "503":
          description: Service degraded (DB unreachable)

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Admin (key lifecycle)
  # ══════════════════════════════════════════════════════════════════════════
  /admin/keys:
    post:
      tags: [admin]
      operationId: admin_create_key
      summary: Issue a new DaaS API key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_email]
              properties:
                name:
                  type: string
                  description: Human-readable label for this key.
                owner_email:
                  type: string
                  format: email
                plan:
                  type: string
                  enum: [free, starter, pro, enterprise]
                  default: free
                rate_limit_rpm:
                  type: integer
                  nullable: true
                  description: Requests per minute. Null = plan default.
                daily_quota:
                  type: integer
                  nullable: true
                  description: Daily request cap. Null = plan default.
                expires_in_days:
                  type: integer
                  nullable: true
                  description: Key TTL in days. Null = no expiry.
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Key created — cleartext token shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:
                    type: string
                  token:
                    type: string
                    description: "Cleartext `nvd_...` token. Shown once only — store it now."
                  plan:
                    type: string
                  rate_limit_rpm:
                    type: integer
                  daily_quota:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
        "401":
          description: Invalid internal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [admin]
      operationId: admin_list_keys
      summary: List all API keys (no cleartext tokens)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'

  /admin/keys/{key_id}:
    delete:
      tags: [admin]
      operationId: admin_revoke_key
      summary: Revoke a key
      security:
        - BearerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Key revoked
        "404":
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Me
  # ══════════════════════════════════════════════════════════════════════════
  /v1/me:
    get:
      tags: [me]
      operationId: me_identity
      summary: Caller identity, plan, and rate-limit state
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Caller info
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:
                    type: string
                  name:
                    type: string
                  owner_email:
                    type: string
                  plan:
                    type: string
                  rate_limit_rpm:
                    type: integer
                  daily_quota:
                    type: integer
                  daily_used:
                    type: integer
                  daily_remaining:
                    type: integer

  /v1/me/usage:
    get:
      tags: [me]
      operationId: me_usage
      summary: Daily request counters for the last N days
      security:
        - ApiKeyAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
          description: Number of calendar days to look back.
      responses:
        "200":
          description: Daily usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        requests:
                          type: integer

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Catalog
  # ══════════════════════════════════════════════════════════════════════════
  /v1/catalog:
    get:
      tags: [catalog]
      operationId: catalog_list
      summary: Publicly-exposed datasets with coverage stats
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Dataset catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogEntry'

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Prices
  # ══════════════════════════════════════════════════════════════════════════
  /v1/prices/eod/{symbol}:
    get:
      tags: [prices]
      operationId: prices_eod_symbol
      summary: Daily OHLCV for one symbol (raw bhavcopy)
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/symbol_path'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - name: series
          in: query
          schema:
            type: string
            enum: [EQ, BE, BZ]
          description: "NSE series filter. Default: EQ."
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: EOD OHLCV rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EodBar'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/prices/eod:
    get:
      tags: [prices]
      operationId: prices_eod_by_date
      summary: Daily OHLCV for all symbols on one date
      security:
        - ApiKeyAuth: []
      parameters:
        - name: on
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2024-11-29"
          description: "Trading date (YYYY-MM-DD)."
        - name: series
          in: query
          schema:
            type: string
            enum: [EQ, BE, BZ]
            default: EQ
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Cross-symbol EOD snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EodBar'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /v1/prices/adjusted/{symbol}:
    get:
      tags: [prices]
      operationId: prices_adjusted
      summary: Split/bonus/dividend-adjusted OHLCV
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/symbol_path'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Adjusted OHLCV rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdjustedBar'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /v1/prices/latest/{symbol}:
    get:
      tags: [prices]
      operationId: prices_latest
      summary: Most-recent EOD bar for one symbol
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/symbol_path'
      responses:
        "200":
          description: Latest EOD bar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EodBar'
        "404":
          description: Symbol not found

  /v1/prices/index/{index_name}:
    get:
      tags: [prices]
      operationId: prices_index
      summary: Daily OHLC for an index (e.g. Nifty 50)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: index_name
          in: path
          required: true
          schema:
            type: string
            example: "Nifty 50"
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Index OHLC series
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        open:
                          type: number
                        high:
                          type: number
                        low:
                          type: number
                        close:
                          type: number
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /v1/prices/delivery/{symbol}:
    get:
      tags: [prices]
      operationId: prices_delivery
      summary: Daily delivered-quantity and delivery percentage
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/symbol_path'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Delivery data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        date:
                          type: string
                          format: date
                        traded_qty:
                          type: integer
                        deliverable_qty:
                          type: integer
                        delivery_pct:
                          type: number
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Corporate Actions
  # ══════════════════════════════════════════════════════════════════════════
  /v1/corporate-actions:
    get:
      tags: [corporate_actions]
      operationId: corp_actions_list
      summary: Corporate-action calendar (filterable)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: action_type
          in: query
          schema:
            type: string
            enum: [DIVIDEND, SPLIT, BONUS, RIGHTS, AGM, EGM, FACE_VALUE_CHANGE]
        - name: ex_from
          in: query
          schema:
            type: string
            format: date
        - name: ex_to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Corporate actions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        action_type:
                          type: string
                        ex_date:
                          type: string
                          format: date
                        record_date:
                          type: string
                          format: date
                          nullable: true
                        announcement_date:
                          type: string
                          format: date
                          nullable: true
                        details:
                          type: object
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /v1/corporate-actions/{symbol}:
    get:
      tags: [corporate_actions]
      operationId: corp_actions_symbol
      summary: Corporate actions for one symbol
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/symbol_path'
        - name: action_type
          in: query
          schema:
            type: string
            enum: [DIVIDEND, SPLIT, BONUS, RIGHTS, AGM, EGM, FACE_VALUE_CHANGE]
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Symbol's corporate actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Indices
  # ══════════════════════════════════════════════════════════════════════════
  /v1/indices:
    get:
      tags: [indices]
      operationId: indices_list
      summary: Distinct list of tracked indices
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Index list
          content:
            application/json:
              schema:
                type: object
                properties:
                  indices:
                    type: array
                    items:
                      type: object
                      properties:
                        index_name:
                          type: string
                          example: "Nifty 50"
                        exchange:
                          type: string
                          example: NSE

  /v1/indices/{index_name}/constituents:
    get:
      tags: [indices]
      operationId: index_constituents
      summary: Effective-dated constituent list for an index
      security:
        - ApiKeyAuth: []
      parameters:
        - name: index_name
          in: path
          required: true
          schema:
            type: string
            example: "Nifty 50"
        - name: on
          in: query
          schema:
            type: string
            format: date
          description: "Point-in-time date. Defaults to most recent rebalance."
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Constituents on given date
          content:
            application/json:
              schema:
                type: object
                properties:
                  index_name:
                    type: string
                  as_of_date:
                    type: string
                    format: date
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        company_name:
                          type: string
                        weight:
                          type: number
                          nullable: true
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  # ══════════════════════════════════════════════════════════════════════════
  # DAAS API — Reference
  # ══════════════════════════════════════════════════════════════════════════
  /v1/symbols:
    get:
      tags: [reference]
      operationId: symbols_list
      summary: Symbol master — symbol, company, sector, ISIN
      security:
        - ApiKeyAuth: []
      parameters:
        - name: sector
          in: query
          schema:
            type: string
        - name: series
          in: query
          schema:
            type: string
            enum: [EQ, BE, BZ]
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Symbol master list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        company_name:
