  # ══════════════════════════════════════════════════════════════════════════
  # Compliance (DPDP Act 2023)
  # ══════════════════════════════════════════════════════════════════════════
  /api/compliance/consents:
    get:
      tags: [compliance]
      operationId: compliance_consents_list
      summary: Consent catalogue with user's grant status per purpose
      responses:
        "200":
          description: Consent catalogue

  /api/compliance/consents/{purpose}:
    post:
      tags: [compliance]
      operationId: compliance_consents_grant
      summary: Grant consent for a purpose
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consent granted

    delete:
      tags: [compliance]
      operationId: compliance_consents_withdraw
      summary: Withdraw consent for a purpose
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consent withdrawn

  /api/compliance/audit:
    get:
      tags: [compliance]
      operationId: compliance_audit
      summary: DPDP audit trail
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit trail

  /api/compliance/pan:
    get:
      tags: [compliance]
      operationId: compliance_pan_get
      summary: Get masked PAN and set/unset status
      responses:
        "200":
          description: Masked PAN status

    put:
      tags: [compliance]
      operationId: compliance_pan_set
      summary: Store encrypted PAN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pan]
              properties:
                pan:
                  type: string
                  pattern: "^[A-Z]{5}[0-9]{4}[A-Z]{1}$"
      responses:
        "200":
          description: PAN stored

    delete:
      tags: [compliance]
      operationId: compliance_pan_delete
      summary: Erase PAN (Right to Erasure)
      responses:
        "200":
          description: PAN erased

