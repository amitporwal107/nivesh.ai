      tags: [admin_users]
      operationId: admin_users_list
      summary: List users with stats
      parameters:
        - name: q
          in: query
          schema:
            type: string
            nullable: true
          description: Email prefix search.
      responses:
        "200":
          description: User list (500 max)

    post:
      tags: [admin_users]
      operationId: admin_users_create
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  nullable: true
                is_admin:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Created user

  /api/admin/users/{user_id}:
    get:
      tags: [admin_users]
      operationId: admin_users_get
      summary: User detail with recent plans and sessions
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail

    patch:
      tags: [admin_users]
      operationId: admin_users_update
      summary: Toggle user admin flag
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_admin:
                  type: boolean
      responses:
        "200":
          description: Updated user

  /api/admin/users/{user_id}/invalidate-sessions:
    post:
      tags: [admin_users]
      operationId: admin_users_invalidate_sessions
      summary: Force logout all devices for a user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions invalidated

  /api/admin/users/{user_id}/reset-portfolio:
    post:
      tags: [admin_users]
      operationId: admin_users_reset_portfolio
      summary: Wipe portfolio data and reset onboarding flags
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Portfolio reset

  /api/admin/users/{user_id}/restore-holdings:
    post:
      tags: [admin_users]
      operationId: admin_users_restore_holdings
      summary: Reload latest CAS snapshot into holdings
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Holdings restored

  /api/admin/identity/duplicates:
    get:
      tags: [admin_users]
      operationId: admin_identity_duplicates
      summary: Surface email/mobile/PAN duplicates
      responses:
        "200":
          description: Duplicate list

  /api/admin/reset-onboarding:
    post:
      tags: [admin_users]
      operationId: admin_reset_onboarding
      summary: Reset onboarding for a user (dev/admin tool)
      description: Requires `X-Admin-Key` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Onboarding reset

  # ══════════════════════════════════════════════════════════════════════════
  # Admin — Data Pipeline
  # ══════════════════════════════════════════════════════════════════════════
  /api/admin/data-pipeline/status:
    get:
      tags: [admin_data_pipeline]
      operationId: pipeline_status
      summary: Pipeline status — job timestamps, next runs, cache stats
      responses:
        "200":
          description: Pipeline status

  /api/admin/data-pipeline/logs:
    get:
      tags: [admin_data_pipeline]
      operationId: pipeline_logs
      summary: Recent job-log rows
      parameters:
        - name: job
          in: query
          schema:
            type: string
            nullable: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
      responses:
        "200":
          description: Job logs

  /api/admin/data-pipeline/trigger/{job_name}:
    post:
      tags: [admin_data_pipeline]
      operationId: pipeline_trigger
      summary: Manually trigger a pipeline job
      parameters:
        - name: job_name
          in: path
          required: true
          schema:
            type: string
            enum: [nav_cron, analytics_sweep, v3_rescore, nifty100_refresh, stale_refresh, drain_queue]
      responses:
        "200":
          description: Job triggered

  /api/admin/data-pipeline/cache/invalidate:
    post:
      tags: [admin_data_pipeline]
      operationId: pipeline_cache_invalidate
      summary: Nuke V3 Redis cache
      responses:
        "200":
          description: Cache cleared

  /api/admin/data-pipeline/progress/{job_name}/clear:
    post:
      tags: [admin_data_pipeline]
      operationId: pipeline_progress_clear
      summary: Clear a stuck progress record
      parameters:
        - name: job_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress cleared

  # ══════════════════════════════════════════════════════════════════════════
  # Admin — NIDP Diagnostics
  # ══════════════════════════════════════════════════════════════════════════
  /api/admin/nidp/diag:
    get:
      tags: [admin_nidp]
      operationId: admin_nidp_diag
      summary: NIDP connection diagnostics (Query API, app Postgres, gcloud)
      responses:
        "200":
          description: Diagnostics result

  /api/admin/nidp/jobs:
    get:
      tags: [admin_nidp]
      operationId: admin_nidp_jobs_list
      summary: List all NIDP ingesters (Cloud Run jobs) with status
      responses:
        "200":
          description: Job list

  /api/admin/nidp/jobs/{ingester}/execute:
    post:
      tags: [admin_nidp]
      operationId: admin_nidp_jobs_execute
      summary: Trigger a Cloud Run ingester job
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job triggered

  /api/admin/nidp/jobs/{ingester}/runs:
    get:
      tags: [admin_nidp]
      operationId: admin_nidp_jobs_runs
      summary: Last N runs from job_log for an ingester
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Run history

  /api/admin/nidp/jobs/{ingester}/logs:
    get:
      tags: [admin_nidp]
      operationId: admin_nidp_jobs_logs
      summary: Tail Cloud Run logs via gcloud for an ingester
      parameters:
        - name: ingester
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Log tail

  /api/admin/nidp/dump:
    post:
      tags: [admin_nidp]
      operationId: admin_nidp_dump
      summary: Run diagnostic dump → private gist URL
      responses:
        "200":
          description: Gist URL
