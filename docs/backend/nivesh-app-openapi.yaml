      description: No authentication required.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Found CAS emails

  /api/public/cas-invite/{token}/import:
    post:
      tags: [cas_invite]
      operationId: public_cas_invite_import
      summary: Queue background CAS parse from Gmail
      description: No authentication required.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: array
                  items:
                    type: object
                    properties:
                      message_id:
