openapi: 3.1.0
info:
  title: Nivesh App API
  version: 2.0.0
  description: |
    REST API for the Nivesh.ai application — portfolio management, goal planning,
    AI copilot, broker integration, MFD workspace, and admin controls.

    ## Authentication

    All endpoints (except `/api/auth/*`, `/api/public/*`, and `/api/cas-parser-provider/active`)
    require a session cookie set by `POST /api/auth/google`.

    Admin endpoints additionally require the requesting user to have `is_admin = true`.

    ## Base URL

    - **Production**: `https://niveshcopilot.com`
    - **Staging**: `https://staging.niveshcopilot.com`

  contact:
    name: Nivesh
    url: https://nivesh.com

servers:
  - url: https://niveshcopilot.com
    description: Production
  - url: https://staging.niveshcopilot.com
    description: Staging

tags:
  - name: auth
    description: Google OAuth login, session management, current user identity.
  - name: user
    description: User profile, risk questionnaire, journey type, onboarding.
  - name: portfolio
    description: Portfolio CRUD, holdings management, instrument search, enrichment.
  - name: plans
    description: AI-generated V2 Action Plans — goal-based rebalancing recommendations.
  - name: goals
    description: Goal-Based Investment Planning — financial snapshot, goal CRUD, Monte Carlo simulation.
  - name: scenarios
    description: What-if scenario simulation and rebalancing plan generation.
  - name: portfolio_snapshots
    description: Portfolio Time-Machine — historical value snapshots and trend.
  - name: cas_snapshots
    description: CAS-sourced portfolio snapshots — performance, SIP summaries, time-machine.
  - name: cas_transactions
    description: Transaction history and detected SIP schedules from CAS data.
  - name: portfolio_builder
    description: AI Portfolio Builder — proposed allocations, simulation, PDF export.
  - name: portfolio_export
    description: Export portfolio holdings as CSV or XLSX.
  - name: portfolio_exposure
    description: Diversification and concentration analytics (AMC / sector / company).
  - name: insights
    description: Portfolio health insights, V3 scoring, problem distribution analysis.
  - name: intelligence
    description: Portfolio intelligence — look-through, stock overlap, V3 fund scores.
  - name: analytics
    description: Portfolio analytics — performance, allocation, deep analytics, fund ratings.
  - name: copilot
    description: CIO Copilot — AI chat, portfolio explanation, client message drafting.
  - name: copilot_agents
    description: Copilot agent routing, model picker, one-shot agent calls.
  - name: copilot_widgets
    description: Copilot widget producers — fund card, market brief, rebalance plan, etc.
  - name: market_events
    description: Corporate event calendar and AI market signal feed.
  - name: macro
    description: Macro Intelligence Layer — daily regime snapshot, manual refresh, backfill.
  - name: positional
    description: Positional Trading Engine — technical picks, watchlist, trade journal.
  - name: strategy_builder
    description: "Strategy Builder — DSL validation, universe CRUD, backtest runner."
  - name: benchmarks
    description: Benchmark index data — latest snapshot, OHLC history, category benchmark lookup.
  - name: feeds
    description: Generic feed subscriptions and RAG search.
  - name: broker
    description: "Secure Portfolio Connect — OpenAlgo integration, native broker OAuth."
  - name: mf_data
    description: Mutual fund data lookup and admin scrape management.
  - name: mfd
    description: "MFD multi-client workspace — profiles, impersonation, notes, tax summary."
  - name: advisor
    description: Advisor Home — client priority, AUM ranking, underperformer detection.
  - name: compliance
    description: DPDP Act 2023 — consent management, PAN storage, data export, account erasure.
  - name: data_health
    description: Global stale-data banner — pipeline status, pause/resume.
  - name: gmail
    description: Gmail OAuth integration — CAS email scanning and auto-import.
  - name: upload
    description: CAS PDF / CSV / Excel upload and background parsing.
  - name: cas_invite
    description: Client CAS invite flow — MFD-side generation and client-facing public endpoints.
  - name: admin
    description: "Admin controls — whitelist, OCR correction, CAS config, secrets, feature flags."
  - name: admin_users
    description: User management — create, list, impersonate, reset portfolio.
  - name: admin_data_pipeline
    description: Data pipeline control — job status, logs, manual triggers, cache invalidation.
  - name: admin_nidp
    description: NIDP diagnostics, job execution, Cloud Run log tailing.

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie set by `POST /api/auth/google`.

  parameters:
    portfolio_id_query:
      name: portfolio_id
      in: query
      schema:
        type: string
      description: Filter by portfolio ID. Empty string = all portfolios.
    profile_id_path:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
      description: MFD client profile ID.
    limit_query:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 100
    format_query:
      name: format
      in: query
      schema:
        type: string
        enum: [csv, xlsx]
        default: csv

  schemas:
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        name:
          type: string
        is_admin:
          type: boolean
        journey_type:
          type: string
          nullable: true
        risk_profile:
          type: object
          nullable: true
        onboarding_completed:
          type: boolean
        copilot_enabled:
          type: boolean

    Portfolio:
      type: object
      properties:
        portfolio_id:
          type: string
        name:
          type: string
        member_name:
          type: string
          nullable: true
        relationship:
          type: string
          nullable: true
        holdings_count:
          type: integer
        created_at:
          type: string
          format: date-time

    Holding:
      type: object
      properties:
        holding_id:
          type: string
        portfolio_id:
          type: string
        name:
          type: string
        ticker:
          type: string
          nullable: true
        asset_type:
          type: string
        quantity:
          type: number
        buy_price:
          type: number
        current_price:
          type: number
        sector:
          type: string
          nullable: true
        buy_date:
          type: string
          format: date
          nullable: true

    Plan:
      type: object
      properties:
        plan_id:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [preview, active, archived]
        actions:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time

    Goal:
      type: object
      properties:
        goal_id:
          type: string
        goal_type:
          type: string
        goal_name:
          type: string
        target_amount_rs:
          type: number
        horizon_years:
          type: integer
        monthly_sip_rs:
          type: number
        on_track_pct:
          type: number
          nullable: true
        status:
          type: string

    Error:
      type: object
      properties:
        detail:
          type: string

security:
  - SessionCookie: []

paths:

  # ══════════════════════════════════════════════════════════════════════════
  # Auth
  # ══════════════════════════════════════════════════════════════════════════
  /api/auth/google:
    post:
      tags: [auth]
      operationId: auth_google
      summary: Exchange Google OAuth credential for a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: Google ID token from `google.accounts.id.initialize` callback.
      responses:
        "200":
          description: Login successful — session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "401":
          description: Invalid credential

  /api/auth/me:
    get:
      tags: [auth]
      operationId: auth_me
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "401":
          description: Not authenticated

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: auth_logout
      summary: Logout — clears session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/google-client-id:
    get:
      tags: [auth]
      operationId: auth_google_client_id
      summary: Return Google OAuth client ID for the Sign-In button
      security: []
      responses:
        "200":
          description: Client ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string

  # ══════════════════════════════════════════════════════════════════════════
  # User & Onboarding
  # ══════════════════════════════════════════════════════════════════════════
  /api/user/profile:
    get:
      tags: [user]
      operationId: user_profile
      summary: Get user profile with onboarding status
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /api/user/journey:
    post:
      tags: [user]
      operationId: user_set_journey
      summary: Set user journey type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journey_type]
              properties:
                journey_type:
                  type: string
                  enum: [self_directed, guided, mfd]
      responses:
        "200":
          description: Updated profile

  /api/user/risk-profile:
    get:
      tags: [user]
      operationId: user_get_risk_profile
      summary: Get user risk profile
      responses:
        "200":
          description: Risk profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_profile:
                    type: object
                    nullable: true

    post:
      tags: [user]
      operationId: user_save_risk_profile
      summary: Save risk profile from questionnaire answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id:
                        type: string
                      answer:
                        type: string
      responses:
        "200":
          description: Computed risk profile

  /api/user/quick-setup:
    post:
      tags: [user]
      operationId: user_quick_setup
      summary: Generate allocation and fund recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [age, risk_appetite, investment_horizon, monthly_investment, goal]
              properties:
                age:
                  type: integer
                risk_appetite:
                  type: string
                  enum: [conservative, moderate, aggressive]
                investment_horizon:
                  type: string
                monthly_investment:
                  type: number
                goal:
                  type: string
      responses:
        "200":
          description: Quick setup result with starter plan

  /api/user/complete-onboarding:
    post:
      tags: [user]
      operationId: user_complete_onboarding
      summary: Mark onboarding complete
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  onboarding_completed:
                    type: boolean

  # ══════════════════════════════════════════════════════════════════════════
  # Portfolio
  # ══════════════════════════════════════════════════════════════════════════
  /api/portfolios:
    get:
      tags: [portfolio]
      operationId: portfolios_list
      summary: List user portfolios
      responses:
        "200":
          description: Portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portfolio'

    post:
      tags: [portfolio]
      operationId: portfolios_create
      summary: Create a new portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                member_name:
                  type: string
                  nullable: true
                relationship:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Created portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'

  /api/portfolios/{portfolio_id}:
    delete:
      tags: [portfolio]
      operationId: portfolios_delete
      summary: Delete a portfolio and all its holdings
      parameters:
        - name: portfolio_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion result

  /api/search/instruments:
    get:
      tags: [portfolio]
      operationId: portfolio_search_instruments
      summary: Search instruments by name or ticker
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query (symbol or company name).
      responses:
        "200":
          description: Matching instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    ticker:
                      type: string

  /api/portfolio/holdings:
    get:
      tags: [portfolio]
      operationId: holdings_list
      summary: Get holdings filtered by portfolio and/or asset type
      parameters:
        - $ref: '#/components/parameters/portfolio_id_query'
        - name: asset_type
          in: query
          schema:
            type: string
            enum: [EQUITY, MUTUAL_FUND, ETF, BOND, GOLD, INTERNATIONAL, OTHER]
      responses:
        "200":
          description: Holdings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holding'

    post:
      tags: [portfolio]
      operationId: holdings_add
      summary: Add a new holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, asset_type, quantity, buy_price, current_price]
              properties:
                name:
                  type: string
                ticker:
                  type: string
                  nullable: true
                asset_type:
                  type: string
                quantity:
                  type: number
                buy_price:
                  type: number
                current_price:
                  type: number
                sector:
                  type: string
                  nullable: true
                buy_date:
                  type: string
                  format: date
                  nullable: true
                portfolio_id:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Created holding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holding'

  /api/portfolio/holdings/{holding_id}:
    put:
      tags: [portfolio]
      operationId: holdings_update
      summary: Update a holding
      parameters:
        - name: holding_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields optional — only provided fields are updated.
              properties:
                name:
                  type: string
                ticker:
                  type: string
                quantity:
                  type: number
                buy_price:
                  type: number
                current_price:
                  type: number
                sector:
                  type: string
                buy_date:
                  type: string
                  format: date
      responses:
        "200":
          description: Updated holding

    delete:
      tags: [portfolio]
      operationId: holdings_delete
      summary: Delete a holding
      parameters:
        - name: holding_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion result

  /api/portfolio/holdings-all:
    delete:
      tags: [portfolio]
      operationId: holdings_delete_all
      summary: Clear ALL holdings for the current user
      responses:
        "200":
          description: Deletion result

  /api/portfolio/holdings-enriched:
    get:
      tags: [portfolio]
      operationId: holdings_enriched
      summary: Portfolio holdings with V3 scores, action badges, and weight %
      parameters:
        - name: fresh
          in: query
          schema:
            type: boolean
            default: false
          description: Force cache bypass.
      responses:
        "200":
          description: Enriched holdings

  /api/portfolio/switch-candidates:
    get:
      tags: [portfolio]
      operationId: portfolio_switch_candidates
      summary: Top replacement funds for a holding (switch recommendations)
      parameters:
        - name: holding_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Switch candidates with score breakdown

  /api/portfolio/international-recommendations:
    get:
      tags: [portfolio]
      operationId: portfolio_intl_recommendations
      summary: International FoF allocation recommendation
      responses:
        "200":
          description: Target %, current exposure, fund bands

  /api/portfolio/international-funds/refresh:
    post:
      tags: [portfolio]
      operationId: portfolio_intl_funds_refresh
      summary: Refresh international fund data cache
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Cache refresh summary

  # ══════════════════════════════════════════════════════════════════════════
  # Plans (V2 Action Plans)
  # ══════════════════════════════════════════════════════════════════════════
  /api/plans/generate:
    post:
      tags: [plans]
      operationId: plans_generate
      summary: Generate a new AI action plan
      responses:
        "200":
          description: Generated plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/Plan'
                  message:
                    type: string

  /api/plans/active:
    get:
      tags: [plans]
      operationId: plans_get_active
      summary: Get the user's active plan
      responses:
        "200":
          description: Active plan or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Plan'
                  has_plan:
                    type: boolean

    delete:
      tags: [plans]
      operationId: plans_archive_active
      summary: Archive the active plan
      responses:
        "200":
          description: Archive result

  /api/plans/active/health-projection:
    get:
      tags: [plans]
      operationId: plans_health_projection
      summary: Project portfolio health if active plan actions are implemented
      responses:
        "200":
          description: Health projection

  /api/plans/history:
    get:
      tags: [plans]
      operationId: plans_history
      summary: Get plan history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Plan history

  /api/plans/refresh:
    post:
      tags: [plans]
      operationId: plans_refresh
      summary: Refresh active plan (creates new version)
      responses:
        "200":
          description: Refreshed plan

  /api/plans/refresh-fundamentals:
    post:
      tags: [plans]
      operationId: plans_refresh_fundamentals
      summary: Refresh fundamentals cache for portfolio stocks
      responses:
        "200":
          description: Refresh result

  /api/plans/{plan_id}:
    get:
      tags: [plans]
      operationId: plans_get
      summary: Get a specific plan by ID
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan document

  /api/plans/{plan_id}/save:
    post:
      tags: [plans]
      operationId: plans_save
      summary: Save a preview plan as the active plan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved plan

  /api/plans/{plan_id}/simulate:
    post:
      tags: [plans]
      operationId: plans_simulate
      summary: Simulate before/after impact of a plan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Simulation result

  /api/plans/{plan_id}/actions/{action_id}:
    patch:
      tags: [plans]
      operationId: plans_update_action
      summary: Update action status (pending/done/skipped)
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
        - name: action_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, done, skipped]
                completion_note:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated plan

  /api/plans/{plan_id}/actions/{action_id}/feedback:
    patch:
      tags: [plans]
      operationId: plans_action_feedback
      summary: Submit feedback on an action recommendation
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
        - name: action_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [useful]
              properties:
                useful:
                  type: boolean
                comment:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated plan

  /api/signals/generate:
    get:
      tags: [plans]
      operationId: signals_generate
      summary: Generate signals without creating a full plan
      responses:
        "200":
          description: Signals with summary

  # ══════════════════════════════════════════════════════════════════════════
  # Goals
  # ══════════════════════════════════════════════════════════════════════════
  /api/goals/snapshot:
    get:
      tags: [goals]
      operationId: goals_get_snapshot
      summary: Get financial snapshot
      responses:
        "200":
          description: Financial snapshot

    put:
      tags: [goals]
      operationId: goals_upsert_snapshot
      summary: Create or update financial snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                age:
                  type: integer
                marital_status:
                  type: string
                dependents:
                  type: integer
                monthly_income_rs:
                  type: number
                income_growth_pct:
                  type: number
                monthly_expenses_rs:
                  type: number
                inflation_pct:
                  type: number
                current_corpus_rs:
                  type: number
                total_liabilities_rs:
                  type: number
                risk_profile:
                  type: string
                behavior_score:
                  type: number
      responses:
        "200":
          description: Updated snapshot

  /api/goals:
    get:
      tags: [goals]
      operationId: goals_list
      summary: List all goals with on-track status
      responses:
        "200":
          description: Goals list

    post:
      tags: [goals]
      operationId: goals_create
      summary: Create a new goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_type, goal_name, target_amount_rs, horizon_years, priority]
              properties:
                goal_type:
                  type: string
                  enum: [retirement, education, home, emergency, wealth, other]
                goal_name:
                  type: string
                target_amount_rs:
                  type: number
                horizon_years:
                  type: integer
                priority:
                  type: string
                  enum: [high, medium, low]
                inflation_pct:
                  type: number
                current_corpus_rs:
                  type: number
                monthly_sip_rs:
                  type: number
                manual_allocation:
                  type: object
                  nullable: true
      responses:
        "200":
          description: Created goal

  /api/goals/fund-shortlist/{bucket}:
    get:
      tags: [goals]
      operationId: goals_fund_shortlist
      summary: Top-N funds for a goal allocation bucket
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
            example: large_cap
        - name: n
          in: query
          schema:
            type: integer
