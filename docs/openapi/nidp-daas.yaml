        security_name: { type: string }
        isin:          { type: string, nullable: true }
        quantity:      { type: number, nullable: true }
        value_cr:      { type: number, nullable: true }
        weight_pct:    { type: number, nullable: true }

    MfScore:
      type: object
      properties:
        as_of_date:          { type: string, format: date }
        isin:                { type: string }
        scheme_code:         { type: string }
        scheme_name:         { type: string }
        fund_category:       { type: string }
        sub_category:        { type: string }
