        - name: market_cap
          in: query
          schema: { type: string, enum: [LARGE_CAP, MID_CAP, SMALL_CAP, MICRO_CAP] }
        - name: min_roe
          in: query
          schema: { type: number }
        - name: max_de
          in: query
          schema: { type: number }
        - name: min_eps_cagr_3y
          in: query
          schema: { type: number }
        - name: min_rev_cagr_3y
          in: query
          schema: { type: number }
        - name: min_rsi
          in: query
          schema: { type: number }
        - name: max_rsi
          in: query
          schema: { type: number }
        - name: max_pe_vs_sector
          in: query
          schema: { type: number }
        - name: sort_by
          in: query
          schema: { type: string, default: momentum_score }
        - name: sort_desc
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Screener results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:       { type: array, items: { $ref: '#/components/schemas/StockScore' } }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/stocks/screener/top:
    get:
      tags: [scores]
      summary: Top N stocks by a single metric
      operationId: getTopStocks
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, example: momentum_score }
        - name: market_cap
          in: query
          schema: { type: string, enum: [LARGE_CAP, MID_CAP, SMALL_CAP, MICRO_CAP] }
        - $ref: '#/components/parameters/limit'
      responses:
        "200":
          description: Top stocks
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric: { type: string }
                  count:  { type: integer }
                  data:   { type: array, items: { $ref: '#/components/schemas/StockScore' } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/mf/performance/{scheme_code}:
    get:
      tags: [scores]
      summary: MF performance analytics and category rank
      operationId: getMfPerformance
      parameters:
        - name: scheme_code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Performance analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MfPerformance' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/mf/performance/category/{category}:
    get:
      tags: [scores]
      summary: Category performance leaderboard
      operationId: getMfCategoryLeaderboard
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string, example: "Large Cap" }
        - name: metric
          in: query
          schema: { type: string, default: composite_rank }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Category leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:  { type: string }
                  rank_date: { type: string, format: date }
                  sorted_by: { type: string }
                  count:     { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:      { type: array, items: { $ref: '#/components/schemas/MfPerformance' } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/mf/scores/{isin}:
    get:
      tags: [scores]
      summary: V3 quality and health score for a MF (by ISIN)
      operationId: getMfScore
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: MF score
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MfScore' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/mf/scores/{isin}/history:
    get:
      tags: [scores]
      summary: MF score history (last N days)
      operationId: getMfScoreHistory
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Score history
          content:
            application/json:
              schema:
                type: object
                properties:
                  isin:    { type: string }
                  days:    { type: integer }
                  count:   { type: integer }
                  history: { type: array, items: { $ref: '#/components/schemas/MfScore' } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/mf/scores/bulk:
    post:
      tags: [scores]
      summary: Bulk MF scores by ISIN list
      operationId: getMfScoresBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isins]
              properties:
                isins:
                  type: array
                  items: { type: string }
                  maxItems: 200
      responses:
        "200":
          description: Scores keyed by ISIN
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                additionalProperties:
                  $ref: '#/components/schemas/MfScore'
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── INTELLIGENCE ─────────────────────────────────────────────────────────────

  /v1/intelligence/reference/securities:
    get:
      tags: [intelligence]
      summary: Canonical security reference universe
      operationId: listRefSecurities
      parameters:
        - name: entity_type
          in: query
          schema: { type: string, enum: [EQUITY, MUTUAL_FUND, INDEX, COMMODITY, CURRENCY] }
        - name: asset_class
          in: query
          schema: { type: string }
        - name: symbol
          in: query
          schema: { type: string }
        - name: isin
          in: query
          schema: { type: string }
        - name: amfi_scheme_code
          in: query
          schema: { type: string }
        - name: sector
          in: query
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Reference securities
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        security_id:      { type: string, format: uuid }
                        entity_type:      { type: string }
                        asset_class:      { type: string }
                        symbol:           { type: string, nullable: true }
                        isin:             { type: string, nullable: true }
                        nse_symbol:       { type: string, nullable: true }
                        bse_code:         { type: string, nullable: true }
                        amfi_scheme_code: { type: string, nullable: true }
                        security_name:    { type: string }
                        sector:           { type: string, nullable: true }
                        industry:         { type: string, nullable: true }
                        is_active:        { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/intelligence/dq/scores:
    get:
      tags: [intelligence]
      summary: Data quality scores per dataset (accuracy, freshness, consistency, completeness)
      operationId: getIntelligenceDqScores
      parameters:
        - name: target_date
          in: query
          schema: { type: string, format: date }
        - name: dataset_name
          in: query
          schema: { type: string }
        - name: quality_tier
          in: query
          schema: { type: string, enum: [GOLD, SILVER, BRONZE, UNVERIFIED] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: DQ score rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        score_id:           { type: string }
                        target_date:        { type: string, format: date }
                        dataset_name:       { type: string }
                        freshness_score:    { type: number }
                        accuracy_score:     { type: number }
                        consistency_score:  { type: number }
                        completeness_score: { type: number }
                        overall_score:      { type: number }
                        quality_tier:       { type: string }
                        computed_at:        { type: string, format: date-time }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/intelligence/graph/correlations:
    get:
      tags: [intelligence]
      summary: Correlation edges for a security
      operationId: getCorrelations
      parameters:
        - name: security_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: relationship_type
          in: query
          schema: { type: string, enum: [STOCK_STOCK, STOCK_INDEX, STOCK_MF] }
        - name: window_days
          in: query
          schema: { type: integer, default: 252 }
        - name: as_of_date
          in: query
          schema: { type: string, format: date }
        - name: min_abs_corr
          in: query
          schema: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Correlation edges
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        correlation_id:      { type: string }
                        as_of_date:          { type: string, format: date }
                        window_days:         { type: integer }
                        left_security_id:    { type: string, format: uuid }
                        right_security_id:   { type: string, format: uuid }
                        relationship_type:   { type: string }
                        correlation_value:   { type: number }
                        abs_correlation:     { type: number }
                        method:              { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/intelligence/graph/correlations/bulk:
    post:
      tags: [intelligence]
      summary: Correlation sub-graph for a portfolio of securities
      operationId: getCorrelationsBulk
      parameters:
        - name: min_abs_corr
          in: query
          schema: { type: number, default: 0.5 }
        - name: window_days
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [security_ids]
              properties:
                security_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 50
      responses:
        "200":
          description: Portfolio correlation graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:  { type: array, items: { type: object } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/intelligence/snapshots/market:
    get:
      tags: [intelligence]
      summary: Intelligence-layer market snapshot (regime signals)
      operationId: getIntelligenceMarketSnapshot
      parameters:
        - name: 'on'
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Intelligence market snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      as_of_date:         { type: string, format: date }
                      nifty50_close:      { type: number }
                      market_regime:      { type: string, nullable: true }
                      fii_flow_signal:    { type: string, nullable: true }
                      dii_flow_signal:    { type: string, nullable: true }
                      volatility_regime:  { type: string, nullable: true }
                      breadth_signal:     { type: string, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── DQ GATE ──────────────────────────────────────────────────────────────────

  /v1/dq/status:
    get:
      tags: [dq]
      summary: Current data quality gate status
      operationId: getDqStatus
      parameters:
        - name: as_of
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: DQ status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DQStatus' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/dq/verdicts:
    get:
      tags: [dq]
      summary: Gate verdict log
      operationId: listDqVerdicts
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Verdict rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string }
                        gate_id:     { type: integer }
                        feed:        { type: string, nullable: true }
                        target_date: { type: string, format: date }
                        verdict:     { type: string, enum: [PASS, REVIEW, FAIL] }
                        severity:    { type: string }
                        created_at:  { type: string, format: date-time }
                        details:     {}
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/dq/dlq:
    get:
      tags: [dq]
      summary: Dead-letter queue — failed gate findings pending replay
      operationId: getDqDlq
      responses:
        "200":
          description: DLQ items
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:             { type: string }
                        gate_id:        { type: integer }
                        feed:           { type: string }
                        target_date:    { type: string, format: date, nullable: true }
                        failure_reason: { type: string }
                        severity:       { type: string }
                        replay_status:  { type: string, enum: [pending, replaying, resolved, abandoned] }
                        created_at:     { type: string, format: date-time }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── REPLAY ───────────────────────────────────────────────────────────────────

  /v1/replay/policies:
    get:
      tags: [replay]
      summary: Available replay policies
      operationId: listReplayPolicies
      responses:
        "200":
          description: Policy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        policy_id:   { type: string }
                        name:        { type: string }
                        version:     { type: string }
                        description: { type: string }
                        parameters:  { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/replay/start:
    post:
      tags: [replay]
      summary: Start a historical replay run
      operationId: startReplay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartReplayRequest' }
      responses:
        "200":
          description: Replay started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:        { type: boolean }
                  replay_id: { type: string }
                  status:    { type: string }
                  message:   { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/replay/{replay_id}:
    get:
      tags: [replay]
      summary: Replay run status
      operationId: getReplay
      parameters:
        - name: replay_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Replay status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:        { type: boolean }
                  replay_id: { type: string }
                  status:    { type: string, enum: [queued, running, completed, failed] }
                  progress:  { type: object, nullable: true }
                  result:    { type: object, nullable: true }
                  error:     { type: string, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/replay/{replay_id}/results:
    get:
      tags: [replay]
      summary: Detailed replay results and timeline
      operationId: getReplayResults
      parameters:
        - name: replay_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Replay results
          content:
            application/json:
              schema:
                type: object
                properties:
                  replay_id: { type: string }
                  status:    { type: string }
                  summary:
                    type: object
                    properties:
                      start_date:   { type: string, format: date }
                      end_date:     { type: string, format: date }
                      domains:      { type: array, items: { type: string } }
                      days_run:     { type: integer }
                      days_failed:  { type: integer }
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        date:    { type: string, format: date }
                        status:  { type: string }
                        message: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

