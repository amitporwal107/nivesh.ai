    MfPerformance:
      type: object
      properties:
        scheme_code:          { type: string }
        rank_date:            { type: string, format: date }
        scheme_name:          { type: string }
        category:             { type: string }
        sub_category:         { type: string }
        amc_code:             { type: string }
        return_1m:            { type: number, nullable: true }
        return_3m:            { type: number, nullable: true }
        return_6m:            { type: number, nullable: true }
        return_1y:            { type: number, nullable: true }
        return_2y:            { type: number, nullable: true }
        return_3y:            { type: number, nullable: true }
        return_5y:            { type: number, nullable: true }
        return_ytd:           { type: number, nullable: true }
        return_since_launch_cagr: { type: number, nullable: true }
        volatility_1y:        { type: number, nullable: true }
        sharpe_1y:            { type: number, nullable: true }
        sortino_1y:           { type: number, nullable: true }
        max_drawdown_1y:      { type: number, nullable: true }
        alpha_1y:             { type: number, nullable: true }
        beta_1y:              { type: number, nullable: true }
        ter:                  { type: number, nullable: true }
        return_1y_rank:       { type: integer, nullable: true }
        return_3y_rank:       { type: integer, nullable: true }
        sharpe_rank:          { type: integer, nullable: true }
        composite_rank:       { type: integer, nullable: true }

    DQStatus:
      type: object
      properties:
        as_of_date:     { type: string, format: date }
        dq_status:      { type: string, enum: [GREEN, AMBER, RED] }
        snapshot_id:    { type: string, nullable: true }
        feeds_ready:    { type: array, items: { type: string } }
        feeds_blocked:  { type: array, items: { type: string } }
        feeds_amber:    { type: array, items: { type: string } }
        degraded_feeds:
          type: array
          items:
            type: object
            properties:
              feed:               { type: string }
              last_successful_run: { type: string, format: date-time, nullable: true }
              staleness_days:     { type: number, nullable: true }
