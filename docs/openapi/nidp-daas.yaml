    StartReplayRequest:
      type: object
      required: [start_date, end_date]
      properties:
        start_date:       { type: string, format: date }
        end_date:         { type: string, format: date }
        domains:          { type: array, items: { type: string }, default: [mf, equity] }
        policy_version:   { type: string, default: v1 }
        parallel:         { type: integer, minimum: 1, maximum: 32, default: 4 }
        inject_failures:  { type: boolean, default: false }
        reset_data:       { type: boolean, default: false }
        failure_seed:     { type: integer, nullable: true }
        failure_rate:     { type: number, minimum: 0, maximum: 1, default: 0.10 }
        skip_weekends:    { type: boolean, default: true }


  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              status: 401
              message: invalid_api_key
              request_id: req-abc123

    Forbidden:
      description: Valid key but insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RateLimitExceeded:
      description: Rate limit or daily quota exceeded
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the rate limit window resets
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
# ── PATHS ─────────────────────────────────────────────────────────────────────

paths:

  # ── SYSTEM ──────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [system]
      summary: Service health
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:              { type: boolean }
                  db_ok:           { type: boolean }
                  db_latency_ms:   { type: number }
                  service:         { type: string }
                  error:           { type: string, nullable: true }

  /v1/me:
    get:
      tags: [system]
      summary: Current key identity and quota
      operationId: getMe
      responses:
        "200":
          description: Key metadata + live quota
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:      { type: string }
                  key_prefix:  { type: string }
                  name:        { type: string }
                  owner_email: { type: string }
                  plan:        { type: string }
                  rate_limit:
                    type: object
                    properties:
                      limit_rpm:      { type: integer }
                      remaining_rpm:  { type: integer }
                      reset_seconds:  { type: integer }
                  daily_quota:
                    type: object
                    properties:
                      limit:     { type: integer, nullable: true }
                      used:      { type: integer }
                      remaining: { type: integer, nullable: true }
                  expires_at:  { type: string, format: date-time, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/me/usage:
    get:
      tags: [system]
      summary: API usage time-series for this key
      operationId: getMyUsage
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Daily usage breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:  { type: string }
                  days:    { type: integer }
                  totals:
                    type: object
                    properties:
                      requests: { type: integer }
                      errors:   { type: integer }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        day:             { type: string, format: date }
                        requests:        { type: integer }
                        errors:          { type: integer }
                        last_request_at: { type: string, format: date-time, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/catalog:
    get:
      tags: [system]
      summary: Public dataset catalog with row counts and date ranges
      operationId: getCatalog
      responses:
        "200":
          description: Dataset index
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:  { type: string, format: date-time }
                  totals:
                    type: object
                    properties:
                      datasets: { type: integer }
                  by_domain:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:   { type: string }
                        datasets: { type: integer }
                        rows:     { type: integer }
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        name:       { type: string }
                        table:      { type: string }
                        date_col:   { type: string }
                        domain:     { type: string }
                        endpoints:  { type: array, items: { type: string } }
                        description: { type: string }
                        rows:       { type: integer }
                        first_at:   { type: string, format: date, nullable: true }
                        last_at:    { type: string, format: date, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── ADMIN ───────────────────────────────────────────────────────────────────

  /admin/keys:
    get:
      tags: [admin]
      summary: List all API keys
      operationId: listAdminKeys
      security: [{ AdminBearer: [] }]
      responses:
        "200":
          description: All keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [admin]
      summary: Issue a new API key
      operationId: createAdminKey
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewKeyRequest' }
      responses:
        "201":
          description: Key issued — cleartext_token shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewKeyResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /admin/keys/{key_id}:
    delete:
      tags: [admin]
      summary: Revoke an API key (idempotent)
      operationId: revokeAdminKey
      security: [{ AdminBearer: [] }]
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                  key_id:  { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── PRICES ──────────────────────────────────────────────────────────────────

  /v1/prices/eod/{symbol}:
    get:
      tags: [prices]
      summary: EOD OHLCV for a symbol
      operationId: getPricesEod
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string, example: TCS }
        - name: series
          in: query
          schema: { type: string, enum: [EQ, BE, BZ], default: EQ }
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: EOD rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:     { type: string }
                  as_of:      { type: string, format: date }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:       { type: array, items: { $ref: '#/components/schemas/EodRow' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/prices/adjusted/{symbol}:
    get:
      tags: [prices]
      summary: Split/dividend adjusted + total-return prices
      operationId: getPricesAdjusted
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Adjusted price rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:     { type: string }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  note:       { type: string }
                  data:       { type: array, items: { $ref: '#/components/schemas/AdjustedRow' } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/prices/latest/{symbol}:
    get:
      tags: [prices]
      summary: Latest EOD snapshot for a symbol
      operationId: getPricesLatest
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest price row
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EodRow' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/prices/delivery/{symbol}:
    get:
      tags: [prices]
      summary: Delivery volume and percentage series
      operationId: getPricesDelivery
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Delivery rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        as_of_date: { type: string, format: date }
                        symbol:     { type: string }
                        deliv_qty:  { type: integer }
                        deliv_pct:  { type: number }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/prices/index/{index_name}:
    get:
      tags: [prices]
      summary: Index EOD series (e.g. NIFTY 50, NIFTY BANK)
      operationId: getPricesIndex
      parameters:
        - name: index_name
          in: path
          required: true
          schema: { type: string, example: "NIFTY 50" }
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Index EOD rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        as_of_date:  { type: string, format: date }
                        index_name:  { type: string }
                        open_price:  { type: number }
                        high_price:  { type: number }
                        low_price:   { type: number }
                        close_price: { type: number }
                        return_pct:  { type: number, nullable: true }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── CORPORATE ACTIONS ────────────────────────────────────────────────────────

  /v1/corporate-actions:
    get:
      tags: [corporate-actions]
      summary: Corporate actions — all symbols
      operationId: listCorporateActions
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
        - name: action_type
          in: query
          schema: { type: string, enum: [DIVIDEND, SPLIT, BONUS, RIGHTS, MERGER, DEMERGER, BUYBACK, AGM, BOARD_MEETING, OTHER] }
        - name: ex_from
          in: query
          schema: { type: string, format: date }
        - name: ex_to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Corporate action rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:       { type: array, items: { $ref: '#/components/schemas/CorporateAction' } }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/corporate-actions/{symbol}:
    get:
      tags: [corporate-actions]
      summary: Corporate actions for a single symbol
      operationId: getCorporateActions
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: action_type
          in: query
          schema: { type: string, enum: [DIVIDEND, SPLIT, BONUS, RIGHTS, MERGER, DEMERGER, BUYBACK, AGM, BOARD_MEETING, OTHER] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Actions for symbol
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:     { type: string }
                  data:       { type: array, items: { $ref: '#/components/schemas/CorporateAction' } }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── INDICES ──────────────────────────────────────────────────────────────────

  /v1/indices:
    get:
      tags: [indices]
      summary: All tracked indices with date coverage
      operationId: listIndices
      responses:
        "200":
          description: Index list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        index_name:   { type: string }
                        days_tracked: { type: integer }
                        first_date:   { type: string, format: date }
                        latest_date:  { type: string, format: date }
                  count: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/indices/{index_name}/constituents:
    get:
      tags: [indices]
      summary: Index constituents on a given date
      operationId: getIndexConstituents
      parameters:
        - name: index_name
          in: path
          required: true
          schema: { type: string, example: "NIFTY 50" }
        - name: 'on'
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Constituent rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  index_name: { type: string }
                  as_of:      { type: string, format: date }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        as_of_date:   { type: string, format: date }
                        index_name:   { type: string }
                        symbol:       { type: string }
                        isin:         { type: string }
                        company_name: { type: string }
                        industry:     { type: string }
                        weight_pct:   { type: number, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── REFERENCE DATA ───────────────────────────────────────────────────────────

  /v1/symbols:
    get:
      tags: [reference]
      summary: Full symbol master
      operationId: listSymbols
      parameters:
        - name: sector
          in: query
          schema: { type: string }
        - name: series
          in: query
          schema: { type: string, default: EQ }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Symbol list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:       { type: array, items: { $ref: '#/components/schemas/Symbol' } }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/symbols/search:
    get:
      tags: [reference]
      summary: Full-text symbol / company search
      operationId: searchSymbols
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, example: TCS }
        - $ref: '#/components/parameters/limit'
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:       { type: string }
                        company_name: { type: string }
                        sector:       { type: string }
                        industry:     { type: string }
                        isin:         { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/symbols/{symbol}:
    get:
      tags: [reference]
      summary: Symbol master detail
      operationId: getSymbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Symbol detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Symbol' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/sectors:
    get:
      tags: [reference]
      summary: Sector taxonomy with symbol counts
      operationId: listSectors
      responses:
        "200":
          description: Sector list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        sector:             { type: string }
                        symbols:            { type: integer }
                        industries_resolved: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/holidays:
    get:
      tags: [reference]
      summary: NSE/BSE exchange holiday calendar
      operationId: listHolidays
      parameters:
        - name: segment
          in: query
          schema: { type: string, enum: [CM, FO, CD, COM, DEBT, MF], default: CM }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Holiday rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  segment:    { type: string }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        holiday_date: { type: string, format: date }
                        segment:      { type: string }
                        description:  { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── FINANCIALS & SHAREHOLDING ─────────────────────────────────────────────────

  /v1/financials/{symbol}:
    get:
      tags: [financials]
      summary: Quarterly / annual financial results
      operationId: getFinancials
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: consolidated
          in: query
          schema: { type: boolean, default: true }
        - name: period_from
          in: query
          schema: { type: string, format: date }
        - name: period_to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Financial rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:     { type: string }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:       { type: array, items: { $ref: '#/components/schemas/FinancialRow' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/shareholding/{symbol}:
    get:
      tags: [financials]
      summary: Quarterly shareholding pattern
      operationId: getShareholding
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: period_from
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: Shareholding rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:     { type: string }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:       { type: array, items: { $ref: '#/components/schemas/ShareholdingRow' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── F&O ─────────────────────────────────────────────────────────────────────

  /v1/fno/{symbol}:
    get:
      tags: [fno]
      summary: F&O bhavcopy rows for a symbol
      operationId: getFno
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: 'on'
          in: query
          schema: { type: string, format: date }
        - name: instrument_type
          in: query
          schema: { type: string, enum: [FUTIDX, FUTSTK, OPTIDX, OPTSTK] }
        - name: expiry
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: F&O rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:     { type: string }
                  as_of:      { type: string, format: date }
                  count:      { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  data:       { type: array, items: { $ref: '#/components/schemas/FnoRow' } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/fno/{symbol}/chain:
    get:
      tags: [fno]
      summary: Option chain for a symbol and expiry
      operationId: getFnoChain
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: expiry
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Option chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:       { type: string }
                  as_of:        { type: string, format: date }
                  expiry:       { type: string, format: date }
                  strike_count: { type: integer }
                  strikes:
                    type: array
                    items:
                      type: object
                      properties:
                        strike: { type: number }
                        CE:     { type: object }
                        PE:     { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/fno/{symbol}/expiries:
    get:
      tags: [fno]
      summary: Available expiry dates for a symbol
      operationId: getFnoExpiries
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Expiry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: { type: string }
                  count:  { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        expiry_date:     { type: string, format: date }
                        ce_count:        { type: integer }
                        pe_count:        { type: integer }
                        futures_count:   { type: integer }
                        latest_seen:     { type: string, format: date }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── FLOWS ────────────────────────────────────────────────────────────────────

  /v1/flows/fii-dii:
    get:
      tags: [flows]
      summary: FII/DII institutional flows
      operationId: getFiiDiiFlows
