openapi: 3.1.0

info:
  title: NIDP DaaS API
  version: "1.0"
  description: |
    **NIDP Data-as-a-Service (DaaS) API** — the external-facing data plane for the
    Nivesh Intelligence Data Platform.

    Provides programmatic access to Indian equity and mutual-fund market data:
    EOD prices, corporate actions, F&O chains, FII/DII flows, fundamentals,
    shareholding patterns, macro indicators, corporate announcements, ML-derived
    features, V3 stock/MF scores, and the intelligence graph.

    ## Authentication
    Every request (except `/health`) requires an API key sent in **one** of:
    - `X-API-Key: nvd_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx`
    - `Authorization: Bearer nvd_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx`

    Admin endpoints additionally require a separate internal bearer token
    (`NIDP_DAAS_INTERNAL_TOKEN`).

    ## Plans & Rate Limits
    | Plan | RPM | Daily |
    |------|-----|-------|
    | free | 60 | 1 000 |
    | standard | 300 | 50 000 |
    | pro | 1 500 | 500 000 |
    | internal | 6 000 | unlimited |

    Rate-limit state is returned in every response:
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`,
    `X-Daily-Limit`, `X-Daily-Remaining`.

    ## Data Quality Headers
    Every authenticated response carries:
    - `X-DQ-Status: GREEN | AMBER | RED` — overall data certification status
    - `X-DQ-As-Of-Date` — date the DQ snapshot was computed
    - `X-DQ-Snapshot-Id` — snapshot reference ID

    ## Pagination
    List endpoints accept `limit` (default 100, max 500) and `offset`.
    Responses wrap data in `{ data, count, pagination, as_of }`.

servers:
  - url: https://data.niveshcopilot.com/daas
    description: Production

tags:
  - name: system
    description: Health and key identity
  - name: admin
    description: API key lifecycle (internal bearer token required)
  - name: prices
    description: EOD OHLCV, adjusted prices, delivery, index series
  - name: corporate-actions
    description: Dividends, splits, bonuses, buybacks, mergers
  - name: indices
    description: Index universe and constituent snapshots
  - name: reference
    description: Symbol master, sector taxonomy, market holidays
  - name: financials
    description: Quarterly P&L, balance sheet, shareholding pattern
  - name: fno
    description: F&O bhavcopy, option chains, expiry calendars
  - name: flows
    description: FII/DII institutional flows, bulk/block deals
  - name: announcements
    description: NSE/BSE corporate announcements with AI classification
  - name: macro
    description: RBI G-Sec yields, FRED global macro series
  - name: snapshots
    description: Pre-aggregated daily market and stock snapshots
  - name: features
    description: ML-engineered technical and quantitative features
  - name: events
    description: Corporate event calendar and AI-derived signals
  - name: mutual-funds
    description: AMC/scheme master, NAV history, holdings, MF scores
  - name: scores
    description: V3 stock screener scores and MF quality/health scores
  - name: intelligence
    description: Reference securities, entity graph, DQ scores
  - name: dq
    description: Data quality gate verdicts and dead-letter queue
  - name: replay
    description: Historical replay and backtesting engine

# ── SECURITY ──────────────────────────────────────────────────────────────────

security:
  - ApiKeyHeader: []
  - ApiKeyBearer: []

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: "API key prefixed `nvd_`. Preferred auth method."
    ApiKeyBearer:
      type: http
      scheme: bearer
      description: "Pass the same `nvd_` API key as a Bearer token."
    AdminBearer:
      type: http
      scheme: bearer
      description: "Internal admin token (NIDP_DAAS_INTERNAL_TOKEN). Required for /admin/* endpoints."

  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      description: Max rows to return.
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      description: Number of rows to skip.
    start:
      name: start
      in: query
      schema: { type: string, format: date }
      description: "Inclusive start date (YYYY-MM-DD)."
    end:
      name: end
      in: query
      schema: { type: string, format: date }
      description: "Inclusive end date (YYYY-MM-DD)."

  schemas:
    Pagination:
      type: object
      properties:
        limit:    { type: integer }
        offset:   { type: integer }
        total:    { type: integer, nullable: true }
        next_offset: { type: integer, nullable: true }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:     { type: integer }
            message:    { type: string }
            details:    { type: array, items: {} }
            request_id: { type: string }

    # ── Domain schemas ────────────────────────────────────────────────────────

    ApiKey:
      type: object
      properties:
        key_id:          { type: string }
        key_prefix:      { type: string, example: "nvd_ab12" }
        name:            { type: string }
        owner_email:     { type: string }
        plan:            { type: string, enum: [free, standard, pro, internal] }
        status:          { type: string, enum: [active, revoked, expired] }
        rate_limit_rpm:  { type: integer }
        daily_quota:     { type: integer, nullable: true }
        created_at:      { type: string, format: date-time }
        expires_at:      { type: string, format: date-time, nullable: true }
        notes:           { type: string, nullable: true }

    NewKeyRequest:
      type: object
      required: [name, owner_email, plan]
      properties:
        name:             { type: string }
        owner_email:      { type: string, format: email }
        plan:             { type: string, enum: [free, standard, pro, internal] }
        rate_limit_rpm:   { type: integer, nullable: true }
        daily_quota:      { type: integer, nullable: true }
        expires_in_days:  { type: integer, nullable: true }
        notes:            { type: string }

    NewKeyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            cleartext_token: { type: string, description: "Shown once only." }

    EodRow:
      type: object
      properties:
        as_of_date:   { type: string, format: date }
        symbol:       { type: string }
        series:       { type: string }
        isin:         { type: string }
        prev_close:   { type: number }
        open_price:   { type: number }
        high_price:   { type: number }
        low_price:    { type: number }
        close_price:  { type: number }
        last_price:   { type: number }
        avg_price:    { type: number }
        volume:       { type: integer }
        turnover:     { type: number }
        trades:       { type: integer }
        deliv_qty:    { type: integer }
        deliv_pct:    { type: number }

    AdjustedRow:
      type: object
      properties:
        symbol:                  { type: string }
        as_of_date:              { type: string, format: date }
        raw_open:                { type: number }
        raw_high:                { type: number }
        raw_low:                 { type: number }
        raw_close:               { type: number }
        raw_volume:              { type: integer }
        adj_open:                { type: number }
        adj_high:                { type: number }
        adj_low:                 { type: number }
        adj_close:               { type: number }
        adj_volume:              { type: integer }
        tret_close:              { type: number }
        cumulative_adj_factor:   { type: number }
        cumulative_tret_factor:  { type: number }
        last_event_ex_date:      { type: string, format: date, nullable: true }
        last_event_type:         { type: string, nullable: true }

    CorporateAction:
      type: object
      properties:
        symbol:            { type: string }
        series:            { type: string }
        action_type:       { type: string, enum: [DIVIDEND, SPLIT, BONUS, RIGHTS, MERGER, DEMERGER, BUYBACK, AGM, BOARD_MEETING, OTHER] }
        action_subtype:    { type: string, nullable: true }
        purpose:           { type: string }
        ratio:             { type: string, nullable: true }
        face_value_pre:    { type: number, nullable: true }
        face_value_post:   { type: number, nullable: true }
        dividend_amount:   { type: number, nullable: true }
        record_date:       { type: string, format: date, nullable: true }
        ex_date:           { type: string, format: date, nullable: true }
        bc_start_date:     { type: string, format: date, nullable: true }
        bc_end_date:       { type: string, format: date, nullable: true }
        announcement_date: { type: string, format: date, nullable: true }

    Symbol:
      type: object
      properties:
        symbol:        { type: string }
        company_name:  { type: string }
        series:        { type: string }
        isin:          { type: string }
        listing_date:  { type: string, format: date }
        face_value:    { type: number }
        market_lot:    { type: integer }
        sector:        { type: string }
        industry:      { type: string }

    FinancialRow:
      type: object
      properties:
        symbol:                  { type: string }
        period_end:              { type: string, format: date }
        period_start:            { type: string, format: date }
        period_type:             { type: string, enum: [Q, H, A] }
        consolidated:            { type: boolean }
        audited:                 { type: boolean }
        revenue_from_ops_cr:     { type: number, nullable: true }
        other_income_cr:         { type: number, nullable: true }
        total_income_cr:         { type: number, nullable: true }
        total_expenses_cr:       { type: number, nullable: true }
        ebitda_cr:               { type: number, nullable: true }
        finance_costs_cr:        { type: number, nullable: true }
        depreciation_cr:         { type: number, nullable: true }
        pbt_before_exc_cr:       { type: number, nullable: true }
        exceptional_items_cr:    { type: number, nullable: true }
        pbt_cr:                  { type: number, nullable: true }
        tax_expense_cr:          { type: number, nullable: true }
        pat_cr:                  { type: number, nullable: true }
        pat_attrib_owners_cr:    { type: number, nullable: true }
        eps_basic:               { type: number, nullable: true }
        eps_diluted:             { type: number, nullable: true }
        face_value:              { type: number, nullable: true }
        total_equity_cr:         { type: number, nullable: true }
        long_term_debt_cr:       { type: number, nullable: true }
        short_term_debt_cr:      { type: number, nullable: true }
        cash_and_equiv_cr:       { type: number, nullable: true }
        broadcast_at:            { type: string, format: date-time }

    ShareholdingRow:
      type: object
      properties:
        symbol:                       { type: string }
        period_end:                   { type: string, format: date }
        promoter_pct:                 { type: number, nullable: true }
        promoter_pledged_pct:         { type: number, nullable: true }
        promoter_pledged_to_total_pct: { type: number, nullable: true }
        fii_pct:                      { type: number, nullable: true }
        dii_pct:                      { type: number, nullable: true }
        mf_pct:                       { type: number, nullable: true }
        insurance_pct:                { type: number, nullable: true }
        bank_fi_pct:                  { type: number, nullable: true }
        govt_holding_pct:             { type: number, nullable: true }
        public_pct:                   { type: number, nullable: true }
        individual_pct:               { type: number, nullable: true }
        nri_pct:                      { type: number, nullable: true }
        bodies_corporate_pct:         { type: number, nullable: true }
        total_shares:                 { type: integer, nullable: true }
        broadcast_at:                 { type: string, format: date-time }

    FnoRow:
      type: object
      properties:
        as_of_date:       { type: string, format: date }
        ticker_symbol:    { type: string }
        instrument_type:  { type: string, enum: [FUTIDX, FUTSTK, OPTIDX, OPTSTK] }
        expiry_date:      { type: string, format: date }
        strike_price:     { type: number, nullable: true }
        option_type:      { type: string, enum: [CE, PE], nullable: true }
        open_price:       { type: number }
        high_price:       { type: number }
        low_price:        { type: number }
        close_price:      { type: number }
        settle_price:     { type: number }
        underlying_price: { type: number }
        open_interest:    { type: integer }
        change_in_oi:     { type: integer }
        traded_volume:    { type: integer }
        traded_value:     { type: number }
        num_trades:       { type: integer }

    FiiDiiRow:
      type: object
      properties:
        as_of_date:     { type: string, format: date }
        category:       { type: string, enum: [FII, DII, PROP, CLIENT] }
        segment:        { type: string }
        buy_value_cr:   { type: number }
        sell_value_cr:  { type: number }
        net_value_cr:   { type: number }
        buy_contracts:  { type: integer, nullable: true }
        sell_contracts: { type: integer, nullable: true }
        net_contracts:  { type: integer, nullable: true }
        open_interest:  { type: integer, nullable: true }

    DealRow:
      type: object
      properties:
        as_of_date:   { type: string, format: date }
        symbol:       { type: string }
        client_name:  { type: string }
        deal_type:    { type: string, enum: [BUY, SELL] }
        quantity:     { type: integer }
        avg_price:    { type: number }
        deal_seq:     { type: integer }
        remarks:      { type: string, nullable: true }

    Announcement:
      type: object
      properties:
        announcement_id:   { type: string }
        source:            { type: string, enum: [NSE_ANN, BSE_ANN] }
        ticker_symbol:     { type: string, nullable: true }
        isin:              { type: string, nullable: true }
        scrip_code:        { type: string, nullable: true }
        company_name:      { type: string }
        filed_at:          { type: string, format: date-time }
        broadcast_at:      { type: string, format: date-time }
        subject:           { type: string }
        raw_category:      { type: string }
        attachment_url:    { type: string, nullable: true }
        event_category:    { type: string, nullable: true }
        impact_score:      { type: number, nullable: true }
        sentiment:         { type: string, enum: [positive, neutral, negative], nullable: true }
        classifier_version: { type: string, nullable: true }
        classified_at:     { type: string, format: date-time, nullable: true }

    RbiYieldRow:
      type: object
      properties:
        as_of_date:  { type: string, format: date }
        tenor:       { type: string, enum: [OVERNIGHT, "91D", "364D", 1Y, 5Y, 10Y] }
        instrument:  { type: string }
        yield_pct:   { type: number }

    FredRow:
      type: object
      properties:
        as_of_date:   { type: string, format: date }
        series_id:    { type: string }
        series_name:  { type: string }
        value:        { type: number, nullable: true }
        units:        { type: string }
        frequency:    { type: string }

    StockFeatureRow:
      type: object
      properties:
        symbol:              { type: string }
        as_of_date:          { type: string, format: date }
        close:               { type: number }
        sma20:               { type: number, nullable: true }
        sma50:               { type: number, nullable: true }
        sma100:              { type: number, nullable: true }
        sma200:              { type: number, nullable: true }
        sma50_slope:         { type: number, nullable: true }
        dist_200dma_pct:     { type: number, nullable: true }
        dist_52w_high_pct:   { type: number, nullable: true }
        dist_52w_low_pct:    { type: number, nullable: true }
        rsi14:               { type: number, nullable: true }
        macd:                { type: number, nullable: true }
        macd_signal:         { type: number, nullable: true }
        macd_hist:           { type: number, nullable: true }
        return_5d_pct:       { type: number, nullable: true }
        return_20d_pct:      { type: number, nullable: true }
        return_60d_pct:      { type: number, nullable: true }
        atr14:               { type: number, nullable: true }
        atr_pct:             { type: number, nullable: true }
        bb_width:            { type: number, nullable: true }
        bb_pos:              { type: number, nullable: true }
        avg_volume_20:       { type: number, nullable: true }
        vol_z20:             { type: number, nullable: true }
        deliv_pct_avg_20:    { type: number, nullable: true }
        deliv_trend10:       { type: number, nullable: true }
        accumulation_score:  { type: number, nullable: true }

    StockScore:
      type: object
      properties:
        symbol:                    { type: string }
        as_of_date:                { type: string, format: date }
        sector:                    { type: string }
        industry:                  { type: string }
        market_cap_bucket:         { type: string, enum: [LARGE_CAP, MID_CAP, SMALL_CAP, MICRO_CAP] }
        market_cap_cr:             { type: number }
        roe_pct:                   { type: number, nullable: true }
        debt_to_equity:            { type: number, nullable: true }
        eps_growth_3y_cagr_pct:    { type: number, nullable: true }
        earnings_consistency_score: { type: number, nullable: true }
        promoter_holding_pct:      { type: number, nullable: true }
        revenue_growth_3y_cagr_pct: { type: number, nullable: true }
        profit_margin_trend_pct:   { type: number, nullable: true }
        debt_trend_pct:            { type: number, nullable: true }
        volatility_1y_pct:         { type: number, nullable: true }
        dividend_yield_pct:        { type: number, nullable: true }
        pe_overvaluation_pct:      { type: number, nullable: true }
        earnings_decline_flag:     { type: boolean, nullable: true }
        debt_spike_flag:           { type: boolean, nullable: true }
        liquidity_score:           { type: number, nullable: true }
        momentum_score:            { type: number, nullable: true }
        pe_ttm:                    { type: number, nullable: true }
        pb:                        { type: number, nullable: true }
        roce_pct:                  { type: number, nullable: true }
        interest_coverage:         { type: number, nullable: true }
        profit_margin_pct:         { type: number, nullable: true }
        ev_ebitda:                 { type: number, nullable: true }
        return_252d_pct:           { type: number, nullable: true }
        beta_1y:                   { type: number, nullable: true }
        max_drawdown_1y_pct:       { type: number, nullable: true }
        rsi14:                     { type: number, nullable: true }
        accumulation_score:        { type: number, nullable: true }
        promoter_pct:              { type: number, nullable: true }
        fii_pct:                   { type: number, nullable: true }
        dii_pct:                   { type: number, nullable: true }
        promoter_pledged_pct:      { type: number, nullable: true }
        fii_pct_change_qoq:        { type: number, nullable: true }
        promoter_pct_change_qoq:   { type: number, nullable: true }

    MfScheme:
      type: object
      properties:
        scheme_code:        { type: string }
        scheme_name:        { type: string }
        amc_id:             { type: string }
        amc_name:           { type: string }
        isin_growth:        { type: string, nullable: true }
        isin_idcw:          { type: string, nullable: true }
        scheme_type:        { type: string }
        scheme_category:    { type: string }
