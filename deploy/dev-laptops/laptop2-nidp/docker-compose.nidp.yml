# ─────────────────────────────────────────────────────────────────────────
# LAPTOP 2 — nidp-stack-vm replica
# ─────────────────────────────────────────────────────────────────────────
# Reconstructed from the LIVE VM on 2026-07-19 (inspected on-host), not from
# docs. Sources: /opt/nidp/docker-compose.dev.yml, /etc/cron.d/nidp,
# systemd units nidp-daas-api / nidp-query-api, and `docker inspect` of the
# running containers.
#
# Deliberate differences from the VM (see README "Deviations"):
#   - DaaS + Query API run as CONTAINERS here; on the VM they are systemd
#     units against a host venv at /opt/nidp/venv. Containerising removes
#     the host-venv drift that has bitten that VM before.
#   - Feed jobs run in a scheduler container (supercronic) instead of
#     /etc/cron.d/nidp as user `nidp`.
#   - Redpanda + Schema Registry are behind the `kafka` profile: the live
#     staging env file states the event bus is local because "Kafka is dead".
#     Don't boot a broker on a laptop for nothing.
#
# PORTS (host side). Laptop 1 owns 3000 for the cloudflared origin, so
# Grafana is moved to 3001 here to keep the two stacks non-conflicting even
# if you ever run both on one machine.
#   5433  postgres (TimescaleDB)      9090  prometheus
#   6380  redis                       3001  grafana   (VM used 3000)
#   9000  minio S3 / 9001 console      3100  loki
#   8083  daas-api (direct)           9093  alertmanager
#   8090  query-api (direct)          9100  node-exporter
#   8080  nginx — mirrors the VM's path layout: /daas /query /grafana
#
# Laptop 1 should point at THIS box via the nginx entrypoint so the URLs
# match staging's shape:
#   NIDP_DAAS_BASE_URL=http://<LAPTOP2_LAN_IP>:8080/daas
#   NIDP_QUERY_API_URL=http://<LAPTOP2_LAN_IP>:8080/query
#
# Bring-up:
#   ./up.sh                 core + observability + AI tier
#   ./up.sh --with-feeds    also start the 49-job feed scheduler
#   ./up.sh --with-kafka    also start redpanda + schema registry

name: nidp-laptop

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Shared config for every container that runs NIDP Python code.
x-nidp-common: &nidp-common
  build:
    context: ../../../
    dockerfile: deploy/dev-laptops/laptop2-nidp/Dockerfile.nidp
    args:
      AI_TIER: "false"
  # required:false so `docker compose build` / `config` work before the
  # developer has created .env. up.sh is the gate that enforces real values.
  # Built locally from Dockerfile.nidp — never pulled from a registry.
  pull_policy: build
  env_file:
    - path: ./.env
      required: false
  environment: &nidp-env
    NIDP_POSTGRES_URL: postgresql://${NIDP_PG_USER:-nidp}:${NIDP_PG_PASSWORD:-}@postgres:5432/${NIDP_PG_DB:-nidp}
    NIDP_PG_USER:      ${NIDP_PG_USER:-nidp}
    NIDP_PG_PASSWORD:  ${NIDP_PG_PASSWORD:-}
    NIDP_PG_DB:        ${NIDP_PG_DB:-nidp}
    NIDP_HOME:         /opt/nidp
    NIDP_EVENT_BUS:    ${NIDP_EVENT_BUS:-local}
    NIDP_STORAGE_BACKEND: ${NIDP_STORAGE_BACKEND:-s3}
    NIDP_MINIO_ENDPOINT:  http://minio:9000
    NIDP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-nidp-dev}
    NIDP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
    NIDP_S3_BUCKET:        ${NIDP_S3_BUCKET:-nidp-raw}
    PYTHONPATH:        /app/backend
    PYTHONUNBUFFERED:  "1"
    TZ:                Asia/Kolkata
    LOG_LEVEL:         ${LOG_LEVEL:-info}
  volumes: &nidp-volumes
    # Repo mounted read-only, mirroring the VM's DaaS container which mounts
    # /opt/nidp/repo/backend -> /app/backend (ro).
    - ../../../backend:/app/backend:ro
    - nidp-logs:/opt/nidp/logs
    - nidp-run:/opt/nidp/run
  networks: [nidp-local]
  logging: *default-logging

services:

  # ── Data stores ────────────────────────────────────────────────────────

  postgres:
    # PINNED, not `latest-pg16`. The staging dump was taken from
    # TimescaleDB 2.26.4 / PG 16.13 / pgvector 0.8.1; restoring into a newer
    # TimescaleDB can fail on catalog differences. Bump only together with a
    # freshly taken dump.
    image: timescale/timescaledb:2.26.4-pg16
    container_name: nidp-lt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${NIDP_PG_USER:-nidp}
      POSTGRES_PASSWORD: ${NIDP_PG_PASSWORD:-}
      POSTGRES_DB:       ${NIDP_PG_DB:-nidp}
      # Restoring 19GB wants more headroom than the stock 128MB.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_locks_per_transaction=512      # many hypertable chunks
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - maintenance_work_mem=${PG_MAINT_WORK_MEM:-512MB}
      - -c
      - max_wal_size=4GB
    ports: ["${NIDP_PG_PORT:-5433}:5432"]
    volumes:
      - nidp-pg-data:/var/lib/postgresql/data
      # Dump goes here so restore.sh can reach it from inside the container.
      - ./dumps:/dumps
    networks: [nidp-local]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nidp-lt-redis
    restart: unless-stopped
    ports: ["${NIDP_REDIS_PORT:-6380}:6379"]
    volumes: [nidp-redis-data:/data]
    networks: [nidp-local]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  minio:
    image: minio/minio:latest
    container_name: nidp-lt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-nidp-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [nidp-minio-data:/data]
    networks: [nidp-local]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Creates the raw-archive bucket the ingesters expect. Runs once, exits.
  minio-init:
    image: minio/mc:latest
    container_name: nidp-lt-minio-init
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-nidp-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      NIDP_S3_BUCKET:      ${NIDP_S3_BUCKET:-nidp-raw}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$NIDP_S3_BUCKET &&
        echo 'bucket ready: '$$NIDP_S3_BUCKET
      "
    networks: [nidp-local]

  # ── Migrations (one-shot, `migrate` profile) ───────────────────────────
  # 112 SQL migrations under backend/nidp/migrations, applied by nidp.cli.
  # NOTE: the VM hit a silent failure here once — cmd_migrate inherited the
  # pool's command_timeout=30 and asyncio.TimeoutError stringifies to ''.
  # We set a generous explicit timeout so a slow laptop doesn't reproduce it.
  migrate:
    <<: *nidp-common
    container_name: nidp-lt-migrate
    restart: "no"
    environment:
      <<: *nidp-env
      NIDP_MIGRATION_TIMEOUT: "600"
    command: ["python3", "-m", "nidp.cli", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["migrate"]

  # ── Serving layer ──────────────────────────────────────────────────────

  daas-api:
    <<: *nidp-common
    container_name: nidp-lt-daas-api
    # --root-path /daas matches the VM, where nginx mounts it at that path.
    command:
      - python3
      - -m
      - uvicorn
      - nidp.services.daas_api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8083"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --root-path
      - /daas
    environment:
      <<: *nidp-env
      NIDP_DAAS_INTERNAL_TOKEN: ${NIDP_DAAS_INTERNAL_TOKEN:-}
      NIDP_QUERY_API_BASE_URL:  http://query-api:8090
      NIDP_QUERY_API_TOKEN:     ${NIDP_QUERY_API_TOKEN:-}
      OPENAI_API_KEY:           ${OPENAI_API_KEY:-}
      ROOT_PATH:                /daas
    ports: ["${NIDP_DAAS_PORT:-8083}:8083"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  query-api:
    <<: *nidp-common
    container_name: nidp-lt-query-api
    command:
      - python3
      - -m
      - uvicorn
      - nidp.services.query_api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --root-path
      - /query
    environment:
      <<: *nidp-env
      NIDP_QUERY_API_TOKEN: ${NIDP_QUERY_API_TOKEN:-}
      ROOT_PATH:            /query
    ports: ["${NIDP_QUERY_PORT:-8090}:8090"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Edge nginx — reproduces the VM's path layout ───────────────────────
  # On the VM, data.niveshcopilot.com serves /daas, /query and /grafana off
  # one vhost. Keeping that shape locally means laptop 1 uses URLs that
  # differ from staging only in host:port.
  nginx:
    image: nginx:1.27-alpine
    container_name: nidp-lt-nginx
    restart: unless-stopped
    ports: ["${NIDP_EDGE_PORT:-8080}:8080"]
    volumes:
      - ./nginx/nidp.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [nidp-local]
    logging: *default-logging
    depends_on:
      daas-api:  { condition: service_started }
      query-api: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Feed scheduler (profile: feeds) ────────────────────────────────────
  # AI_TIER=true because document_parser needs tesseract/poppler and the
  # earnings-call tier needs ffmpeg + faster-whisper.
  #
  # ⚠️ Scrapes NSE/BSE/AMFI/RBI from your home IP. Off unless --with-feeds.
  scheduler:
    <<: *nidp-common
    build:
      context: ../../../
      dockerfile: deploy/dev-laptops/laptop2-nidp/Dockerfile.nidp
      args:
        AI_TIER: "true"
    image: nidp/runtime-ai:laptop
    # Built locally — never in a registry. Without this, `docker compose up`
    # emits a confusing "pull access denied ... may require 'docker login'".
    pull_policy: build
    container_name: nidp-lt-scheduler
    # init:true runs docker-init (tini) as PID 1. REQUIRED — without it
    # supercronic becomes PID 1, enables its own process reaper, and dies
    # immediately on ANY crontab:
    #     level=info  msg="reaping dead processes"
    #     level=fatal msg="Failed to fork exec: no such file or directory"
    # Verified this fires even for a one-line `* * * * * echo hello` crontab,
    # so it is the reaper, not the schedule.
    #
    # init:true is preferred over supercronic's -no-reap because the feed jobs
    # fork subprocesses; tini still reaps them, whereas -no-reap alone would
    # let zombies accumulate. With tini as PID 1, supercronic logs:
    #     level=warning msg="process reaping disabled, not pid 1"
    init: true
    command: ["supercronic", "-passthrough-logs", "/etc/nidp/nidp.crontab"]
    environment:
      <<: *nidp-env
      NIDP_DAAS_INTERNAL_TOKEN: ${NIDP_DAAS_INTERNAL_TOKEN:-}
      NIDP_QUERY_API_TOKEN:     ${NIDP_QUERY_API_TOKEN:-}
      OPENAI_API_KEY:           ${OPENAI_API_KEY:-}
      SCREENER_SESSION_COOKIE:  ${SCREENER_SESSION_COOKIE:-}
      FRED_API_KEY:             ${FRED_API_KEY:-}
      NIVESH_POSTGRES_URL:      ${NIVESH_POSTGRES_URL:-}
      WHISPER_DEVICE:           ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE:     ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_MODEL:            ${WHISPER_MODEL:-small}
    volumes:
      - ../../../backend:/app/backend:ro
      - ./cron/nidp.crontab:/etc/nidp/nidp.crontab:ro
      - ./bin/run-feed.sh:/usr/local/bin/run-feed.sh:ro
      - nidp-logs:/opt/nidp/logs
      - nidp-run:/opt/nidp/run
      - nidp-whisper-models:/models      # ASR weights, downloaded on first use
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    profiles: ["feeds"]

  # ── Observability ──────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: nidp-lt-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"     # VM keeps 14d; laptop disk is smaller
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nidp-prom-data:/prometheus
    ports: ["${PROM_PORT:-9090}:9090"]
    networks: [nidp-local]
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.3       # pinned to the version live on the VM
    container_name: nidp-lt-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      # Served under /grafana via the local nginx, same as the VM.
      GF_SERVER_ROOT_URL:            "http://localhost:${NIDP_EDGE_PORT:-8080}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - nidp-grafana-data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
    networks: [nidp-local]
    logging: *default-logging
    depends_on: [prometheus]

  loki:
    image: grafana/loki:2.9.8          # matches the running nidp-loki
    container_name: nidp-lt-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - nidp-loki-data:/loki
    ports: ["${LOKI_PORT:-3100}:3100"]
    networks: [nidp-local]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

  promtail:
    image: grafana/promtail:2.9.8
    container_name: nidp-lt-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - nidp-logs:/nidp/logs:ro
      # Docker socket + container logs so promtail can tail the stack itself.
      # On Windows this works through the Docker Desktop WSL2 backend.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [nidp-local]
    logging: *default-logging
    depends_on:
      loki: { condition: service_healthy }

  node-exporter:
    image: prom/node-exporter:latest
    container_name: nidp-lt-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports: ["${NODE_EXPORTER_PORT:-9100}:9100"]
    networks: [nidp-local]
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    container_name: nidp-lt-alertmanager
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - nidp-alertmanager-data:/alertmanager
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]
    networks: [nidp-local]
    logging: *default-logging

  # ── Kafka (profile: kafka) ─────────────────────────────────────────────
  # The live staging env says "Event bus (always local since Kafka is dead)".
  # Kept for parity but OFF by default — redpanda alone eats ~512MB.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: nidp-lt-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --unsafe-bypass-fsync
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,PLAINTEXT_HOST://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes: [nidp-redpanda-data:/var/lib/redpanda/data]
    networks: [nidp-local]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 15s
      timeout: 5s
      retries: 6
    profiles: ["kafka"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: nidp-lt-schema-registry
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://redpanda:29092
    ports: ["8081:8081"]
    networks: [nidp-local]
    logging: *default-logging
    depends_on:
      redpanda: { condition: service_healthy }
    profiles: ["kafka"]

volumes:
  nidp-pg-data:
  nidp-redis-data:
  nidp-minio-data:
  nidp-prom-data:
  nidp-grafana-data:
  nidp-loki-data:
  nidp-alertmanager-data:
  nidp-redpanda-data:
  nidp-whisper-models:
  nidp-logs:
  nidp-run:

networks:
  nidp-local:
    name: nidp-local
    driver: bridge
