# Laptop 2 edge — mirrors the path layout of data.niveshcopilot.com on
# nidp-stack-vm, so laptop 1 can use URLs that differ from staging only in
# host:port (no code changes to switch between staging and local).
#
#   /daas/     -> DaaS API      (staging: https://staging-data.../daas)
#   /query/    -> Query API     (staging: https://staging-data.../query)
#   /grafana/  -> Grafana       (staging: https://staging-data.../grafana)
#   /healthz   -> liveness for the container healthcheck
#
# HTTP only. The VM terminates TLS with a Cloudflare origin cert; on a LAN
# between two laptops there is no cert to use and no CA to trust, so we keep
# it plain. This traffic never leaves your local network.
#
# ── Why `resolver` + variables instead of `upstream` blocks ──────────────
# With a static `upstream daas_api { server daas-api:8083; }`, nginx resolves
# the hostname ONCE at startup and fails hard if it doesn't resolve:
#     [emerg] host not found in upstream "daas-api:8083"
# On a laptop that means nginx crash-loops whenever it starts before the API
# (or after the API is recreated with a new IP). Assigning the address to a
# variable defers resolution to request time, using Docker's embedded DNS at
# 127.0.0.11, so the edge comes up regardless of boot order and follows
# container restarts. Cost: a DNS lookup per request, cached for 10s.

server {
    listen 8080;
    server_name _;

    # Docker's embedded DNS server. ipv6=off avoids AAAA lookups that
    # Docker's resolver answers slowly on some Desktop builds.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Bulk DaaS reads can be large; don't buffer them to disk needlessly.
    client_max_body_size 64m;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # Real client IP for the APIs' --proxy-headers / --forwarded-allow-ips.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # uvicorn runs with --root-path /daas so it emits correct absolute URLs,
    # but expects request paths WITHOUT the prefix. `rewrite ... break`
    # strips it; proxy_pass with a variable then forwards the rewritten URI.
    location /daas/ {
        set $upstream_daas daas-api:8083;
        rewrite ^/daas/(.*)$ /$1 break;
        proxy_pass http://$upstream_daas;
    }

    location /query/ {
        set $upstream_query query-api:8090;
        rewrite ^/query/(.*)$ /$1 break;
        proxy_pass http://$upstream_query;
    }

    # Grafana runs with GF_SERVER_SERVE_FROM_SUB_PATH=true, so unlike the
    # APIs it WANTS the /grafana prefix preserved — no rewrite here.
    location /grafana/ {
        set $upstream_grafana grafana:3000;
        proxy_pass http://$upstream_grafana;
    }

    # Grafana live-tail websockets.
    location /grafana/api/live/ {
        set $upstream_grafana_live grafana:3000;
        proxy_pass http://$upstream_grafana_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = / {
        return 200 "nidp laptop stack — try /daas/ /query/ /grafana/ /healthz\n";
        add_header Content-Type text/plain;
    }
}
