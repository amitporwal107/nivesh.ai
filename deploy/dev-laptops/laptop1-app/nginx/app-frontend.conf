# Static server for the V2 (CRA) frontend container.
#
# Overrides the nginx.conf baked into Dockerfile.frontend.prod, which listens
# on 443 with a Cloudflare origin cert and 308-redirects HTTP->HTTPS. Behind
# our plain-HTTP edge that redirect would loop. Same override the staging
# stack applies (deploy/nivesh-staging/app-frontend-nginx.conf).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Hashed CRA build assets are immutable.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — client-side routes must return index.html, not 404.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
