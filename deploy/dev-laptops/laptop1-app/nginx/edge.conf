# Laptop 1 edge — the cloudflared origin.
#
# Routing copied from deploy/nivesh-staging/nginx-staging.conf (the :8444
# HTTP-only server block), so paths behave exactly as they do on staging:
#   /api/      -> backend
#   /webhooks/ -> backend
#   /v5/       -> frontend-v5
#   /          -> V2 frontend
#
# Plain HTTP on 3000. There is no usable TLS cert on a laptop, and this
# listens only for cloudflared on the same machine. Point the tunnel at
# http://localhost:3000 (see README "Cloudflare tunnel").
#
# Uses `resolver` + variable upstreams (the repo's established pattern, see
# deploy/nivesh-app/nginx.conf) so a single down container 502s that one
# route instead of preventing nginx from starting at all.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # Emit RELATIVE Location headers. nginx defaults to absolute_redirect on,
    # which builds Location as $scheme://$host:$server_port$uri — so a plain
    # `return 302 /v5/work` becomes http://localhost:3000/v5/work. Behind the
    # cloudflared tunnel the Host is dev.niveshcopilot.com and the public port
    # is 443, so that absolute form sends users to
    # http://dev.niveshcopilot.com:3000/v5/work — a dead URL.
    # Relative redirects let the browser resolve against whatever origin it
    # actually used, which is correct both locally and through the tunnel.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # cloudflared terminates TLS at the edge, so the app should believe the
    # original scheme was https (cookies, redirects, OAuth callbacks).
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 50m;      # CAS PDF uploads

    set $app_backend_host     app-backend;
    set $app_frontend_v5_host app-frontend-v5;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://$app_backend_host:8001;
    }

    location ^~ /webhooks/ {
        proxy_pass http://$app_backend_host:8001;
    }

    location /v5/ {
        proxy_pass http://$app_frontend_v5_host:80;
    }

    location = /v5 {
        return 301 /v5/;
    }

    # v5-only stack: root redirects into the v5 SPA rather than proxying to
    # the V2 container. This is the same pattern prod already uses on the
    # v5-only vhost (deploy/nivesh-app/nginx.conf: `return 302 /v5/work`).
    #
    # v5 has NO dependency on V2 — verified: the v5 Dockerfile copies only
    # frontend-v5/, there are no /v2 links in frontend-v5/src, and no
    # cross-imports (the one mention of frontend/src/v4 is a doc comment).
    #
    # If you ever need V2, start it with `--profile v2` and replace this
    # block with:  proxy_pass http://$app_frontend_host:80;
    location / {
        return 302 /v5/work;
    }
}
