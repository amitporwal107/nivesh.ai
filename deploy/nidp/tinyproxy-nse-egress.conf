# NIDP NSE egress proxy.
#
# Why this exists: NSE blocks nidp-stack-vm's egress IP (34.93.60.254) with a 403
# across its whole estate, while this host's IP (34.47.250.214) gets 200. Verified
# 2026-08-19 with identical requests from both VMs. NIDP's ingesters send NSE traffic
# here via NSE_HTTPS_PROXY; every other host keeps its direct path.
#
# Locked down deliberately — this host serves the live application:
#   * Listen is the INTERNAL address only, so the proxy is not on the public IP.
#   * Allow is the single ingestion VM, not the subnet.
#   * ConnectPort is 443 only, so it cannot be used to reach arbitrary ports.

User tinyproxy
Group tinyproxy

# Internal interface only. Binding 0.0.0.0 would expose an open proxy on
# 34.47.250.214 the moment a firewall rule widened.
Listen 10.160.0.5
Port 3128

Timeout 600
MaxClients 40
StartServers 2

# nidp-stack-vm, and nothing else.
Allow 10.160.0.3

# HTTPS CONNECT to 443 only.
ConnectPort 443

# This host has run out of disk before, and a proxy log is the classic slow filler.
# Connection-level logging is not worth that risk; failures still surface in the
# ingester logs on the NIDP side.
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Warning

# Do not advertise the hop; NSE sees a normal client.
DisableViaHeader Yes
