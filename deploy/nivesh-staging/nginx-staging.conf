# Edge nginx for staging.niveshcopilot.com.
#
# Listens on 8443 inside the container. The host-side bind is controlled by
# PI_NGINX_BIND_ADDR (127.0.0.1 by default; switch to 0.0.0.0 once the GCP
# firewall has a rule allowing 8443 from Cloudflare's IP ranges).
#
# Cloudflare wildcard origin cert is mounted from /opt/nivesh/ssl (same files
# the prod nginx uses). Cert SANs include *.niveshcopilot.com so this host is
# covered without changes.

# Internal HTTP listener — used by the prod nginx on port 443 to proxy
# staging.niveshcopilot.com without double-SSL. Only reachable from the host
# (127.0.0.1:8444 bind), never directly from the internet.
server {
    listen 8444;
    server_name staging.niveshcopilot.com;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 50m;

    set $app_backend_host       app-backend;
    set $app_frontend_host      app-frontend;
    set $app_frontend_v5_host   app-frontend-v5;

    location /api/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location ^~ /webhooks/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location /v5/ {
        proxy_pass http://$app_frontend_v5_host:80;
    }
    location = /v5 {
        return 301 /v5/;
    }
    location / {
        proxy_pass http://$app_frontend_host:80;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name staging.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (Cloudflare adds more on top)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;      # ingestion only takes metadata, never PDFs

    access_log /var/log/nginx/staging.access.log;
    error_log  /var/log/nginx/staging.error.log warn;

    location /api/ {
        proxy_pass         http://ingestion:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Lightweight root → healthz for quick "is it up?" checks
    location = / {
        return 302 /api/healthz;
    }

    # Internal test pages — JS-gated by the admin token via /api/admin/verify.
    # noindex + no-store discourage discovery/caching.
    location /test/ {
        alias /usr/share/nginx/html/test/;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store"          always;
        try_files $uri =404;
    }

    # Default — explicit 404 instead of falling through
    location / {
        return 404;
    }
}
