# Edge nginx for staging.niveshcopilot.com.
#
# Listens on 8443 inside the container. The host-side bind is controlled by
# PI_NGINX_BIND_ADDR (0.0.0.0 once the GCP firewall opens 8443 to Cloudflare).
#
# Cloudflare wildcard origin cert is mounted from /opt/nivesh/ssl (same files
# the prod nginx uses). Cert SANs include *.niveshcopilot.com so this host is
# covered without changes.
#
# Two upstreams. The CAS ingestion module used to run as a third upstream
# (ingestion:8002) but has been folded into app-backend:8001 — same code,
# same DB, same endpoints (/api/cas/sdk-callback, /api/casparser/token,
# /api/portfolio/me|snapshots, /api/admin/jobs|verify, /webhooks/casparser/*).
#
#   app-backend:8001     — V2 main FastAPI (+ CAS ingestion routers)
#   app-frontend:80      — React SPA serving /v2/, /v3/, /v4/ basenames
#
# Docker's embedded DNS — short re-resolve cadence so a container recreation
# is picked up within ~10 seconds (prevents the 502 race after redeploys).
resolver 127.0.0.11 ipv6=off valid=10s;

# Internal HTTP listener — used by the prod nginx on port 443 to proxy
# staging.niveshcopilot.com without double-SSL. Only reachable from the host
# (127.0.0.1:8444 bind), never directly from the internet.
server {
    listen 8444;
    server_name staging.niveshcopilot.com;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 50m;

    set $app_backend_host       app-backend;
    set $app_frontend_host      app-frontend;
    set $app_frontend_v5_host   app-frontend-v5;

    location /api/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location ^~ /webhooks/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location /v5/ {
        proxy_pass http://$app_frontend_v5_host:80;
    }
    location = /v5 {
        return 301 /v5/;
    }
    location / {
        proxy_pass http://$app_frontend_host:80;
    }
}

# HTTPS listener — Cloudflare terminates TLS and connects here on port 8443.
# Serves the same upstreams as port 8444 (no redirect loop).
server {
    listen 8443 ssl;
    http2 on;
    server_name staging.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers (A10 / ASVS V9.1 + V14.4) — applied to EVERY response
    # (the locations below only proxy_pass, so nothing drops these). A tested
    # Content-Security-Policy is a deliberate follow-up (a wrong CSP breaks the SPA).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 50m;

    set $app_backend_host       app-backend;
    set $app_frontend_host      app-frontend;
    set $app_frontend_v5_host   app-frontend-v5;

    location /api/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location ^~ /webhooks/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location /v5/ {
        proxy_pass http://$app_frontend_v5_host:80;
    }
    location = /v5 {
        return 301 /v5/;
    }
    location / {
        proxy_pass http://$app_frontend_host:80;
    }
}
