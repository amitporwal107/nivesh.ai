# Edge nginx for staging.niveshcopilot.com.
#
# Listens on 8443 inside the container. The host-side bind is controlled by
# PI_NGINX_BIND_ADDR (0.0.0.0 once the GCP firewall opens 8443 to Cloudflare).
#
# Cloudflare wildcard origin cert is mounted from /opt/nivesh/ssl (same files
# the prod nginx uses). Cert SANs include *.niveshcopilot.com so this host is
# covered without changes.
#
# Three upstreams:
#   ingestion:8002       — new portfolio_ingestion FastAPI (V3)
#   app-backend:8001     — existing main app FastAPI (V1/V2)
#   app-frontend:80      — React SPA (built with staging URL baked in)

server {
    listen 8443 ssl;
    http2 on;
    server_name staging.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (Cloudflare adds more on top)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Headers inherited by every location block below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    client_max_body_size 8m;          # main app upload paths

    access_log /var/log/nginx/staging.access.log;
    error_log  /var/log/nginx/staging.error.log warn;

    # ── Route split ──────────────────────────────────────────────────────
    # New V3 ingestion paths owned by the portfolio_ingestion service.
    # Listed explicitly so they don't fall through to the main backend.

    location = /api/healthz              { proxy_pass http://ingestion:8002; }
    location = /api/readyz               { proxy_pass http://ingestion:8002; }
    location = /api/casparser/token      { proxy_pass http://ingestion:8002; }
    location ^~ /api/cas/sdk-callback    { proxy_pass http://ingestion:8002; }
    location ^~ /api/cas/uploads/        { proxy_pass http://ingestion:8002; }
    location = /api/portfolio/me         { proxy_pass http://ingestion:8002; }
    location ^~ /api/portfolio/snapshots { proxy_pass http://ingestion:8002; }
    location ^~ /api/admin/jobs          { proxy_pass http://ingestion:8002; }
    location = /api/admin/verify         { proxy_pass http://ingestion:8002; }
    location ^~ /webhooks/casparser/     { proxy_pass http://ingestion:8002; }

    # Internal test pages — JS-gated by the admin token via /api/admin/verify.
    location /test/ {
        alias /usr/share/nginx/html/test/;
        add_header X-Robots-Tag  "noindex, nofollow" always;
        add_header Cache-Control "no-store"          always;
        try_files $uri =404;
    }

    # Everything else under /api/ → main app backend.
    location /api/ {
        proxy_pass http://app-backend:8001;
    }

    # Frontend SPA (catch-all). Falls last so /test/, /api/, /webhooks/ win.
    location / {
        proxy_pass http://app-frontend:80;
    }
}
