# Edge nginx for staging.niveshcopilot.com.
#
# Listens on 8443 inside the container. The host-side bind is controlled by
# PI_NGINX_BIND_ADDR (127.0.0.1 by default; switch to 0.0.0.0 once the GCP
# firewall has a rule allowing 8443 from Cloudflare's IP ranges).
#
# Cloudflare wildcard origin cert is mounted from /opt/nivesh/ssl (same files
# the prod nginx uses). Cert SANs include *.niveshcopilot.com so this host is
# covered without changes.

server {
    listen 8443 ssl;
    http2 on;
    server_name staging.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (Cloudflare adds more on top)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;      # ingestion only takes metadata, never PDFs

    access_log /var/log/nginx/staging.access.log;
    error_log  /var/log/nginx/staging.error.log warn;

    location /api/ {
        proxy_pass         http://ingestion:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Lightweight root → healthz for quick "is it up?" checks
    location = / {
        return 302 /api/healthz;
    }

    # Default — explicit 404 instead of falling through
    location / {
        return 404;
    }
}
