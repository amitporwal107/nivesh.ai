# Staging app-frontend nginx config.
#
# Serves the React build (PUBLIC_URL=/v2) on plain HTTP. TLS termination
# and /api/ routing are handled by the edge nivesh-staging-nginx in front
# of this container. Mirrors deploy/nivesh-app/nginx.conf minus the TLS
# server block + the Jenkins proxy.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # V2 React SPA — build is at /usr/share/nginx/html/ but PUBLIC_URL=/v2
    # so every asset href in index.html carries /v2/. The alias makes the
    # paths resolve. React Router runs with basename="/v2".
    location /v2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /v2/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /v2/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # V3 entry — same build, different basename; App.js switches on the prefix.
    location = /v3 { return 301 /v3/; }
    location /v3/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /v3/index.html;

        location = /v3/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # V4 entry — same build, different basename; App.js switches on the prefix.
    location = /v4 { return 301 /v4/; }
    location /v4/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /v4/index.html;

        location = /v4/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # Root → /v2/ so existing bookmarks land on the SPA.
    location = / {
        return 301 /v2/;
    }
}
