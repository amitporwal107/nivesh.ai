# Staging app-frontend nginx config.
#
# This container only serves the React build's static files on plain HTTP.
# TLS termination and /api/ routing are handled by the edge nivesh-staging-nginx
# container in front of it (see nginx-staging.conf).

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Long-cache hashed assets, short-cache the entry point.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback — anything not a static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
