# Staging stack: V2 backend (with CAS ingestion mounted in-process) + V2/V4 frontend.
#
# Runs on nivesh-app-vm alongside the production stack, fully isolated:
#   - Separate docker network        (nivesh-staging)
#   - Separate container names       (nivesh-staging-*)
#   - Separate persistent volumes    (/opt/nivesh-staging/data/...)
#   - Separate ports on 127.0.0.1    (no public bind until firewall + DNS done)
#
# Brought up by deploy/nivesh-staging/redeploy-staging.sh. Do not run manually
# without reading that script first.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ── Data stores (fresh, isolated from prod) ──────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: nivesh-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${PI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PI_POSTGRES_PASSWORD}
      POSTGRES_DB:       ${PI_POSTGRES_DB}
    ports:
      - "127.0.0.1:5532:5432"
    volumes:
      - /opt/nivesh-staging/data/postgres:/var/lib/postgresql/data
    networks: [nivesh-staging]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PI_POSTGRES_USER} -d ${PI_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: nivesh-staging-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PI_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PI_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_DB:-nivesh_staging}
    ports:
      - "127.0.0.1:27117:27017"
    volumes:
      - /opt/nivesh-staging/data/mongo:/data/db
      - ../nivesh-app/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks: [nivesh-staging]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nivesh-staging-redis
    restart: unless-stopped
    command: redis-server --requirepass ${PI_REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6479:6379"
    volumes:
      - /opt/nivesh-staging/data/redis:/data
    networks: [nivesh-staging]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PI_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ── Main app backend (mirror of prod nivesh-backend) ─────────────────────
  # Same code as prod, plus the CAS ingestion module (used to be a separate
  # 'ingestion' container — now mounted in-process; same DB, same endpoints).
  # Points at the staging Postgres/Mongo/Redis containers.

  app-backend:
    build:
      context: ../../
      dockerfile: deploy/nivesh-app/Dockerfile.backend.prod
    image: nivesh/backend:staging
    container_name: nivesh-staging-app-backend
    restart: unless-stopped
    env_file: /opt/nivesh-staging/.env.staging
    environment:
      APP_ENV: staging
      # Main app connects as the 'nivesh' user (created by mongo-init.js,
      # the same one prod uses — directive: apply original scripts unchanged).
      # Database is nivesh_staging (parallel to prod's nivesh_prod).
      MONGO_URL:    mongodb://nivesh:Niv3shApp2026!@mongo:27017/nivesh_staging?authSource=nivesh_staging
      POSTGRES_URL: postgresql://${PI_POSTGRES_USER}:${PI_POSTGRES_PASSWORD}@postgres:5432/${PI_POSTGRES_DB}
      REDIS_URL:    redis://:${PI_REDIS_PASSWORD}@redis:6379/0
      DB_NAME:      nivesh_staging
      CORS_ORIGINS: "https://staging.niveshcopilot.com,https://staging.niveshcopilot.com:8443"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      NIDP_DAAS_BASE_URL: https://staging-data.niveshcopilot.com/daas
      NIDP_DAAS_INTERNAL_TOKEN: ${NIDP_DAAS_INTERNAL_TOKEN:-}
      NIDP_QUERY_API_URL: ${NIDP_QUERY_API_URL:-https://staging-data.niveshcopilot.com/query}
      NIDP_QUERY_API_TOKEN: ${NIDP_QUERY_API_TOKEN:-}
      NIDP_GRAFANA_URL: ${NIDP_GRAFANA_URL:-https://staging-data.niveshcopilot.com/grafana}
      GMAIL_REDIRECT_URI: https://staging.niveshcopilot.com/api/oauth/gmail/callback
      # ── CAS ingestion module (lives inside this same backend now) ──
      # Same DB connection; separate `portfolio_ingestion` schema.
      PI_POSTGRES_URL:        postgresql://${PI_POSTGRES_USER}:${PI_POSTGRES_PASSWORD}@postgres:5432/${PI_POSTGRES_DB}
      PI_MONGO_URL:           mongodb://${PI_MONGO_USER}:${PI_MONGO_PASSWORD}@mongo:27017/${PI_MONGO_DB}?authSource=admin
      PI_REDIS_URL:           redis://:${PI_REDIS_PASSWORD}@redis:6379/0
      PI_PAN_ENCRYPTION_KEY:  ${PI_PAN_ENCRYPTION_KEY:-pi-staging-pan-key-rotate-me}
      PI_CASPARSER_API_KEY:   ${CASPARSER_API_KEY:-}
      PI_GCS_STUB:            ${PI_GCS_STUB:-true}
      PI_GCS_BUCKET:          ${PI_GCS_BUCKET:-}
      PI_WEBHOOK_ENABLED:     ${PI_WEBHOOK_ENABLED:-false}
      PI_WEBHOOK_SECRET:      ${PI_WEBHOOK_SECRET:-}
      PI_ADMIN_TOKEN:         ${PI_ADMIN_TOKEN:-}
    # Source mounted at runtime — image only carries OS + Python deps, code
    # is the freshly-pulled repo. Mirrors the prod backend mount pattern.
    volumes:
      - /opt/nivesh-staging/repo/backend:/app/backend
      - /opt/nivesh-staging/data/app:/app/data
    # host-gateway resolves to the Docker host IP so the backend can reach
    # the NIDP Query API on 10.160.0.3:8090 via the nidp-bridge network.
    extra_hosts:
      - "host-gateway:host-gateway"
    # The frontend image's baked nginx.conf hardcodes `upstream backend`
    # (prod service key). Add a network alias so it resolves the same name.
    networks:
      # Default route MUST go via nivesh-staging (MTU 1460) — NOT the external
      # nidp-bridge (1500, shared with prod, can't change). gw_priority makes
      # nivesh-staging the default gateway so external/cross-VM egress (DaaS bulk
      # reads to the NIDP VM) uses the 1460 interface and isn't blackholed.
      nivesh-staging:
        aliases: [backend]
        gw_priority: 100
      nidp-bridge:
        gw_priority: 1
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── frontend-v5 (Vite + React 18, served at /v5/) ────────────────────────

  app-frontend-v5:
    build:
      context: ../../
      dockerfile: deploy/nivesh-app/Dockerfile.frontend-v5.prod
      args:
        VITE_BASE: /v5/
        VITE_API_URL: https://staging.niveshcopilot.com
        VITE_USE_MOCK_API: "false"
    image: nivesh/frontend-v5:staging
    container_name: nivesh-staging-app-frontend-v5
    restart: unless-stopped
    networks: [nivesh-staging]
    logging: *default-logging
    depends_on:
      app-backend: { condition: service_healthy }

  # ── Main app frontend (React build baked with staging backend URL) ───────

  app-frontend:
    build:
      context: ../../
      dockerfile: deploy/nivesh-app/Dockerfile.frontend.prod
      args:
        REACT_APP_BACKEND_URL: https://staging.niveshcopilot.com
        PUBLIC_URL: /v2
    image: nivesh/frontend:staging
    container_name: nivesh-staging-app-frontend
    restart: unless-stopped
    # No port binding — edge nginx (port 8443) proxies to this container.
    # Override the prod nginx.conf baked into the image with a staging
    # HTTP-only static-server config (no TLS, no /api/ proxy — edge nginx
    # handles all that). The prod config does an HTTP→HTTPS 308 redirect
    # which would loop through the edge.
    volumes:
      - ./app-frontend-nginx.conf:/etc/nginx/conf.d/app.conf:ro
    networks: [nivesh-staging]
    logging: *default-logging
    depends_on:
      app-backend: { condition: service_healthy }

  # ── One-shot Postgres migrations for the main app schema ─────────────────

  app-migrate:
    # Use postgres:16-alpine (has psql) — the backend image is dependency-only
    # for the Python app and doesn't include the psql client.
    image: postgres:16-alpine
    container_name: nivesh-staging-app-migrate
    restart: "no"
    environment:
      POSTGRES_URL: postgresql://${PI_POSTGRES_USER}:${PI_POSTGRES_PASSWORD}@postgres:5432/${PI_POSTGRES_DB}
    volumes:
      - /opt/nivesh-staging/repo/backend/migrations:/migrations:ro
      - /opt/nivesh-staging/repo/backend/nidp/migrations:/nidp-migrations:ro
    command: >
      sh -c "
        set -e;
        echo 'Running main-app PostgreSQL migrations against staging...';
        for f in /migrations/*.sql; do
          echo \"Applying $$f\";
          psql \"$$POSTGRES_URL\" -v ON_ERROR_STOP=0 -f \"$$f\" 2>&1 | grep -v 'already exists' || true;
        done;
        echo 'Running nidp/* migrations that target the main app public schema...';
        for f in /nidp-migrations/*.sql; do
          if head -20 \"$$f\" | grep -q 'SET search_path TO public;'; then
            echo \"Applying nidp-public migration $$f\";
            psql \"$$POSTGRES_URL\" -v ON_ERROR_STOP=0 -f \"$$f\" 2>&1 | grep -v 'already exists' || true;
          fi;
        done;
        echo 'Migrations done.'
      "
    networks: [nivesh-staging]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["migrate"]

  # ── Edge nginx for the staging vhost ─────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: nivesh-staging-nginx
    restart: unless-stopped
    # Bind to 127.0.0.1 until firewall + DNS are wired; flip to 0.0.0.0:8443
    # once `gcloud compute firewall-rules create allow-staging-https` is in.
    ports:
      - "${PI_NGINX_BIND_ADDR:-127.0.0.1}:${PI_NGINX_PORT:-8443}:8443"
      - "127.0.0.1:8444:8444"   # HTTP-only, for prod-nginx → staging proxy
    volumes:
      - ./nginx-staging.conf:/etc/nginx/conf.d/staging.conf:ro
      - /opt/nivesh/ssl:/etc/nginx/ssl:ro            # reuse prod's Cloudflare origin cert
    depends_on:
      app-backend:  { condition: service_healthy }
      app-frontend: { condition: service_started }
    networks: [nivesh-staging]
    logging: *default-logging

networks:
  nivesh-staging:
    name: nivesh-staging
    driver: bridge
    driver_opts:
      # GCP VPC path MTU is 1460; the docker bridge defaults to 1500, which
      # blackholes large responses (PMTUD) — DaaS bulk reads truncated at ~32KB.
      # Pin to 1460 so cross-VM / egress responses come through intact.
      com.docker.network.driver.mtu: "1460"
  nidp-bridge:
    external: true   # created by the prod stack; staging backend joins it to reach NIDP Query API
