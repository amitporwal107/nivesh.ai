server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Two independent SPAs side-by-side:
    #   /usr/share/nginx/html/v2/  — V2 bundle (PUBLIC_URL=/v2)
    #   /usr/share/nginx/html/v3/  — V3 bundle (PUBLIC_URL=/v3)
    # The location blocks below alias each prefix to its own tree.
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy all /api/ calls to FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    # Health check (must come before the catch-all redirect below)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # V2 React SPA — built with PUBLIC_URL=/v2 and BUILD_PATH=build/v2,
    # served from /usr/share/nginx/html/v2/. BrowserRouter uses
    # basename="/v2" so routes like /v2/dashboard, /v2/nidp work.
    location /v2/ {
        alias /usr/share/nginx/html/v2/;
        try_files $uri $uri/ /v2/index.html;

        # Cache hashed static assets forever (webpack appends a content
        # hash so a new deploy gets a new filename).
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Never cache index.html — it's the bootstrap and references the
        # hashed JS/CSS bundles. If we cache it, clients keep loading
        # stale bundle hashes after each deploy.
        location = /v2/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # V3 React SPA — a fully separate bundle built with PUBLIC_URL=/v3 and
    # BUILD_PATH=build/v3, served from /usr/share/nginx/html/v3/.
    # BrowserRouter uses basename="/v3" so routes like /v3/home,
    # /v3/chat, /v3/portfolio resolve cleanly without the /v2 prefix.
    # No code is shared with the V2 bundle at runtime — assets live under
    # /v3/static/* with their own hashes.
    location /v3/ {
        alias /usr/share/nginx/html/v3/;
        try_files $uri $uri/ /v3/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /v3/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # Bare /v3 → /v3/ so the SPA always boots from its index.html.
    location = /v3       { return 301 /v3/; }

    # Jenkins CI/CD dashboard — proxied from Docker host on port 8080
    location /jenkins/ {
        proxy_pass         http://172.18.0.1:8080/jenkins/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Redirect root and any unknown path to /v2/ so old bookmarks still work
    location / {
        return 301 /v2/;
    }
}
