# ── WebSocket upgrade mapping ────────────────────────────────────────────
# Sets `Connection: upgrade` ONLY when the client sent an Upgrade header.
# Without this gate, every plain HTTP request to /api/ would carry
# `Connection: upgrade`, which is bad form (most backends ignore but some
# proxies/middleware get confused). Used in the /api/ location below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Work issues dashboard — serves work.niveshcopilot.com.
# Delivers the same V5 SPA bundle and backend; roots the browser at /v5/work.
# DNS prerequisite: CNAME work.niveshcopilot.com → niveshcopilot.com (Cloudflare).
server {
    listen 443 ssl;
    server_name work.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API — same backend container as main app.
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;
    }

    # V5 static assets (hashed — cache forever).
    location /v5/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # V5 SPA — serve index.html for all deep links.
    location /v5/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /v5/index.html;
    }

    # Redirect bare root → Work section.
    location / {
        return 302 /v5/work;
    }
}

# HTTP → HTTPS. 308 (vs 301) so POST requests keep their method intact —
# matters for any client that hits a redirected /api/* via http://.
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

# Staging vhost — terminates TLS for staging.niveshcopilot.com on port 443,
# then proxies to the staging nginx (HTTP port 8444) on the same host.
# This allows staging to be reached at https://staging.niveshcopilot.com/v5
# (a valid Google OAuth origin) instead of the raw :8443 port.
server {
    listen 443 ssl;
    server_name staging.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # All traffic forwarded to the staging nginx HTTP listener.
    # nivesh-staging-nginx is reachable by name only when nivesh-frontend is
    # attached to the nivesh-staging network. Resolve the upstream LAZILY via
    # Docker's embedded DNS (127.0.0.11) using a variable in proxy_pass, so a
    # missing/unresolvable staging container yields a 502 on this convenience
    # vhost instead of crashing nginx startup and taking prod down with it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $staging_upstream nivesh-staging-nginx:8444;
        proxy_pass         http://$staging_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50m;
    }
}

server {
    # default_server: the bare apex (niveshcopilot.com) matches no explicit
    # server_name, so nginx would otherwise route it to the FIRST 443 server
    # (work.niveshcopilot.com) and serve /v5/work — which 500s because the
    # prod image ships V2 only (no /v5/index.html). Marking this the default
    # keeps the apex on the V2 SPA; work./staging. still match by exact name.
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy all /api/ calls to FastAPI backend.
    # WebSocket upgrade headers are conditional via $connection_upgrade
    # (see map at top of file) so plain HTTP API calls don't carry
    # spurious `Connection: upgrade`.
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    # Health check (must come before the catch-all redirect below).
    # `default_type` is idiomatic for synthetic responses — sets the
    # Content-Type directly rather than via add_header.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # V5 new-design SPA — proxied to the frontend-v5 container. Variable
    # upstream + resolver (Docker embedded DNS) so the edge nginx starts even
    # when the v5 container is down (yields 502 on /v5 rather than crashing).
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /v5 { return 301 /v5/; }
    location /v5/ {
        set $v5_upstream nivesh-frontend-v5:80;
        proxy_pass         http://$v5_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50m;
    }

    # V2 React SPA — the app is built with PUBLIC_URL=/v2 so all asset
    # hrefs already carry the /v2/ prefix.  BrowserRouter uses basename="/v2"
    # so React Router handles routes as /v2/, /v2/dashboard, /v2/nidp, etc.
    location /v2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /v2/index.html;

        # Cache static assets forever — webpack appends a content hash
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Never cache index.html — it's the bootstrap and references the
        # hashed JS/CSS bundles. If we cache it, clients keep loading
        # stale bundle hashes after each deploy (the OLD main.<hash>.js
        # stays "current" for them).
        location = /v2/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # V3 entry — clean URLs at /v3/*.
    #
    # The JS/CSS bundles are baked with PUBLIC_URL=/v2/ so all asset hrefs
    # point at /v2/static/... — those continue to be served by the /v2/
    # location block above. Only the HTML entry point lives under /v3/.
    #
    # frontend/src/App.js detects the URL prefix at boot:
    #   pathname starts with /v3 → BrowserRouter basename="/v3" + V3App
    #   otherwise                → BrowserRouter basename="/v2" + V2 routes
    # So both /v2/* and /v3/* paths are first-class SPA mounts; no rewrite.
    location = /v3 { return 301 /v3/; }
    location /v3/ {
        alias /usr/share/nginx/html/;
        # Static asset GETs (none expected at /v3/, but if any leak through
        # we let nginx try them first); anything else falls back to the
        # SPA bootstrap so deep links like /v3/home work on hard refresh.
        try_files $uri $uri/ /v3/index.html;

        # Bootstrap must not be cached — see comment in /v2/ block.
        location = /v3/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # V4 entry — clean URLs at /v4/*.
    # Same single-bundle pattern as V3: assets are baked with PUBLIC_URL=/v2/
    # and served by the /v2/ block above; only the SPA HTML lives under /v4/.
    # App.js detects pathname startsWith /v4 → basename="/v4" + V4App.
    location = /v4 { return 301 /v4/; }
    location /v4/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /v4/index.html;

        location = /v4/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }
    }

    # Jenkins CI/CD dashboard — proxied from Docker host on port 8080
    location /jenkins/ {
        proxy_pass         http://172.18.0.1:8080/jenkins/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Bare apex (https://niveshcopilot.com/) → the PUBLIC V5 marketing home
    # page. This is the URL Google's OAuth branding review lands on; it must be
    # viewable WITHOUT login and must explain the product — which /v5/ does
    # (the V2 shell at /v2/ is a login wall). Exact-match (`= /`) so ONLY the
    # bare root moves; every other path still falls through to the V2 app via
    # the catch-all below, and existing /v2, /v3, /v4, /v5 deep links are
    # untouched. Exact matches win over the `/` prefix regardless of order.
    location = / {
        return 301 /v5/;
    }

    # Redirect any other unknown path to /v2/ so old bookmarks still work
    location / {
        return 301 /v2/;
    }
}
