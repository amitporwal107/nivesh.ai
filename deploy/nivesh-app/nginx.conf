server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy all /api/ calls to FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    # Health check (must come before the catch-all redirect below)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # V2 React SPA — the app is built with PUBLIC_URL=/v2 so all asset
    # hrefs already carry the /v2/ prefix.  BrowserRouter uses basename="/v2"
    # so React Router handles routes as /v2/, /v2/dashboard, /v2/nidp, etc.
    location /v2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;

        # Cache static assets forever — webpack appends a content hash
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Jenkins CI/CD dashboard — proxied from Docker host on port 8080
    location /jenkins/ {
        proxy_pass         http://host-gateway:8080/jenkins/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Redirect root and any unknown path to /v2/ so old bookmarks still work
    location / {
        return 301 /v2/;
    }
}
