server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets served from /v5/ — let browser cache aggressively.
    location /v5/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Design prototype — serve files directly, no SPA fallback
    location /v5/prototype/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any /v5/* path serves the v5 index.html
    location /v5/ {
        try_files $uri $uri/ /v5/index.html;
    }

    # Redirect bare /v5 (no trailing slash) to /v5/
    location = /v5 {
        return 301 /v5/;
    }

    # Health check for Docker
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
