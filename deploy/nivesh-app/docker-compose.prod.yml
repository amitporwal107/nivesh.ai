# Production Docker Compose for the nivesh-app VM.
# All services run on the internal `nivesh-prod` network.
# Only Nginx is exposed externally (port 80).
#
# Managed by deploy.sh — do not run manually without reading that script.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ── Data stores ─────────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: nivesh-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_DB}
    volumes:
      - /opt/nivesh/data/mongo:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks: [nivesh-prod]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: nivesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /opt/nivesh/data/postgres:/var/lib/postgresql/data
    networks: [nivesh-prod]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nivesh-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - /opt/nivesh/data/redis:/data
    networks: [nivesh-prod]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    image: nivesh/backend:prod
    container_name: nivesh-backend
    restart: unless-stopped
    environment:
      # Declare the deploy environment so helpers.secrets loads the
      # `secrets:production` Mongo scope (where admin-dashboard secrets such as
      # SMTP are saved). Without this, current_env() defaults to "staging" and
      # the prod backend reads the wrong scope — making magic-link email report
      # "Email delivery is not configured on the server." Staging sets the
      # matching APP_ENV: staging in its own compose.
      APP_ENV: production
    # Outbound SMTP for magic-link email (SMTP_HOST/PORT/USERNAME/PASSWORD/FROM/
    # STARTTLS) can also be supplied via this env_file — same relay as staging.
    # See deploy/nivesh-staging/.env.staging.example for the canonical block.
    env_file: /opt/nivesh/.env.prod
    volumes:
      - /opt/nivesh/repo/backend:/app/backend
      - /opt/nivesh/data/app:/app/data
    networks: [nivesh-prod, nidp-bridge]
    extra_hosts:
      - "host-gateway:host-gateway"
    logging: *default-logging
    depends_on:
      mongodb:  { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: nivesh/frontend:prod
    container_name: nivesh-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/nivesh/ssl:/etc/nginx/ssl:ro
      - ./nginx.conf:/etc/nginx/conf.d/app.conf:ro
    extra_hosts:
      - "host-gateway:host-gateway"
    networks: [nivesh-prod]
    logging: *default-logging
    depends_on:
      backend: { condition: service_healthy }

  # ── New-design V5 SPA (Vite/React 18) — served at /v5/ ───────────────────────
  # Built from the same Dockerfile as staging. The edge `frontend` nginx proxies
  # /v5/ to this container (variable upstream + resolver, so a down v5 container
  # 502s instead of crashing the edge). VITE_API_URL is baked to the prod apex.
  frontend-v5:
    build:
      context: ../../
      dockerfile: deploy/nivesh-app/Dockerfile.frontend-v5.prod
      args:
        VITE_BASE: /v5/
        VITE_API_URL: https://niveshcopilot.com
        VITE_USE_MOCK_API: "false"
    image: nivesh/frontend-v5:prod
    container_name: nivesh-frontend-v5
    restart: unless-stopped
    networks: [nivesh-prod]
    logging: *default-logging
    depends_on:
      backend: { condition: service_healthy }

  # ── Host USE metrics for Prometheus ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: nivesh-node-exporter
    restart: unless-stopped
    command:
      - "--web.listen-address=:9200"
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9200:9200"
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks: [nivesh-prod]

  # ── DB migration runner (runs once, exits) ───────────────────────────────────
  migrate:
    image: nivesh/backend:prod
    container_name: nivesh-migrate
    restart: "no"
    env_file: /opt/nivesh/.env.prod
    command: >
      bash -c "
        echo 'Running PostgreSQL migrations...' &&
        for f in /app/backend/migrations/*.sql; do
          echo \"Applying \$f\" &&
          psql \"${POSTGRES_URL}\" -f \"\$f\" 2>&1 | grep -v 'already exists' || true;
        done &&
        echo 'Migrations done.'
      "
    networks: [nivesh-prod]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["migrate"]

networks:
  nivesh-prod:
    name: nivesh-prod
  nidp-bridge:
    name: nidp-bridge
    external: true
