# CloudPe override for deploy/nivesh-staging/docker-compose.staging.yml.
#
# The base file is still what GCP staging deploys from, so it is left alone and
# only the GCP- and prod-coupled parts are replaced here:
#
#   docker compose --env-file /opt/nivesh-staging/.env.staging \
#     -f deploy/nivesh-staging/docker-compose.staging.yml \
#     -f deploy/cloudpe/app/docker-compose.cloudpe.yml  <command>
#
# Use deploy/cloudpe/app/deploy.sh rather than running this by hand.
# Needs Docker Compose >= 2.33.1 (!reset / !override, and gw_priority in the base file).

services:

  # Build cache: the base file imports/exports it from GCP Artifact Registry
  # because the GCP VM's disk was nearly full. This VM has the disk to keep the
  # BuildKit cache locally, and no GCP credentials.
  app-backend:
    build:
      cache_from: !reset []
      cache_to: !reset []
    # nidp-bridge is a docker network created by the PROD stack on the shared
    # GCP VM. Here NIDP is a different machine, reached over HTTPS.
    networks: !override
      nivesh-staging:
        aliases: [backend]

  app-frontend-v5:
    build:
      cache_from: !reset []
      cache_to: !reset []

  app-frontend:
    build:
      cache_from: !reset []
      cache_to: !reset []

  nginx:
    # On GCP the prod nginx owned :443 and proxied to this container. Here this
    # container is the public edge. :8443 is published as well because the
    # Cloudflare Origin Rule for staging may still rewrite to it, and the
    # existing on-VM health checks probe https://127.0.0.1:8443.
    ports: !override
      - "0.0.0.0:443:8443"
      - "0.0.0.0:8443:8443"
      - "127.0.0.1:8444:8444"
    volumes: !override
      - /opt/nivesh-staging/repo/deploy/nivesh-staging/nginx-staging.conf:/etc/nginx/conf.d/staging.conf:ro
      # Cloudflare-only allow-list, generated by app/bootstrap.sh (replaces the
      # GCP firewall rule that restricted the origin to Cloudflare ranges).
      - /opt/nivesh-staging/nginx/cloudflare-only.conf:/etc/nginx/conf.d/00-cloudflare-only.conf:ro
      # This VM's own copy of the Cloudflare origin cert (was prod's /opt/nivesh/ssl).
      - /opt/nivesh-staging/ssl:/etc/nginx/ssl:ro

networks:
  nidp-bridge: !reset null
