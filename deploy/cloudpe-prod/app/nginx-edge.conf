# App edge nginx — production. Plain HTTP on 8444, published on 127.0.0.1 only.
#
# TLS, the Cloudflare-only allow-list and the security headers live in the HOST nginx
# (deploy/cloudpe-prod/edge/nginx-prod.conf), which proxies here. Routing is the same as
# staging's (deploy/nivesh-staging/nginx-staging.conf) minus the staging-only
# SURAKSHA demo. Docker DNS with a short re-resolve so a recreated container is
# picked up within ~10 s (no 502 race after a deploy).
#
#   app-backend:8001      V2 FastAPI (+ CAS ingestion routers)
#   app-frontend:80       React SPA for /v2/ /v3/ /v4/
#   app-frontend-v5:80    Vite SPA for /v5/
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8444 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_x_real_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 50m;

    set $app_backend_host       app-backend;
    set $app_frontend_host      app-frontend;
    set $app_frontend_v5_host   app-frontend-v5;

    location /api/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location ^~ /webhooks/ {
        proxy_pass http://$app_backend_host:8001;
    }
    location /v5/ {
        proxy_pass http://$app_frontend_v5_host:80;
    }
    location = /v5 {
        return 301 /v5/$is_args$args;
    }
    # Mobile app downloads — static files from a host directory mounted read-only.
    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }
    location / {
        proxy_pass http://$app_frontend_host:80;
    }
}
