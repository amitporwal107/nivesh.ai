# Host nginx for the CloudPe PRODUCTION VM — the only listener on :80/:443.
#
# Installed by bootstrap.sh as /etc/nginx/sites-available/nivesh-prod. Companion files it writes:
#   /etc/nginx/conf.d/00-cloudflare-only.conf   allow <Cloudflare ranges>; deny all;  (http scope)
#   /etc/nginx/conf.d/nivesh-prod-ratelimit.conf  the nidp_api zone
#   /etc/nginx/ssl/prod.crt|prod.key            Cloudflare Origin CA cert (niveshcopilot.com + *.)
#
#   data.niveshcopilot.com   /daas/ → 127.0.0.1:8083   /query/ → 127.0.0.1:8090   /health
#   everything else          → app edge container, 127.0.0.1:8444 (deploy/cloudpe-prod/app/nginx-edge.conf)
#
# Cloudflare reaches this origin on 443 (Full strict). The Cloudflare-only allow-list means a
# direct request to the VM's IP gets 403, so CF-Connecting-IP below can be trusted as the client IP.

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# ── :80 — redirect (Cloudflare is configured to connect on 443; this only catches stragglers) ──
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── data.niveshcopilot.com — NIDP DaaS + Query API ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name data.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/prod.crt;
    ssl_certificate_key /etc/nginx/ssl/prod.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 50M;

    location = /daas { return 301 /daas/; }
    location /daas/ {
        limit_req zone=nidp_api burst=200 nodelay;
        proxy_pass         http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $client_ip;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /query { return 301 /query/; }
    location /query/ {
        limit_req zone=nidp_api burst=200 nodelay;
        proxy_pass         http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $client_ip;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Grafana / Loki are not part of the CloudPe deployment (see deploy/cloudpe/README.md "Not covered").
    location / { return 404; }
}

# ── Everything else: niveshcopilot.com, www, api, admin, assets, work … → the app ──
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name niveshcopilot.com www.niveshcopilot.com _;

    ssl_certificate     /etc/nginx/ssl/prod.crt;
    ssl_certificate_key /etc/nginx/ssl/prod.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (A10 / ASVS V9.1 + V14.4) on every response; the proxy locations
    # add none of their own, so nothing drops these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 50m;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass         http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $client_ip;
        proxy_set_header   X-Forwarded-For   $client_ip;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
