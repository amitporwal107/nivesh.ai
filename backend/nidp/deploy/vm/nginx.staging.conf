# nginx staging vhost — data.staging.niveshcopilot.com
#
# Installed at /etc/nginx/sites-available/nidp-staging by install_nginx_staging.sh.
# TLS certs pulled from GCP Secret Manager:
#   nidp-tls-cert-staging, nidp-tls-key-staging
#
# Port mapping (separate from prod to avoid conflicts):
#   /daas/*    → 127.0.0.1:8084  (staging DaaS API)
#   /query/*   → 127.0.0.1:8091  (staging Query API)
#   /grafana/* → 127.0.0.1:3000  (shared Grafana — same instance as prod)
#   /health    → 200 OK

server {
    listen 80;
    server_name data.staging.niveshcopilot.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data.staging.niveshcopilot.com;

    # Reuses prod wildcard cert (*.niveshcopilot.com covers data.staging.*)
    ssl_certificate     /etc/nginx/ssl/data.crt;
    ssl_certificate_key /etc/nginx/ssl/data.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    # Clearly identify staging origin in response headers
    add_header X-NIDP-Env staging always;

    client_max_body_size 50M;

    # ── /daas/* → Staging DaaS API (port 8084) ─────────────────────────
    location = /daas { return 301 /daas/; }
    location /daas/ {
        limit_req zone=nidp_api burst=200 nodelay;

        proxy_pass         http://127.0.0.1:8084/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── /query/* → Staging Query API (port 8091) ───────────────────────
    location = /query { return 301 /query/; }
    location /query/ {
        limit_req zone=nidp_api burst=200 nodelay;

        proxy_pass         http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── /grafana/* → Grafana (shared with prod on port 3000) ───────────
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    location = /health {
        access_log off;
        return 200 "ok-staging\n";
        add_header Content-Type text/plain;
    }

    location / { return 404; }
}
