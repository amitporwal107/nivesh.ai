apiVersion: 1

# Provisioned datasources for nidp-stack-vm Grafana.
# Mounted at /etc/grafana/provisioning/datasources/datasources.yml.
# Grafana picks these up on container start; no UI clicks needed.
datasources:

  - name: NIDP-TimescaleDB
    uid: NIDP-TimescaleDB
    type: postgres
    access: proxy
    url: nidp-postgres:5432
    database: nidp
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: false
    editable: true

  - name: Loki
    uid: NIDP-Loki
    type: loki
    access: proxy
    url: http://nidp-loki:3100
    jsonData:
      maxLines: 5000
      timeout: 60
    isDefault: false
    editable: true

  - name: Google Cloud Logging
    uid: gcp-logging
    type: googlecloud-logging-datasource
    access: proxy
    editable: true
    jsonData:
      authenticationType: jwt
      defaultProject: niveshdataintelligence
      clientEmail: nivesh-log-triage-sa@niveshdataintelligence.iam.gserviceaccount.com
      tokenUri: https://oauth2.googleapis.com/token
    secureJsonData:
      # Set on host before starting: export GCP_LOG_TRIAGE_PRIVATE_KEY="$(jq -r .private_key /opt/nidp/secrets/log-triage-sa.json)"
      privateKey: ${GCP_LOG_TRIAGE_PRIVATE_KEY}
