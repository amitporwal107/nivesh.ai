apiVersion: 1

# Provisioned PostgreSQL datasource pointing at the local TimescaleDB.
# Mounted into the Grafana container at
#   /etc/grafana/provisioning/datasources/datasources.yml
# Grafana picks this up on container start; no UI clicks needed.
datasources:
  - name: NIDP-TimescaleDB
    type: postgres
    access: proxy
    # When running inside docker-compose, the postgres container is
    # reachable as `nidp-postgres` (its container name) on its native
    # port 5432 (the 5433 host-port is the published mapping).
    url: nidp-postgres:5432
    database: nidp
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true
