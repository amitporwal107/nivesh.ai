apiVersion: 1

# Provisioned PostgreSQL datasource pointing at the local TimescaleDB.
# Mounted at /etc/grafana/provisioning/datasources/datasources.yml.
# Grafana picks this up on container start; no UI clicks needed.
datasources:
  - name: NIDP-TimescaleDB
    uid: NIDP-TimescaleDB        # referenced by nidp_job_health.json
    type: postgres
    access: proxy
    # Container hostname `nidp-postgres` from docker-compose, port 5432
    # is the container-internal port (the 5433 host-port is the published mapping).
    url: nidp-postgres:5432
    database: nidp
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    # Prometheus is already default — don't fight it.
    isDefault: false
    editable: true
