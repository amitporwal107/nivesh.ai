apiVersion: 1

providers:
  - name: NIDP-Prod
    orgId: 1
    folder: NIDP Prod
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/prod

  - name: NIDP-Staging
    orgId: 1
    folder: NIDP Staging
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/staging
