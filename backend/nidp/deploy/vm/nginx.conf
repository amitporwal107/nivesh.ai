# Reverse proxy for nidp-stack-vm services.
# Installed at /etc/nginx/sites-available/nidp by install_nginx.sh.
# TLS certs at /etc/nginx/ssl/data.{crt,key} (pulled from GCP Secret Manager:
#   nidp-tls-cert, nidp-tls-key — both accessed by nidp-sa).
#
# Routes (path is stripped before forwarding to upstream):
#   /daas/*     -> 127.0.0.1:8083  (nidp-daas-api)
#   /query/*    -> 127.0.0.1:8090  (nidp-query-api)
#   /grafana/*  -> 127.0.0.1:3000  (grafana — needs sub_path enabled in compose env)
#   /health     -> 200 OK          (nginx-level liveness; does NOT prove upstream health)

# Rate-limit zone — server-to-server APIs. 100 r/s per IP, burst 200.
limit_req_zone $binary_remote_addr zone=nidp_api:10m rate=100r/s;

server {
    listen 80;
    server_name data.niveshcopilot.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data.niveshcopilot.com;

    ssl_certificate     /etc/nginx/ssl/data.crt;
    ssl_certificate_key /etc/nginx/ssl/data.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 50M;

    # ── /daas/* → DaaS API ──────────────────────────────────────────────
    location = /daas { return 301 /daas/; }
    location /daas/ {
        limit_req zone=nidp_api burst=200 nodelay;

        proxy_pass         http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── /query/* → Query API ────────────────────────────────────────────
    location = /query { return 301 /query/; }
    location /query/ {
        limit_req zone=nidp_api burst=200 nodelay;

        proxy_pass         http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── /grafana/* → Grafana ────────────────────────────────────────────
    # Requires grafana env:
    #   GF_SERVER_ROOT_URL=https://data.niveshcopilot.com/grafana/
    #   GF_SERVER_SERVE_FROM_SUB_PATH=true
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        # NO trailing slash on proxy_pass — Grafana runs with
        # GF_SERVER_SERVE_FROM_SUB_PATH=true and serves its SPA + assets at
        # /grafana/public/build/*. A trailing slash here would strip the
        # /grafana/ prefix before forwarding, causing every static asset
        # request to 404 ("Grafana has failed to load its application files").
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Grafana live websockets
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── nginx-level liveness ────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / { return 404; }
}
