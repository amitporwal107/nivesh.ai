# NIDP production docker-compose — runs TimescaleDB only.
# Native VM processes (run_service.sh, nidp-query-api) reach it via
# localhost:5433 (host-bound port below).
# The Nivesh backend container reaches it via the shared nidp-bridge network
# using hostname `nidp-postgres` on the default postgres port 5432.
#
# One-time network creation (idempotent):
#   docker network create nidp-bridge
# Then:
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nidp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${NIDP_PG_USER:-nidp}
      POSTGRES_PASSWORD: ${NIDP_PG_PASSWORD}
      POSTGRES_DB:       ${NIDP_PG_DB:-nidp}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /opt/nidp/data/postgres:/var/lib/postgresql/data
    networks: [nidp-default, nidp-bridge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NIDP_PG_USER:-nidp}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  nidp-default:
    name: nidp-default
  nidp-bridge:
    name: nidp-bridge
    external: true
