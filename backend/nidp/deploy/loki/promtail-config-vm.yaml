# promtail-config-vm.yaml — Production VM log shipping config
# Ships NIDP service logs and Docker container logs to Loki.
# Mounted into nidp-promtail container by docker-compose.infra.yml.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://nidp-loki:3100/loki/api/v1/push

scrape_configs:

  # ── NIDP service logs (written by run_service.sh to /opt/nidp/logs/<service>/) ──
  - job_name: nidp_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: nidp_services
          vm: nidp-stack-vm
          __path__: /nidp/logs/*/*.log
    pipeline_stages:
      # Extract service name from the directory path component
      - regex:
          expression: '.*/logs/(?P<service>[^/]+)/.*\.log'
          source: filename
      - labels:
          service: service
      # Parse JSON structured log lines emitted by NIDP Python services
      - json:
          expressions:
            level:    level
            logger:   logger
            run_id:   run_id
            source:   source
            ingester: ingester
      - labels:
          level:    ""
          ingester: ""
      - timestamp:
          source: time
          format: RFC3339Nano
          action_on_failure: skip

  # ── Docker container stdout/stderr logs ───────────────────────────────────
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: status
            values: [running]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      - source_labels: ['__meta_docker_container_image']
        target_label: image
      - source_labels: ['__meta_docker_container_label_environment']
        target_label: environment
      - replacement: nidp-stack-vm
        target_label: vm
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time:   time
      - json:
          expressions:
            level:   level
            message: msg
          source: output
      - labels:
          level:  ""
          stream: ""
      - output:
          source: output

  # ── System logs (syslog, cron output) ─────────────────────────────────────
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          vm: nidp-stack-vm
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\w+\s+\d+\s+[\d:]+)\s+(?P<host>\S+)\s+(?P<process>[^:]+):\s+(?P<message>.*)'
      - timestamp:
          source: time
          format: "Jan _2 15:04:05"
          action_on_failure: skip
