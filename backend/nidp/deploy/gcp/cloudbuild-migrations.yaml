# Cloud Build pipeline for NIDP DB migrations.
#
# Responsibility: build + push the migration runner image only.
# Executing the migration (Cloud Run Job create + execute) is done by
# deploy_mf_feeds.sh so the caller's gcloud credentials (which have
# full project permissions) handle Cloud Run — not the Cloud Build SA.
#
# Usage:
#   gcloud builds submit . \
#     --config=backend/nidp/deploy/gcp/cloudbuild-migrations.yaml \
#     --project=<PROJECT> --region=asia-south1

steps:
  - id: build-and-push
    name: gcr.io/kaniko-project/executor:v1.20.0
    args:
      - --dockerfile=backend/nidp/deploy/gcp/Dockerfile.migrate
      - --context=dir:///workspace
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/nidp/migrations:$BUILD_ID
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/nidp/migrations:latest
      - --cache=true
      - --cache-ttl=720h
      - --cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/nidp-cache/migrations
      - --compressed-caching=false
      - --snapshot-mode=redo
      - --use-new-run

substitutions:
  _REGION: 'asia-south1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  pool:
    name: projects/$PROJECT_ID/locations/asia-south1/workerPools/nidp-private-pool

timeout: 600s
