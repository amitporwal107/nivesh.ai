# Prometheus scrape config — NIDP local dev.
#
# Each ingester exposes /metrics on its own port (NIDP_METRICS_PORT,
# defaults per-service: 9100 bulk_deals, 9101 bhavcopy, …). Adjust
# `targets` when running ingesters as containers vs host processes.

global:
  scrape_interval:     15s
  evaluation_interval: 30s
  external_labels:
    cluster: nidp-dev

rule_files:
  - /etc/prometheus/prometheus_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host-side ingesters (when run via `python -m nidp.services.<x>`).
  - job_name: nidp-ingesters
    static_configs:
      - targets:
          - "host.docker.internal:9100"   # bulk_deals
          - "host.docker.internal:9101"   # bhavcopy
          - "host.docker.internal:9102"   # block_deals
          - "host.docker.internal:9103"   # delivery
          - "host.docker.internal:9104"   # index_close
          - "host.docker.internal:9105"   # index_constituents
          - "host.docker.internal:9106"   # fii_dii
          - "host.docker.internal:9107"   # corporate_actions
          - "host.docker.internal:9108"   # rbi_yields
          - "host.docker.internal:9109"   # nse_calendar

  # When ingesters are containerised on the same compose network,
  # comment out the host.docker.internal targets and add per-service
  # entries here, one per service container.
