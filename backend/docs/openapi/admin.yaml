      title: ActionFeedback
      description: Request body for action feedback.
    ActionRequest:
      properties:
        action:
          type: string
          title: Action
        target:
          type: string
          title: Target
        environment:
          type: string
          title: Environment
          default: prod
      type: object
      required:
      - action
      - target
      title: ActionRequest
    ActionStatusUpdate:
      properties:
        status:
          type: string
          title: Status
        completion_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Completion Note
      type: object
      required:
      - status
      title: ActionStatusUpdate
      description: Request body for updating action status.
    AgentOneShotRequest:
      properties:
        agent_id:
          type: string
