  /api/admin/nidp/full-portfolio-sync:
    post:
      summary: Trigger Full Portfolio Sync
      description: "Run the full Nivesh → GCS → NIDP portfolio sync chain.\n\nStage\
        \ 1 — Nivesh → GCS exporters (Mongo + PG → JSONL):\n  * portfolio_gcs_export.export_portfolio_to_gcs\
        \       (holdings)\n  * portfolio_gcs_export.export_cas_transactions_to_gcs\
        \ (CAS txns)\n  * portfolio_gcs_export.export_user_goals_to_gcs       (goals)\n\
        \nStage 2 — NIDP-side ingesters (GCS → TimescaleDB), via NIDP Query API:\n\
        \  * portfolio_holdings_sync\n  * portfolio_transactions_sync\n  * portfolio_goals_sync\n\
        \  * portfolio_intelligence_sync (joins all three + computes analytics)\n\n\
        Stage 2 is skipped (with a warning) if NIDP_QUERY_API_URL/TOKEN aren't\nconfigured\
        \ — useful when smoke-testing just the export side.\n\nOptional body: {\"\
        date\": \"YYYY-MM-DD\"} for the snapshot date label.\nAdmin only."
      operationId: trigger_full_portfolio_sync_api_admin_nidp_full_portfolio_sync_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - admin
