openapi: 3.1.0
info:
  title: Admin
  version: 1.0.0
paths:
  /api/admin/data-pipeline/status:
    get:
      tags:
      - admin-data-pipeline
      summary: Get Pipeline Status
      description: Last-success timestamps + next-run times + Redis cache stats.
      operationId: get_pipeline_status_api_admin_data_pipeline_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Pipeline Status Api Admin Data Pipeline Status
                  Get
  /api/admin/data-pipeline/logs:
    get:
      tags:
      - admin-data-pipeline
      summary: Get Pipeline Logs
      description: Recent job-log rows for the admin monitoring table.
      operationId: get_pipeline_logs_api_admin_data_pipeline_logs_get
      parameters:
      - name: job
        in: query
        required: false
        schema:
          type: string
          description: 'Filter by job: nav_cron | analytics_sweep | v3_rescore | nifty100_refresh'
          title: Job
        description: 'Filter by job: nav_cron | analytics_sweep | v3_rescore | nifty100_refresh'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 30
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Pipeline Logs Api Admin Data Pipeline Logs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/data-pipeline/trigger/{job_name}:
    post:
      tags:
      - admin-data-pipeline
      summary: Trigger Job
      description: 'Manually retrigger a pipeline job. Returns 202-like ack; the job
        runs

        in the background. Poll `/status` or `/logs` for completion.'
      operationId: trigger_job_api_admin_data_pipeline_trigger__job_name__post
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Trigger Job Api Admin Data Pipeline Trigger  Job Name  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/data-pipeline/cache/invalidate:
    post:
      tags:
      - admin-data-pipeline
      summary: Invalidate Cache
      description: Nuke the entire V3 score Redis cache. Next API read recomputes.
      operationId: invalidate_cache_api_admin_data_pipeline_cache_invalidate_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Invalidate Cache Api Admin Data Pipeline Cache Invalidate
                  Post
  /api/admin/data-pipeline/cache/invalidate-performance:
    post:
      tags:
      - admin-data-pipeline
      summary: Invalidate Performance Caches
      description: "Clear all per-user performance caches so the next request recomputes\n\
        with the current code.\n\nClears:\n  - MongoDB  fund_performance_cache  (mfapi.in-based\
        \ 1Y/3M/1M rankings)\n  - Postgres portfolio_performance_cache  (XIRR / waterfall\
        \ / contributors)\n\nCalled automatically by the GitHub Actions deploy workflow\
        \ after each\nsuccessful health check, so users always see data computed with\
        \ the\ndeployed code — never stale data from a previous version."
      operationId: invalidate_performance_caches_api_admin_data_pipeline_cache_invalidate_performance_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Invalidate Performance Caches Api Admin Data Pipeline
                  Cache Invalidate Performance Post
  /api/admin/data-pipeline/progress/{job_name}/clear:
    post:
      tags:
      - admin-data-pipeline
      summary: Clear Progress
      description: 'Clear a stuck live-progress record (admin recovery). Does NOT
        kill the

        underlying task — use when a progress record is orphaned (job crashed

        silently) and you want the UI to stop showing ''running/stuck''.'
      operationId: clear_progress_api_admin_data_pipeline_progress__job_name__clear_post
      parameters:
      - name: job_name
        in: path
        required: true
        schema:
          type: string
          title: Job Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Clear Progress Api Admin Data Pipeline Progress  Job
                  Name  Clear Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/diag:
    get:
      tags:
      - admin-nidp
      summary: Diag
      description: 'Connection diagnostics — what URL admin_nidp is trying, whether

        NIDP Query API is reachable + authenticated, plus whether the local

        app Postgres pool connects. The first row tells you whether the

        admin console can talk to the GCP-side warehouse at all.'
      operationId: diag_api_admin_nidp_diag_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Diag Api Admin Nidp Diag Get
  /api/admin/nidp/script:
    get:
      tags:
      - admin-nidp
      summary: Script Health
      description: 'Pre-flight check the UI can hit before showing the Run button
        —

        confirms the script exists and is executable, plus whether `gh` is

        on PATH (without that, the script will print to /tmp instead of

        uploading).'
      operationId: script_health_api_admin_nidp_script_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Script Health Api Admin Nidp Script Get
  /api/admin/nidp/dump:
    post:
      tags:
      - admin-nidp
      summary: Trigger Dump
      description: 'Run dump_for_claude.sh and return the gist URL it printed.


        The script writes a /tmp/nidp_dump_*.md file *and* (when gh is

        available) uploads it to a private gist. We capture both stdout

        and stderr and surface the gist URL to the caller.'
      operationId: trigger_dump_api_admin_nidp_dump_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Trigger Dump Api Admin Nidp Dump Post
  /api/admin/nidp/jobs:
    get:
      tags:
      - admin-nidp
      summary: List Jobs
      description: 'List all 13 NIDP ingesters with their latest run status (from

        nidp.v_feed_status) and current Cloud Run image tag.


        The DB query is one round-trip; the gcloud calls are fired in

        parallel so the whole thing returns in ~1-2s even with 13 jobs.'
      operationId: list_jobs_api_admin_nidp_jobs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Jobs Api Admin Nidp Jobs Get
  /api/admin/nidp/jobs/{ingester}/execute:
    post:
      tags:
      - admin-nidp
      summary: Execute Job
      description: 'Trigger an ingester run for the given target date. Routes through

        the NIDP Query API on the VM (which spawns run_service.sh detached).

        Returns immediately — UI polls /jobs/{ingester}/runs to see the

        job_log row land.'
      operationId: execute_job_api_admin_nidp_jobs__ingester__execute_post
      parameters:
      - name: ingester
        in: path
        required: true
        schema:
          type: string
          title: Ingester
      - name: target_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          description: ISO date (YYYY-MM-DD) for the run; defaults to last trading
            day on the VM.
          title: Target Date
        description: ISO date (YYYY-MM-DD) for the run; defaults to last trading day
          on the VM.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Execute Job Api Admin Nidp Jobs  Ingester  Execute
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/jobs/{ingester}/calendar:
    get:
      tags:
      - admin-nidp
      summary: Job Calendar
      description: 'Per-day status strip for the last N days (default 7). Used by
        the

        Console''s week-view widget. Pass-through to the NIDP Query API.'
      operationId: job_calendar_api_admin_nidp_jobs__ingester__calendar_get
      parameters:
      - name: ingester
        in: path
        required: true
        schema:
          type: string
          title: Ingester
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 7
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Job Calendar Api Admin Nidp Jobs  Ingester  Calendar
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/jobs/{ingester}/runs:
    get:
      tags:
      - admin-nidp
      summary: Job Runs
      description: 'Last N rows from nidp.job_log for this ingester (proxied through

        the NIDP Query API, which already shapes the response).'
      operationId: job_runs_api_admin_nidp_jobs__ingester__runs_get
      parameters:
      - name: ingester
        in: path
        required: true
        schema:
          type: string
          title: Ingester
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Job Runs Api Admin Nidp Jobs  Ingester  Runs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/jobs/{ingester}/logs:
    get:
      tags:
      - admin-nidp
      summary: Job Logs
      description: 'Tail logs for this ingester. VM-mode reads

        /opt/nidp/logs/<ingester>/<ingester>.log via the query_api;

        falls back to `gcloud logging read` against Cloud Run if the

        query_api isn''t configured.'
      operationId: job_logs_api_admin_nidp_jobs__ingester__logs_get
      parameters:
      - name: ingester
        in: path
        required: true
        schema:
          type: string
          title: Ingester
      - name: window
        in: query
        required: false
        schema:
          type: string
          description: Legacy gcloud freshness window (only used in fallback).
          default: 4h
          title: Window
        description: Legacy gcloud freshness window (only used in fallback).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Job Logs Api Admin Nidp Jobs  Ingester  Logs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/catalog:
    get:
      tags:
      - admin-nidp
      summary: Catalog
      description: 'Holistic NIDP data catalog — proxies three NIDP Query API calls

        in parallel and merges into the single payload the React panel binds

        to. Tables/by_domain come from /catalog, feeds from /feeds, and

        validation runs from /validation. Each is independent: a failure in

        one section returns a partial catalog rather than a 500.'
      operationId: catalog_api_admin_nidp_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Catalog Api Admin Nidp Catalog Get
  /api/admin/nidp/quality/expectations:
    get:
      tags:
      - admin-nidp
      summary: Quality Expectations
      description: 'Documentation endpoint: every Great-Expectations suite the

        NIDP `quality_gate` runs, with the column, kwargs and rule type

        for each expectation. Surfaced as the ''Expectations'' tab in the

        admin console''s Data Quality page.'
      operationId: quality_expectations_api_admin_nidp_quality_expectations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Quality Expectations Api Admin Nidp Quality Expectations
                  Get
  /api/admin/nidp/dq/{tail}:
    post:
      tags:
      - admin-nidp
      summary: Authenticated proxy to NIDP DaaS /v1/dq/*
      operationId: dq_proxy_api_admin_nidp_dq__tail__post
      parameters:
      - name: tail
        in: path
        required: true
        schema:
          type: string
          title: Tail
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - admin-nidp
      summary: Authenticated proxy to NIDP DaaS /v1/dq/*
      operationId: dq_proxy_api_admin_nidp_dq__tail__post_patch
      parameters:
      - name: tail
        in: path
        required: true
        schema:
          type: string
          title: Tail
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin-nidp
      summary: Authenticated proxy to NIDP DaaS /v1/dq/*
      operationId: dq_proxy_api_admin_nidp_dq__tail__post_delete
      parameters:
      - name: tail
        in: path
        required: true
        schema:
          type: string
          title: Tail
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - admin-nidp
      summary: Authenticated proxy to NIDP DaaS /v1/dq/*
      operationId: dq_proxy_api_admin_nidp_dq__tail__post_get
      parameters:
      - name: tail
        in: path
        required: true
        schema:
          type: string
          title: Tail
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/quality/summary:
    get:
      tags:
      - admin-nidp
      summary: Quality Summary
      description: Aggregated quality snapshot — quality scores + certification +
        gate per domain.
      operationId: quality_summary_api_admin_nidp_quality_summary_get
      parameters:
      - name: domain
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Quality Summary Api Admin Nidp Quality Summary Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/quality/consistency:
    get:
      tags:
      - admin-nidp
      summary: Quality Consistency
      description: Consistency runs + findings in one call.
      operationId: quality_consistency_api_admin_nidp_quality_consistency_get
      parameters:
      - name: domain
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Quality Consistency Api Admin Nidp Quality Consistency
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/quality/exceptions:
    get:
      tags:
      - admin-nidp
      summary: Quality Exceptions
      description: Exception queue — unresolved REVIEW items awaiting ops action.
      operationId: quality_exceptions_api_admin_nidp_quality_exceptions_get
      parameters:
      - name: resolved
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Resolved
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Quality Exceptions Api Admin Nidp Quality Exceptions
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/quality/exceptions/{queue_id}:
    patch:
      tags:
      - admin-nidp
      summary: Resolve Exception
      description: Resolve or override an exception queue item (ops action).
      operationId: resolve_exception_api_admin_nidp_quality_exceptions__queue_id__patch
      parameters:
      - name: queue_id
        in: path
        required: true
        schema:
          type: string
          title: Queue Id
      - name: action
        in: query
        required: true
        schema:
          type: string
          description: APPROVE | REJECT | OVERRIDE | ESCALATE
          title: Action
        description: APPROVE | REJECT | OVERRIDE | ESCALATE
      - name: resolution_note
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Resolution Note
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Resolve Exception Api Admin Nidp Quality Exceptions  Queue
                  Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/quality/quarantine:
    get:
      tags:
      - admin-nidp
      summary: Quality Quarantine
      description: 'Dates condemned by the quality gate (FAIL → quarantine_log).

        Returns empty list gracefully if the Query API hasn''t been redeployed

        with the /quarantine endpoint yet (404 from upstream → empty response).'
      operationId: quality_quarantine_api_admin_nidp_quality_quarantine_get
      parameters:
      - name: domain
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Quality Quarantine Api Admin Nidp Quality Quarantine
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/archive/{ingester}:
    get:
      tags:
      - admin-nidp
      summary: List Archive
      operationId: list_archive_api_admin_nidp_archive__ingester__get
      parameters:
      - name: ingester
        in: path
        required: true
        schema:
          type: string
          title: Ingester
      - name: target_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          description: If set, list files only for this date.
          title: Target Date
        description: If set, list files only for this date.
      - name: limit_dates
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Limit Dates
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Archive Api Admin Nidp Archive  Ingester  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/archive/{ingester}/{target_date}/{filename}:
    get:
      tags:
      - admin-nidp
      summary: Download Archive
      operationId: download_archive_api_admin_nidp_archive__ingester___target_date___filename__get
      parameters:
      - name: ingester
        in: path
        required: true
        schema:
          type: string
          title: Ingester
      - name: target_date
        in: path
        required: true
        schema:
          type: string
          title: Target Date
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/api-keys/{key}/regenerate:
    post:
      tags:
      - admin-nidp
      summary: Regenerate Nidp Api Key
      description: 'Generate a new secure token for a NIDP API key and persist it
        to the

        secrets store. The new value is returned once — copy it immediately.


        Supported keys: NIDP_DAAS_API_KEY, NIDP_QUERY_API_TOKEN'
      operationId: regenerate_nidp_api_key_api_admin_nidp_api_keys__key__regenerate_post
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/nidp/run-job:
    post:
      tags:
      - admin-nidp-static
      summary: Run Job Static Key
      description: "Trigger any NIDP ingester by name using a static admin key.\n\n\
        Useful for scripts / cron / curl where a browser session is unavailable.\n\
        Routes through the NIDP Query API on the VM — same behaviour as the\nsession-auth\
        \ /jobs/{ingester}/execute endpoint.\n\ncurl -X POST https://niveshcopilot.com/api/admin/nidp/run-job\
        \ \\\n     -H 'Content-Type: application/json' \\\n     -H 'X-Admin-Key: niv3sh-reset-2026'\
        \ \\\n     -d '{\"ingester\": \"pra_engine\", \"target_date\": \"2026-06-03\"\
        }'"
      operationId: run_job_static_key_api_admin_nidp_run_job_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Run Job Static Key Api Admin Nidp Run Job Post
