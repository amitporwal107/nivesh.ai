  /api/portfolio/snapshot:
    get:
      tags:
      - snapshots
      summary: Get Snapshot
      description: 'If `date` omitted → latest snapshot. If given → that exact date,

        else the closest earlier snapshot (for timeline scrubbing).'
      operationId: get_snapshot_api_portfolio_snapshot_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - snapshots
      summary: Manual Snapshot
      description: 'Advisor-triggered snapshot. Overwrites today''s snapshot if

        one already exists.'
      operationId: manual_snapshot_api_portfolio_snapshot_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualSnapshotRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
