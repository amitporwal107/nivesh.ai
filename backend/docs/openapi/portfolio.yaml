          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - portfolio
  /api/portfolio/holding-detail/{isin}:
    get:
      summary: Get Holding Detail
      description: 'Return V3 DaaS primitives + category peer data for a single ISIN.


        Fetches from NIDP DaaS using get_v3_mf_primitives_bulk([isin]).

        Also fetches top-3 peers from analytics.fund_category_rank via

        the category leaderboard DaaS endpoint.


        Returns daas_available=false (not an error) when the ISIN has no V3

        data — e.g. equities or funds not yet in the NIDP analytics lake.'
      operationId: get_holding_detail_api_portfolio_holding_detail__isin__get
      parameters:
      - name: isin
        in: path
        required: true
        schema:
          type: string
          title: Isin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - portfolio
  /api/portfolio/value-history:
    get:
      summary: Get Portfolio Value History
      description: 'Monthly portfolio value history from CAS statement extraction.


        Returns the [{month, value_rs}] array stored in the user''s profile

        during CAS import (cas_summary_vision.py). These are the real monthly

        portfolio values printed on the CAS statement — not modelled numbers.


        Also returns the current_value from holdings so the last data-point

        can be spliced in.'
      operationId: get_portfolio_value_history_api_portfolio_value_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - portfolio
  /api/portfolio/tax-summary:
    get:
      summary: Get Tax Summary
      description: "LTCG harvest candidates + tax structuring opportunities.\n\nReturns\
        \ a dashboard-grade payload matching docs/api-changes.md B.12.\n\nQuery params:\n\
        \    fy — optional FY label (e.g. \"FY 2025-26\"). Defaults to current FY."
      operationId: get_tax_summary_api_portfolio_tax_summary_get
      parameters:
      - name: fy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Fy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Tax Summary Api Portfolio Tax Summary Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - portfolio
