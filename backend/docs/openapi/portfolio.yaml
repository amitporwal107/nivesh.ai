    get:
      tags:
      - cas-snapshots
      summary: List Cas Snapshots
      description: 'Lightweight list of all CAS snapshots — no holdings payload.

        Returns newest-first so the timeline UI can render tiles immediately.'
      operationId: list_cas_snapshots_api_portfolio_cas_snapshots_get
      parameters:
