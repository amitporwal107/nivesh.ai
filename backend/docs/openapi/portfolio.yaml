  /api/portfolio/compare:
    get:
      tags:
      - snapshots
      summary: Compare
      description: '?to=YYYY-MM-DD&from=YYYY-MM-DD. Defaults: to=latest, from=2nd
        latest.

        (FastAPI aliases ''from_'' because `from` is a Python keyword — frontend

        passes `from`.)'
      operationId: compare_api_portfolio_compare_get
      parameters:
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: To
      - name: from_
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: 'From '
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/portfolio/snapshots/backfill-names:
    post:
      tags:
      - snapshots
      summary: Backfill Holding Names
      description: 'Repair truncated MF/ETF scheme names by looking up each holding''s

        ISIN in the AMFI master. Idempotent — only renames when AMFI''s name

        is materially better than what''s stored. Updates both the live

        `holdings` table and embedded `portfolio_snapshots.holdings` arrays.'
      operationId: backfill_holding_names_api_portfolio_snapshots_backfill_names_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/portfolio/snapshots/backfill-health:
    post:
      tags:
      - snapshots
      summary: Backfill Snapshot Health
      description: 'One-shot: compute Portfolio Health for every historical snapshot

        that''s missing it, so the Time Machine deltas + sparkline can plot

        a real trend. Slow (one health compute per snapshot) — the route

        awaits to completion so the UI can poll the result. Subsequent

        calls are no-ops because `only_missing=True` skips populated rows.'
      operationId: backfill_snapshot_health_api_portfolio_snapshots_backfill_health_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/portfolio/transactions:
    get:
      tags:
      - cas-transactions
      summary: List Transactions
      description: 'List CAS-extracted transactions for the current user.


        Supports optional ISIN / folio filters. Sorted by date desc.'
      operationId: list_transactions_api_portfolio_transactions_get
      parameters:
      - name: isin
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by ISIN
          title: Isin
        description: Filter by ISIN
      - name: folio
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by folio number
          title: Folio
        description: Filter by folio number
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/portfolio/sips:
    get:
      tags:
      - cas-transactions
      summary: List Detected Sips
      description: 'List SIPs detected from CAS transaction patterns.


        Each SIP carries cadence (MONTHLY/QUARTERLY), amount, instalment count,

        first/last dates, total invested, and ACTIVE/PAUSED status (PAUSED

        when the most recent instalment is past 2× cadence).'
      operationId: list_detected_sips_api_portfolio_sips_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
