openapi: 3.1.0
info:
  title: Portfolio
  version: 1.0.0
paths:
  /api/portfolio/upload:
    post:
      tags:
      - Portfolio Upload
      summary: Upload portfolio file (CAS PDF / CSV / Excel)
      description: 'Upload a portfolio file. Accepts **CSV**, **Excel (.xlsx / .xls)**
        and

        **CAS PDF** (NSDL / CDSL / CAMS / KFintech).


        **CSV / Excel** are parsed synchronously — holdings are returned in the

        response body.


        **CAS PDF** uploads kick off background parsing via the tiered chain

        in `helpers.parsing.parse_cas_pdf_with_data`:


        | Tier | Parser | When it runs | Latency | Cost |

        |------|--------|--------------|---------|------|

        | 1 | **GPT-5 Vision** (default) | Always tried first if `OPENAI_API_KEY`
        is set | 35-70 s | ~$0.30 / parse |

        | 2 | casparser library | Fallback for text-based PDFs | < 1 s | free |

        | 3 | Docling local OCR | Last resort if both above fail | 30-60 s | free
        |


        For PDFs the response contains a `task_id`; poll

        `/portfolio/upload-status/{task_id}` until `status == "completed"`.

        The completed payload carries the holdings list plus the

        `parser_source` that produced them (`openai_gpt5` / `casparser_lib` /

        `docling`).


        **Password-protected CAS PDFs**: use the

        `/portfolio/upload-raw` variant with the `X-Password` header (PAN in

        UPPERCASE, e.g. `ABCDE1234F`).'
      operationId: upload_portfolio_api_portfolio_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_portfolio_api_portfolio_upload_post'
        required: true
      responses:
        '200':
          description: 'For CSV/Excel: holdings parsed synchronously and returned
            immediately. For PDF: a `task_id` is returned and parsing continues in
            the background; poll `/portfolio/upload-status/{task_id}` until `status
            == "completed"`.'
          content:
            application/json:
              schema: {}
              examples:
                pdf_accepted:
                  summary: CAS PDF accepted for background parsing
                  value:
                    task_id: task_a1b2c3d4e5f6
                    status: processing
                    message: CAS PDF is being processed by AI. This may take 1-2 minutes.
                    count: 0
                    holdings: []
                csv_done:
                  summary: CSV / Excel parsed synchronously
                  value:
                    message: 3 holdings imported from CSV
                    count: 3
                    holdings:
                    - ticker: INE040A01034
                      quantity: 10
        '400':
          description: Unsupported format, empty file, or wrong CAS PDF password.
        '413':
          description: File exceeds the maximum upload size.
        '415':
          description: File magic-byte check failed (validate_upload).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/portfolio/upload-raw:
    post:
      tags:
      - Portfolio Upload
      summary: Raw stream upload (large files, password-protected CAS PDFs)
      description: "Raw `application/octet-stream` upload endpoint. Use this when:\n\
        \n- The file is too large for the multipart form path.\n- The CAS PDF needs\
        \ a **password** (use the `X-Password` header — PAN\n  in UPPERCASE, e.g.\
        \ `ABCDE1234F`).\n- You want to attach the upload to a specific portfolio\
        \ (use the\n  `X-Portfolio-Id` header).\n\n**Required headers**\n\n| Header\
        \ | Required | Notes |\n|--------|----------|-------|\n| `X-Filename` | Yes\
        \ | e.g. `cas.pdf`, `portfolio.csv` — drives parser selection |\n| `X-Password`\
        \ | Conditional | CAS PDF password (PAN uppercase). Empty for unprotected\
        \ files. |\n| `X-Portfolio-Id` | Optional | Save holdings into this portfolio;\
        \ defaults to the user's primary portfolio |\n\nParsing chain and async response\
        \ semantics are identical to\n`/portfolio/upload` — see that endpoint's description\
        \ for the tier\ntable (GPT-5 Vision → casparser → Docling)."
      operationId: upload_portfolio_raw_api_portfolio_upload_raw_post
      responses:
        '200':
          description: Same response shape as `/portfolio/upload` — async `task_id`
            for PDFs, synchronous holdings list for CSV/Excel.
          content:
            application/json:
              schema: {}
        '400':
          description: Empty body, unsupported format, or wrong CAS PDF password.
        '413':
          description: Body exceeds the maximum upload size.
  /api/portfolio/upload-status/{task_id}:
    get:
      tags:
      - Portfolio Upload
      summary: Poll the status of an async CAS PDF parse task
      description: 'Poll the status of an async CAS PDF parse task started by

        `/portfolio/upload` or `/portfolio/upload-raw`.


        Typical PDF parsing takes 35-70 s when GPT-5 Vision is the active

        parser (`OPENAI_API_KEY` configured), under 1 s when the casparser-lib

        fallback handles a text-based PDF, or 30-60 s for the Docling

        fallback. Poll every ~2-5 s; stop when `status` leaves `processing`.'
      operationId: get_upload_status_api_portfolio_upload_status__task_id__get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Current task state. `status` ∈ {`processing`, `completed`,
            `failed`}.
          content:
            application/json:
              schema: {}
              examples:
                processing:
                  value:
                    task_id: task_a1b2c3d4e5f6
                    status: processing
                    message: Parsing CAS PDF with AI...
                    count: 0
                    holdings: []
                completed:
                  value:
                    task_id: task_a1b2c3d4e5f6
                    status: completed
                    message: 23 holdings imported from CAS PDF
                    count: 23
                    holdings:
                    - ticker: INE040A01034
                      quantity: 50
                      asset_type: equity
                    parser_source: openai_gpt5
                failed:
                  value:
                    task_id: task_a1b2c3d4e5f6
                    status: failed
                    message: Wrong CAS PDF password. Enter your PAN in UPPERCASE.
                    count: 0
                    holdings: []
        '404':
          description: No task with this ID belongs to the calling user.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/portfolio/upload-latest-task:
    get:
      tags:
      - Portfolio Upload
      summary: Return the most recent CAS upload task for the caller
      description: 'Return the most recent CAS upload task for the authenticated user

        (sorted by `created_at` descending). Useful for the frontend to

        resume polling after a page reload without persisting the task_id

        client-side.'
      operationId: get_latest_upload_task_api_portfolio_upload_latest_task_get
      responses:
        '200':
          description: Same shape as `/portfolio/upload-status/{task_id}`.
          content:
            application/json:
              schema: {}
        '404':
          description: The caller has never uploaded a CAS PDF.
  /api/portfolio-builder/generate:
    post:
      tags:
      - portfolio-builder
      summary: Generate Portfolio
      description: "Generate a proposed portfolio for the current user.\n\nReads risk\
        \ profile + active goals from the user's profile, runs\ntarget_allocator +\
        \ goal_fund_picker, returns full builder payload.\n\nv4 additions (C.8):\n\
        \  monthly_surplus_rs — investable surplus beyond the primary SIP\n  horizon_years\
        \      — planning horizon in years\n  risk_bucket        — override risk classification\
        \ (\"conservative\"|\"moderate\"|\"aggressive\")\n\nScreens served: 14_portfolio_builder.svg"
      operationId: generate_portfolio_api_portfolio_builder_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuilderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/portfolio-builder/simulate:
    post:
      tags:
      - portfolio-builder
      summary: Simulate Builder Portfolio
      description: "Run the 4-scenario matrix (base / bull / bear / stress) on the\n\
        proposed portfolio.\n\nReturns:\n    {\n      \"scenarios\": {base: {return_pct,\
        \ corpus_rs, success_pct}, ...},\n      \"monte_carlo\": {p10, p50, p90, success_pct},\n\
        \      \"allocation_used\": {...},\n      \"blended_return_pct\": 11.4,\n\
        \      \"blended_vol_pct\": 14.2\n    }"
      operationId: simulate_builder_portfolio_api_portfolio_builder_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateBuilderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/portfolio-builder/export.pdf:
    post:
