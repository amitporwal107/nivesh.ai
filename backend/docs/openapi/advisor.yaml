  /api/advisor/rebalance:
    get:
      tags: [advisor]
      operationId: advisor_rebalance
      summary: Clients drifted from target allocation
      description: |
        Returns clients whose current allocation has drifted more than `gap_pp`
        percentage points from their target allocation (equity/debt/alternate).

        Use to identify clients who need a rebalancing call before year-end or
        after a large market move.
      parameters:
        - name: gap_pp
          in: query
          schema:
            type: number
            default: 10.0
          description: Minimum drift threshold in percentage points.
          example: 10.0
      responses:
        "200":
          description: Clients needing rebalancing
          content:
            application/json:
              example:
                threshold_pp: 10.0
                clients_needing_rebalance: 3
                clients:
                  - profile_id: prof_j1k2l3
                    name: Amit Verma
                    target_equity_pct: 60
                    current_equity_pct: 78
                    drift_pp: 18.0
                    aum_rs: 1540000
                    rebalance_action: Reduce equity by ~₹2.77L (18% drift — overweight)
                  - profile_id: prof_d4e5f6
                    name: Rohan Gupta
                    target_equity_pct: 70
                    current_equity_pct: 58
