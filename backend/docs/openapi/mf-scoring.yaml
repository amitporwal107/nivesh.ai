openapi: 3.1.0
info:
  title: MF Scoring
  version: 1.0.0
paths:
  /api/mfd/workspace:
    get:
      tags:
      - mfd
      summary: Get Workspace
      operationId: get_workspace_api_mfd_workspace_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    patch:
      tags:
      - mfd
      summary: Update Workspace Mode
      operationId: update_workspace_mode_api_mfd_workspace_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceModeUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles:
    get:
      tags:
      - mfd
      summary: List Profiles
      description: 'Returns every profile in the user''s workspace, each with a live

        priority score so the UI can sort/filter client-side.'
      operationId: list_profiles_api_mfd_profiles_get
      parameters:
      - name: include_self
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Self
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - mfd
      summary: Create Profile
      operationId: create_profile_api_mfd_profiles_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}:
    get:
      tags:
      - mfd
      summary: Get Profile
      operationId: get_profile_api_mfd_profiles__profile_id__get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - mfd
      summary: Update Profile
      operationId: update_profile_api_mfd_profiles__profile_id__patch
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - mfd
      summary: Delete Profile
      operationId: delete_profile_api_mfd_profiles__profile_id__delete
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/activate:
    post:
      tags:
      - mfd
      summary: Activate Profile
      operationId: activate_profile_api_mfd_profiles__profile_id__activate_post
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/deactivate:
    post:
      tags:
      - mfd
      summary: Deactivate Profile
      description: 'Clear `active_profile_id` on the session — returns the MFD to
        their

        own SELF profile view. Useful for "Back to client list".'
      operationId: deactivate_profile_api_mfd_profiles_deactivate_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/mfd/profiles/{profile_id}/notes:
    get:
      tags:
      - mfd
      summary: Get Client Notes
      operationId: get_client_notes_api_mfd_profiles__profile_id__notes_get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - mfd
      summary: Put Client Notes
      operationId: put_client_notes_api_mfd_profiles__profile_id__notes_put
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientNotesPayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/tax-summary:
    get:
      tags:
      - mfd
      summary: Tax Summary
      description: "Unrealized gain/loss scan + tax-harvesting opportunities.\n\n\
        Implements the post-Jul-2024 / post-Apr-2023 Indian MF tax regime:\n\n  •\
        \ Equity (≥65% equity exposure): STCG <12m @ 20%, LTCG ≥12m @ 12.5%\n    on\
        \ gains beyond ₹1.25 L per FY (aggregated across all equity\n    positions).\
        \ No indexation.\n  • Debt funds (post-Apr-2023 lots, \"specified mutual funds\"\
        ): ALL\n    gains taxed at investor's slab rate (default 30% — UI overridable).\n\
        \  • Hybrid funds: ≥65% equity → equity rules; <65% → debt rules.\n    Equity\
        \ exposure is read from holding metadata (`equity_exposure_pct`)\n    when\
        \ available; otherwise classified by `asset_type`.\n  • Direct equities &\
        \ ETFs (treated as equity for tax purposes).\n\nReturns harvest opportunities\
        \ grouped into:\n  • `harvest_picks` — LTCG positions to realize THIS FY to\
        \ use the\n    ₹1.25 L exemption (Rule 1).\n  • `loss_picks` — losers to book\
        \ to offset gains (Rule 4).\n  • `near_lt_picks` — STCG positions within 30\
        \ days of crossing\n    the 12-month threshold (Rule 10 — timing arbitrage).\n\
        \nCess + 4% surcharge is added on top of the indicative tax. STT and\nuser\
        \ slab rate are configurable via query params."
      operationId: tax_summary_api_mfd_profiles__profile_id__tax_summary_get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/portfolio-trend:
    get:
      tags:
      - mfd
      summary: Portfolio Trend
      description: 'Invested ₹ vs Current ₹ (live prices) for a profile''s shadow
        user.

        Also returns recent purchases: first from holdings with buy_date, then

        from CAS transaction history, then from snapshot-delta (new holdings

        that appeared between the last two CAS snapshots).'
      operationId: portfolio_trend_api_mfd_profiles__profile_id__portfolio_trend_get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/needs-attention:
    get:
      tags:
      - mfd-v4
      summary: Profile Needs Attention
      description: 'Per-client items that need advisor action.


        Screen 16 Client 360.


        Joins plan_actions + scoring signals for the client. Returns items

        of severity HIGH — these drive the Client 360 "needs attention" list.'
      operationId: profile_needs_attention_api_mfd_profiles__profile_id__needs_attention_get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Profile Needs Attention Api Mfd Profiles  Profile
                  Id  Needs Attention Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/call-log:
    post:
      tags:
      - mfd-v4
      summary: Log Call
      description: 'Log a call with a client.


        Screen 16 Client 360 — "Log a call" CTA.


        Body: { occurred_at, duration_min, channel, outcome, note }'
      operationId: log_call_api_mfd_profiles__profile_id__call_log_post
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Log Call Api Mfd Profiles  Profile Id  Call Log Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/sip-nudge:
    post:
      tags:
      - mfd-v4
      summary: Sip Nudge
      description: "Queue a message nudge to a client about their SIP.\n\nScreen 17\
        \ SIP Board — \"Message\" CTA.\n\nBody: { sip_id, template, channel }\nTemplates:\
        \ BOUNCE_INSUFFICIENT_BALANCE | BOUNCE_MANDATE_LIMIT |\n           BOUNCE_ACCOUNT_CLOSED\
        \ | MANDATE_EXPIRY | STEPUP_DUE"
      operationId: sip_nudge_api_mfd_profiles__profile_id__sip_nudge_post
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Sip Nudge Api Mfd Profiles  Profile Id  Sip Nudge
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/review-pack/generate:
    post:
      tags:
      - mfd-v4
      summary: Generate Review Pack
      description: "Queue a review-pack generation task for a client.\n\nScreen 16\
        \ Client 360 — \"Prepare Review Pack\" CTA.\n\nThis is an async scaffold —\
        \ actual PDF/XLSX generation is handled by a\nbackground worker; this endpoint\
        \ only enqueues the task.\n\nBody (all optional):\n  format   — \"pdf\" (default)\
        \ | \"xlsx\"\n  sections — list subset of [\"portfolio\",\"goals\",\"risk\"\
        ,\"performance\"]\n             (default: all four)\n\nReturns: { task_id,\
        \ status: \"queued\", poll_url }"
      operationId: generate_review_pack_api_mfd_profiles__profile_id__review_pack_generate_post
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPackRequest'
              default:
                format: pdf
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Generate Review Pack Api Mfd Profiles  Profile Id  Review
                  Pack Generate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/review-pack/{task_id}:
    get:
      tags:
      - mfd-v4
      summary: Get Review Pack Status
      description: 'Poll the status of a queued review-pack task.


        Screen 16 Client 360 — polling after "Prepare Review Pack".


        Returns the task document (status, result_url, created_at, …).

        404 if not found or does not belong to this profile.'
      operationId: get_review_pack_status_api_mfd_profiles__profile_id__review_pack__task_id__get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Review Pack Status Api Mfd Profiles  Profile Id  Review
                  Pack  Task Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/casparser/token:
    post:
      tags:
      - casparser
      summary: Issue Token
      operationId: issue_token_api_casparser_token_post
      parameters:
      - name: X-User-External-Id
        in: header
        required: true
        schema:
          type: string
          title: X-User-External-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mfd/profiles/{profile_id}/holdings/export:
    get:
      summary: Export Profile Holdings
      description: 'Advisor-scoped export. Workspace ownership is verified:

        1. Resolve the profile → its workspace.

        2. Confirm the workspace is owned by the logged-in user.

        3. Stream the profile''s shadow-user holdings.'
      operationId: export_profile_holdings_api_mfd_profiles__profile_id__holdings_export_get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: csv
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - mf-scoring
  /api/casparser/access-token:
    post:
      summary: Casparser Access Token
      description: Mint a short-lived CAS Parser access token for the frontend widget.
      operationId: casparser_access_token_api_casparser_access_token_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - mf-scoring
components:
  schemas:
    ActionFeedback:
      properties:
        useful:
          type: boolean
          title: Useful
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      type: object
      required:
      - useful
      title: ActionFeedback
      description: Request body for action feedback.
    ActionRequest:
      properties:
        action:
          type: string
          title: Action
        target:
          type: string
          title: Target
        environment:
          type: string
          title: Environment
          default: prod
      type: object
      required:
      - action
      - target
      title: ActionRequest
    ActionStatusUpdate:
      properties:
        status:
          type: string
          title: Status
        completion_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Completion Note
      type: object
      required:
      - status
      title: ActionStatusUpdate
      description: Request body for updating action status.
    AgentOneShotRequest:
      properties:
        agent_id:
          type: string
          title: Agent Id
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        system_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: System Prompt
      type: object
      required:
      - agent_id
      - message
      title: AgentOneShotRequest
    AllocationItem:
      properties:
        asset_class:
          type: string
          title: Asset Class
        value:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Value
        pct:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Pct
      additionalProperties: false
      type: object
      required:
      - asset_class
      - value
      - pct
      title: AllocationItem
    ApplyRequest:
      properties:
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
        actions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Actions
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - actions
      - payload
      title: ApplyRequest
    AskRequest:
      properties:
        model:
          type: string
          title: Model
          default: gpt-4o
        question:
          type: string
          maxLength: 800
          minLength: 2
          title: Question
        history:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: History
      type: object
      required:
      - question
      title: AskRequest
    AssetType:
      type: string
      enum:
      - equity
      - mutual_fund
      - etf
      - bond
      - gold
      - fd
      - other
      title: AssetType
    BackfillRequest:
      properties:
        days:
          type: integer
          maximum: 730.0
          minimum: 1.0
          title: Days
          description: Days of history to pull (capped at 2 years)
          default: 60
      type: object
      title: BackfillRequest
    BacktestRequest:
      properties:
        from_date:
          type: string
          title: From Date
        to_date:
          type: string
          title: To Date
        starting_capital:
          type: number
          title: Starting Capital
          default: 1000000.0
        max_positions:
          type: integer
          title: Max Positions
          default: 10
      type: object
      required:
      - from_date
      - to_date
      title: BacktestRequest
    BandsPayload:
      properties:
        bands:
          additionalProperties:
            additionalProperties:
              additionalProperties:
                type: number
              type: object
            type: object
          type: object
          title: Bands
      type: object
      required:
      - bands
      title: BandsPayload
    BasketRequest:
      properties:
        capital_rs:
          type: number
          exclusiveMinimum: 0.0
          title: Capital Rs
          description: Total capital to deploy in INR (e.g. 1000000 for ₹10L)
        max_positions:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Max Positions
          default: 8
        min_conviction:
          type: string
          title: Min Conviction
          default: HIGH_CONVICTION
      type: object
      required:
      - capital_rs
      title: BasketRequest
    Body_admin_upload_scan_api_positional_scans_upload_post:
      properties:
        scan_name:
          type: string
          title: Scan Name
        scan_date:
          type: string
          title: Scan Date
        csv_file:
          type: string
          format: binary
          title: Csv File
      type: object
      required:
      - scan_name
      - scan_date
      - csv_file
      title: Body_admin_upload_scan_api_positional_scans_upload_post
    Body_client_upload_pdf_api_public_cas_invite__token__upload_pdf_post:
      properties:
        file:
          type: string
          format: binary
          title: File
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
      type: object
      required:
      - file
      title: Body_client_upload_pdf_api_public_cas_invite__token__upload_pdf_post
    Body_upload_cas_pdf_api_onboarding_upload_cas_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_cas_pdf_api_onboarding_upload_cas_post
    Body_upload_csv_legacy_api_portfolio_upload_csv_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_csv_legacy_api_portfolio_upload_csv_post
    Body_upload_portfolio_api_portfolio_upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_portfolio_api_portfolio_upload_post
    BriefRequest:
      properties:
        model:
          type: string
          title: Model
          default: gpt-4o
      type: object
      title: BriefRequest
    BuilderRequest:
      properties:
        monthly_sip_rs:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Monthly Sip Rs
        lumpsum_rs:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Lumpsum Rs
        monthly_surplus_rs:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Monthly Surplus Rs
        horizon_years:
          anyOf:
          - type: number
            maximum: 100.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Horizon Years
        risk_bucket:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Bucket
      type: object
      title: BuilderRequest
    ChatMessageInput:
      properties:
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      type: object
      required:
      - message
      title: ChatMessageInput
    CitationOut:
      properties:
        feed_id:
          type: string
          title: Feed Id
        title:
          type: string
          title: Title
        excerpt:
          type: string
          title: Excerpt
        score:
          type: number
          title: Score
        as_of:
          type: string
          title: As Of
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - feed_id
      - title
      - excerpt
      - score
      - as_of
      - url
      - metadata
      title: CitationOut
