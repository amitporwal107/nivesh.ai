openapi: 3.1.0
info:
  title: Intelligence Layer
  version: 1.0.0
paths:
  /api/copilot/models:
    get:
      tags:
      - copilot
      summary: List Models
      description: 'Surfaces the 3 model options + default to the UI so the MFD can

        choose cost vs. quality per-call.'
      operationId: list_models_api_copilot_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/copilot/explain:
    post:
      tags:
      - copilot
      summary: Explain
      operationId: explain_api_copilot_explain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/client-message:
    post:
      tags:
      - copilot
      summary: Client Message
      operationId: client_message_api_copilot_client_message_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientMessageRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/ask:
    post:
      tags:
      - copilot
      summary: Ask
      description: 'Free-form Q&A with the client''s full portfolio context. Not cached

        (questions are unique by definition). History is optional — if

        provided, included inline in the user prompt so the LLM sees continuity

        without us needing a server-side session store in Pass 1.'
      operationId: ask_api_copilot_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/brief:
    post:
      tags:
      - copilot
      summary: Brief
      description: 'One-shot CIO brief — returns {summary, risk, tax, performance,
        priority}

        in a single LLM call. Cached 24h. Use this for the Client 360 panel

        instead of calling /explain four times.'
      operationId: brief_api_copilot_brief_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/macro/today:
    get:
      tags:
      - macro
      summary: Macro Today
      description: 'Latest macro snapshot for the Copilot bar.


        Auth: any logged-in user. The macro view is global (not per-user)

        so we don''t gate by workspace.


        Never 500s — any internal failure (missing tables, missing columns,

        PG down) returns the `_uninitialised` payload with `_reason` set so

        the operator can see what''s broken in the UI without checking logs.'
      operationId: macro_today_api_macro_today_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/macro/refresh:
    post:
      tags:
      - macro
      summary: Macro Refresh
      description: 'Manual trigger: ingest → features → regime for one day.


        Used by the admin / debug surface. Production run is the scheduler at

        18:30 IST in mf_scheduler.py.'
      operationId: macro_refresh_api_macro_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/macro/backfill:
    post:
      tags:
      - macro
      summary: Macro Backfill
      description: 'One-shot: backfill `macro_daily` so the feature engine has 50DMA

        history. Run once after the migration lands (or click "Backfill" in

        the MacroBar empty-state CTA).


        For each prior trading day in the window we also recompute features +

        regime so the time series is queryable end-to-end. Slow but correct.


        Never 500s — wraps the whole flow in try/except and surfaces the

        actual failure as JSON so the empty-state UI can show it inline.'
      operationId: macro_backfill_api_macro_backfill_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/macro/sector:
    get:
      tags:
      - macro
      summary: Macro Sector Heatmap
      description: 'Per-sector macro tilt for the latest day. Returns rows sorted
        by

        tilt descending — UI renders as a heatmap or sorted strip.'
      operationId: macro_sector_heatmap_api_macro_sector_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/macro/changes:
    get:
      tags:
      - macro
      summary: Macro Changes
      description: "Diff today's macro_state + sector_macro_scores vs the previous\n\
        trading day. Drives the \"What changed since yesterday\" strip on the\nMarket\
        \ Dashboard.\n\nReturns a structured diff so the UI doesn't have to parse\
        \ prose:\n  {\n    \"today_date\": \"2026-05-03\",\n    \"previous_date\"\
        : \"2026-05-02\",\n    \"regime_changes\": [\n      {\"field\": \"risk\",\
        \ \"from\": \"MEDIUM\", \"to\": \"HIGH\"},\n      {\"field\": \"market\",\
        \ \"from\": \"BULL\", \"to\": \"NEUTRAL\"},\n    ],\n    \"sector_changes\"\
        : [\n      {\"sector\": \"IT\", \"from\": 0.4, \"to\": 1.2, \"delta\": 0.8,\
        \ \"tier_change\": \"BUY → STRONG BUY\"},\n      ...\n    ],\n    \"headline\"\
        : \"USD ↑ → IT upgraded from BUY to STRONG BUY\"\n  }"
      operationId: macro_changes_api_macro_changes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/macro/aligned-picks:
    get:
      tags:
      - macro
      summary: Macro Aligned Picks
      description: "Surface positional candidates whose sector aligns with today's\n\
        macro tailwinds. Used as a \"Coming opportunities\" preview on the\nMarket\
        \ Dashboard before today's actual signals fire.\n\nLogic:\n  1. Take sectors\
        \ with macro_score ≥ 0.8 (BUY tier or stronger).\n  2. Find positional_signals\
        \ (or stock_technical_features if no\n     signal yet) whose sector_key matches.\n\
        \  3. Group by sector, return up to N candidates per sector.\n\nWhen no `positional_signals`\
        \ exist yet for today, falls back to\n`stock_technical_features` so the user\
        \ still gets a watchlist preview."
      operationId: macro_aligned_picks_api_macro_aligned_picks_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 5
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stock/{symbol}/why:
    get:
      tags:
      - macro
      summary: Stock Why
      description: "Explainability payload for a single stock, combining:\n\n  • The\
        \ macro state right now\n  • The stock's sector → macro tilt\n  • The position-size\
        \ factor that the trade_planner would use\n\nReturns a self-contained JSON\
        \ the UI can render as a \"why this score\"\npanel without needing to call\
        \ /macro/today separately."
      operationId: stock_why_api_stock__symbol__why_get
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feeds:
    get:
      tags:
      - feeds
      summary: List Feeds
      description: 'List enabled feeds the user can subscribe to.


        Tier gating (''pro''/''institutional'') is filtered server-side based on

        the user''s entitlement; the placeholder below treats every user as

        ''free'' until the entitlements module lands.'
      operationId: list_feeds_api_feeds_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeedOut'
                type: array
                title: Response List Feeds Api Feeds Get
  /api/feeds/subscriptions:
    get:
      tags:
      - feeds
      summary: List Subscriptions
      operationId: list_subscriptions_api_feeds_subscriptions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionOut'
                type: array
                title: Response List Subscriptions Api Feeds Subscriptions Get
    post:
      tags:
      - feeds
      summary: Subscribe
      operationId: subscribe_api_feeds_subscriptions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feeds/subscriptions/{feed_id}:
    delete:
      tags:
      - feeds
      summary: Unsubscribe
      operationId: unsubscribe_api_feeds_subscriptions__feed_id__delete
      parameters:
      - name: feed_id
        in: path
        required: true
        schema:
          type: string
          title: Feed Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feeds/subscriptions/{feed_id}/pause:
    post:
      tags:
      - feeds
      summary: Pause
      operationId: pause_api_feeds_subscriptions__feed_id__pause_post
      parameters:
      - name: feed_id
        in: path
        required: true
        schema:
          type: string
          title: Feed Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feeds/subscriptions/{feed_id}/resume:
    post:
      tags:
      - feeds
      summary: Resume
      operationId: resume_api_feeds_subscriptions__feed_id__resume_post
      parameters:
      - name: feed_id
        in: path
        required: true
        schema:
          type: string
          title: Feed Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feeds/search:
    post:
      tags:
      - feeds
      summary: Search Feeds
      operationId: search_feeds_api_feeds_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CitationOut'
                type: array
                title: Response Search Feeds Api Feeds Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/market/events:
    get:
      tags:
      - market_events
      summary: Market Events Today
      description: 'Today''s corporate events with impact scores, AI signals, and
        market confirmation.


        Returns all events from event_calendar for the given date (default: today),

        joined with any available AI signals and scoring data from

        corporate_event_signals. Events without signals are included as

        "pending" so the UI can show the full calendar.


        Cached for 60 s (shared across all users).'
      operationId: market_events_today_api_market_events_get
      parameters:
      - name: date_str
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date Str
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/market/events/tomorrow:
    get:
      tags:
      - market_events
      summary: Market Events Tomorrow
      description: 'D-1 pre-event briefings for tomorrow''s scheduled results.


        Returns events from event_calendar for tomorrow, joined with

        d1_prep signals generated by the evening D-1 preparation service.


        Cached for 60 s (shared across all users).'
      operationId: market_events_tomorrow_api_market_events_tomorrow_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/market/signals:
    get:
      tags:
      - market_events
      summary: Market Signals Feed
      description: "High-confidence AI signal feed for the last N days.\n\nFilters:\n\
        \  days            — look-back window (default 3, max 14)\n  min_confidence\
        \  — minimum AI confidence % (default 60)\n  sentiment       — filter by sentiment\
        \ string (e.g. 'bullish')\n  event_type      — filter by event type (e.g.\
        \ 'order_win')\n\nReturns signals sorted by impact_score DESC, then confidence\
        \ DESC."
      operationId: market_signals_feed_api_market_signals_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 3
          title: Days
      - name: min_confidence
        in: query
        required: false
        schema:
          type: number
          default: 60.0
          title: Min Confidence
      - name: sentiment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentiment
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/intelligence/portfolio/360:
    get:
      tags:
      - intelligence-v4
      summary: Client 360
      description: "6-domain client summary for the advisor.\n\nScreen 16 Client 360.\n\
        \nRequires an active impersonation context\n(POST /api/mfd/profiles/{id}/activate\
        \ sets active_profile_id cookie).\n\nComposes:\n  1. Health score (v3-portfolio)\n\
        \  2. Domain scores (concentration / diversification / risk / performance\
        \ / goals / tax)\n  3. Needs-attention items (priority-1 plan actions)\n\n\
        ≤3 DB reads: (1) plan_doc, (2) user_profiles, (3) signal cache."
      operationId: client_360_api_intelligence_portfolio_360_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Client 360 Api Intelligence Portfolio 360 Get
  /api/copilot/agents:
    get:
      tags:
      - copilot-agents
      summary: List Agents
      description: Return all 7 agents (including `auto`) so the picker UI can render.
      operationId: list_agents_api_copilot_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/copilot/models/picker:
    get:
      tags:
      - copilot-agents
      summary: List Models
      description: 'Return the 3 supported LLM backends. Default = gpt-4o.


        Note: lives at /models/picker (not /models) to avoid collision with

        the legacy /api/copilot/models endpoint in routes/copilot.py which

        exposes a different shape (key/tier/price_hint) for the

        NiveshCopilotDrawer.'
      operationId: list_models_api_copilot_models_picker_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/copilot/agents/route:
    post:
      tags:
      - copilot-agents
      summary: Route Intent
      description: 'Deterministic intent router. Frontend calls this BEFORE sending
        a

        chat message so it can render the matching agent ribbon immediately

        (and show a "Handed off" divider if the routed agent differs from the

        previous turn''s agent).'
      operationId: route_intent_api_copilot_agents_route_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteIntentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/agents/oneshot:
    post:
      tags:
      - copilot-agents
      summary: Agent Oneshot
      description: 'Single-turn agent call, used by widget-producing endpoints

        (e.g. compose a rationale for a Fund card without going through the

        full streaming chat loop). NOT used for the primary chat stream —

        that path stays on /api/chat/stream.


        Returns: {"text": "<assistant prose>"}.'
      operationId: agent_oneshot_api_copilot_agents_oneshot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentOneShotRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/feedback:
    post:
      tags:
      - copilot-agents
      summary: Message Feedback
      description: 'Record a thumbs-up / thumbs-down on an assistant message. The
        chat UI

        fires this fire-and-forget when the user clicks the toolbar under a

        bubble. We persist to `copilot_feedback` for offline review — no

        business logic depends on the response shape beyond {ok: true}.'
      operationId: message_feedback_api_copilot_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageFeedbackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/widgets/fund_card:
    post:
      tags:
      - copilot-widgets
      summary: Fund Card
      description: 'Produce a Fund Card widget envelope for the given scheme.


        Reads from `mf_master` for static facts (category, AUM, expense),

        enriches with NIDP DaaS scorecard (composite_score, quality_label,

        peer-group rank) and lifecycle events (manager changes, TER hikes, mergers)

        when available. Falls back to heuristic scoring when NIDP has no data.'
      operationId: fund_card_api_copilot_widgets_fund_card_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundCardRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/widgets/market_brief:
    post:
      tags:
      - copilot-widgets
      summary: Market Brief
      description: 'Today''s market brief widget. Reads the NIDP DaaS

        `/v1/intelligence/snapshots/market` endpoint (already deployed)

        and overlays the user''s portfolio impact (Phase C will plug

        the impact in; Phase B just shows market-side data).'
      operationId: market_brief_api_copilot_widgets_market_brief_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/_LayoutOnlyRequest'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/widgets/compare_funds:
    post:
      tags:
      - copilot-widgets
      summary: Compare Funds
      description: Build a Compare-Table widget for 2–4 schemes.
      operationId: compare_funds_api_copilot_widgets_compare_funds_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/widgets/sip_plan:
    post:
      tags:
      - copilot-widgets
      summary: Sip Plan
      description: SIP allocation envelope backed by the sip.py projection engine.
      operationId: sip_plan_api_copilot_widgets_sip_plan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SipPlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/widgets/rebalance_plan:
    post:
      tags:
      - copilot-widgets
      summary: Rebalance Plan
      description: 'Build a rebalance-plan widget from the user''s current holdings.


        Reads `holdings` collection for the authenticated user, computes

        current asset-class weights, and generates BUY/SELL/SWITCH actions

        toward a risk-appropriate target allocation.  Phase C will wire the

        Advisor agent LLM for the rationale text; Phase B uses heuristics.'
      operationId: rebalance_plan_api_copilot_widgets_rebalance_plan_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/_LayoutOnlyRequest'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/widgets/tax_harvest:
    post:
      tags:
      - copilot-widgets
      summary: Tax Harvest
      description: 'LTCG harvest candidates for the authenticated user.


        Reads `holdings` (or `portfolio_holdings`) and `capital_gains_summary`

        collections.  Candidates = LTCG eligible (held > 365 days) with gains

        under the ₹1L exemption limit still available.'
      operationId: tax_harvest_api_copilot_widgets_tax_harvest_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/_LayoutOnlyRequest'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/copilot/widgets/stress_test:
    post:
      tags:
      - copilot-widgets
      summary: Stress Test
