components:
  schemas:
    ActionFeedback:
      properties:
        useful:
          type: boolean
          title: Useful
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      type: object
      required:
      - useful
      title: ActionFeedback
      description: Request body for action feedback.
    ActionRequest:
      properties:
        action:
          type: string
          title: Action
        target:
          type: string
          title: Target
        environment:
          type: string
          title: Environment
          default: prod
      type: object
      required:
      - action
      - target
      title: ActionRequest
    ActionStatusUpdate:
      properties:
        status:
          type: string
          title: Status
        completion_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Completion Note
      type: object
      required:
      - status
      title: ActionStatusUpdate
      description: Request body for updating action status.
    AgentOneShotRequest:
      properties:
        agent_id:
          type: string
          title: Agent Id
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        system_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: System Prompt
      type: object
      required:
      - agent_id
      - message
      title: AgentOneShotRequest
    AllocationItem:
      properties:
        asset_class:
          type: string
          title: Asset Class
        value:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Value
        pct:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Pct
      additionalProperties: false
      type: object
      required:
      - asset_class
      - value
      - pct
      title: AllocationItem
    ApplyRequest:
      properties:
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
        actions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Actions
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - actions
      - payload
      title: ApplyRequest
    AskRequest:
      properties:
        model:
          type: string
          title: Model
          default: gpt-4o
        question:
          type: string
          maxLength: 800
          minLength: 2
          title: Question
        history:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: History
      type: object
      required:
      - question
      title: AskRequest
    AssetType:
      type: string
      enum:
      - equity
      - mutual_fund
      - etf
      - bond
      - gold
      - fd
      - other
      title: AssetType
    BackfillRequest:
      properties:
        days:
          type: integer
          maximum: 730.0
          minimum: 1.0
