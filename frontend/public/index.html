<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="AI-powered wealth management for Indian investors" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!-- V3 typography: Fraunces (display) + Geist (body) + Geist Mono (eyebrows). Only loaded once, used by .v3 scope. -->
        <link
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
          rel="stylesheet"
        />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>nivesh.ai — AI-Powered Wealth Management</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>
        // Path-prefix guard. Each bundle is built with PUBLIC_URL=/v2 or =/v3,
        // and React Router uses the matching basename. If a user lands on a
        // path that doesn't start with this bundle's base, redirect them to
        // the right base so the SPA always mounts cleanly.
        //
        // The V2 and V3 bundles are isolated, so a request that nginx routes
        // to one of them only ever needs to handle its own prefix here.
        (function () {
          var base = "%PUBLIC_URL%" || "/v2";
          var p = window.location.pathname;
          // Already inside this bundle's prefix, or hitting the API — leave it alone.
          if (p.indexOf(base) === 0 || p.indexOf("/api") === 0) return;
          // V2 bundle should never redirect a /v3/* path (and vice versa) —
          // that traffic belongs to the other SPA, served by nginx separately.
          if (base === "/v2" && p.indexOf("/v3") === 0) return;
          if (base === "/v3" && p.indexOf("/v2") === 0) return;
          var target = base + (p === "/" ? "/" : p) + window.location.search + window.location.hash;
          window.location.replace(target);
        })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
