<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="AI-powered wealth management for Indian investors" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!-- V3 typography: Fraunces (display) + Geist (body) + Geist Mono (eyebrows). Only loaded once, used by .v3 scope. -->
        <link
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
          rel="stylesheet"
        />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>nivesh.ai — AI-Powered Wealth Management</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>
        // Path-prefix guard for dev/preview environments where nginx isn't
        // doing the "/" -> "/v2/" redirect.
        //
        // Allowed roots — pass through without rewriting:
        //   /v2/*  V2 React SPA (basename="/v2")
        //   /v3/*  V3 React SPA (basename="/v3" — see frontend/src/App.js
        //          detectAppMode; the SPA picks the right basename at boot)
        //   /v4/*  V4 React SPA (basename="/v4" — same detectAppMode branch)
        //   /api/* FastAPI proxy
        //
        // Everything else gets prefixed with /v2/ so old bookmarks and the
        // bare root still land on the V2 home.
        (function () {
          var p = window.location.pathname;
          if (p.indexOf("/v2") !== 0 && p.indexOf("/v3") !== 0 && p.indexOf("/v4") !== 0 && p.indexOf("/api") !== 0) {
            var target = "/v2" + (p === "/" ? "/" : p) + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
