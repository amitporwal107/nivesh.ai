name: Build & publish Android app [prod]

# Builds the PRODUCTION v5 Android app with Capacitor and publishes the signed
# APK to https://niveshcopilot.com/downloads/nivesh-v5-prod-release.apk — a file on
# the CloudPe prod VM (/opt/nivesh/downloads), served by the app's edge nginx. The AAB
# (Play Store upload format) is attached as a workflow artifact only — it is never
# served publicly.
#
# Until 2026-11-01 this published to data.niveshcopilot.com/downloads via the GCP
# nidp-stack-vm, which no longer exists (and both runs ever made, in June, failed).
#
# Manual-only: a prod app release is a deliberate act, not something every push
# should trigger. Run from the Actions tab → "Build & publish Android app
# [prod]" → Run workflow, bumping version_code each time.
#
# Required GitHub secrets (see frontend-v5/docs/android-release.md for setup):
#   ANDROID_KEYSTORE_BASE64        base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD      keystore store password
#   ANDROID_KEY_ALIAS              signing key alias
#   ANDROID_KEY_PASSWORD           signing key password (optional; defaults to store pw)
#   PROD_GOOGLE_SERVER_CLIENT_ID   prod web OAuth client id — MUST equal the GOOGLE_CLIENT_ID the
#                                  prod backend serves at /api/auth/google-client-id, or native
#                                  Google sign-in fails with "Token audience mismatch"
#   PROD_VM_HOST                   IP of the CloudPe prod VM
#   PROD_SSH_USER                  CI user on the VM (ci-deploy; owns /opt/nivesh/downloads)
#   PROD_SSH_KEY                   Ed25519 private key for that user

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'User-facing version (e.g. 1.0.3)'
        type: string
        default: '1.0'
      version_code:
        description: 'Integer build number — must increase every release'
        type: string
        default: '1'
      publish:
        description: 'Publish the APK to niveshcopilot.com/downloads (prod VM)'
        type: boolean
        default: true

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-v5/package-lock.json

      # The action's default `packages` ("tools platform-tools") fails on current runners
      # (cmdline-tools 16: "Failed to find package 'tools'") — the 2026-11-01 prod run died
      # right here. Same explicit list the staging APK workflow uses; semicolon entries are
      # single tokens, the action splits on spaces.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install web dependencies
        run: npm ci

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot sign the release." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore decoded to $RUNNER_TEMP/release.jks ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)"

      - name: Build production Android app (signed APK + AAB)
        env:
          CAP_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.PROD_GOOGLE_SERVER_CLIENT_ID }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: bash scripts/build-android-release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nivesh-v5-prod-${{ inputs.version_name }}-${{ inputs.version_code }}
          if-no-files-found: error
          path: |
            frontend-v5/nivesh-v5-prod-release.apk
            frontend-v5/nivesh-v5-prod-release.aab

      # ── Publish the APK to the prod VM ──────────────────────────────────────
      # Stream the APK over the ssh exec channel (`ssh … 'cat > file'`) instead of
      # scp/sftp (appleboy/scp-action failed the June runs with "error copy file to
      # dest"). The CI user owns /opt/nivesh/downloads, so no sudo is needed (its only
      # sudo right is ci-deploy.sh). The file is written under a .part name and renamed
      # so nginx never serves a half-written APK, and an end-to-end sha256 check guards
      # against a truncated transfer.
      - name: Publish APK to the prod VM
        if: ${{ inputs.publish }}
        env:
          SSH_KEY:  ${{ secrets.PROD_SSH_KEY }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_HOST: ${{ secrets.PROD_VM_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          APK="nivesh-v5-prod-release.apk"   # cwd is frontend-v5 (job default)
          DEST=/opt/nivesh/downloads
          SSH="ssh -i $HOME/.ssh/id_deploy -p 22 -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          echo "▸ streaming $APK ($(stat -c%s "$APK") bytes) over ssh → $DEST/$APK"
          $SSH "$SSH_USER@$SSH_HOST" "cat > $DEST/.$APK.part" < "$APK"

          REMOTE="set -e; \
            test -s $DEST/.$APK.part; \
            chmod 644 $DEST/.$APK.part; \
            mv -f $DEST/.$APK.part $DEST/$APK; \
            ls -l $DEST/$APK; \
            sha256sum $DEST/$APK"
          REMOTE_SHA="$($SSH "$SSH_USER@$SSH_HOST" "$REMOTE" | awk 'END{print $1}')"
          LOCAL_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"

          echo "local  sha256: $LOCAL_SHA"
          echo "remote sha256: $REMOTE_SHA"
          [ "$LOCAL_SHA" = "$REMOTE_SHA" ] || { echo "::error::sha256 mismatch after upload"; exit 1; }
          echo "✓ published & verified"

      # Cloudflare answers 403 to Actions runners, so the public URL cannot be checked from
      # here. Check it ON the VM instead, through the host nginx on loopback (same path a
      # visitor's request takes after Cloudflare), and compare the served bytes.
      - name: Confirm the APK is served by nginx
        if: ${{ inputs.publish }}
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_HOST: ${{ secrets.PROD_VM_HOST }}
        run: |
          set -euo pipefail
          APK="nivesh-v5-prod-release.apk"
          LOCAL_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SSH="ssh -i $HOME/.ssh/id_deploy -p 22 -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          SERVED_SHA="$($SSH "$SSH_USER@$SSH_HOST" \
            "curl -sk --max-time 60 --resolve niveshcopilot.com:443:127.0.0.1 https://niveshcopilot.com/downloads/$APK | sha256sum | cut -d' ' -f1")"
          echo "local  sha256: $LOCAL_SHA"
          echo "served sha256: $SERVED_SHA   (https://niveshcopilot.com/downloads/$APK)"
          [ "$LOCAL_SHA" = "$SERVED_SHA" ] || { echo "::error::nginx is not serving the APK that was just uploaded"; exit 1; }
          echo "✓ served by nginx"

      # Advisory only, like staging: Cloudflare answers 403 to Actions runners, so this can
      # never be authoritative — the on-VM check above is. It exists so the run log shows the URL.
      - name: Public URL (advisory)
        if: ${{ inputs.publish }}
        run: |
          URL="https://niveshcopilot.com/downloads/nivesh-v5-prod-release.apk"
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$URL" 2>/dev/null || echo "000")
          case "$HTTP" in
            200) echo "✅ Public URL serving the APK (HTTP 200): $URL" ;;
            403) echo "ℹ️  HTTP 403 — Cloudflare blocked this runner, not an APK problem. The on-VM check above is authoritative. Download: $URL" ;;
            *)   echo "::warning::Public URL returned HTTP $HTTP — the APK is verified published on the VM. Expected download: $URL" ;;
          esac
