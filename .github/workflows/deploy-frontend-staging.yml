name: Deploy frontend → CloudPe app VM [staging]

# Triggers on pushes to dev when frontend code changes (v2 or v5).
# Passes --frontend-only so the backend image is NOT rebuilt.
#
# Staging runs on the CloudPe app VM (see deploy/cloudpe/README.md); the deploy
# is one on-VM command, deploy/cloudpe/ci-deploy.sh.
"on":
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'frontend-v5/**'
      - 'deploy/nivesh-app/Dockerfile.frontend.prod'
      - 'deploy/nivesh-app/Dockerfile.frontend-v5.prod'
      - 'deploy/nivesh-staging/app-frontend-nginx.conf'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: dev)'
        type: string
        default: dev

concurrency:
  group: deploy-app-staging
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy frontend [staging]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve branch
        id: config
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Secrets: STAGING_APP_VM_HOST, STAGING_SSH_USER, STAGING_SSH_KEY
      # (see deploy-backend-staging.yml).
      - name: SSH → deploy frontend [staging]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.STAGING_APP_VM_HOST }}
          username:        ${{ secrets.STAGING_SSH_USER }}
          key:             ${{ secrets.STAGING_SSH_KEY }}
          port:            22
          timeout:         10m
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "=== STAGING frontend deploy ==="
            echo "    Branch : ${{ steps.config.outputs.branch }}"
            echo "    Commit : ${{ github.sha }}"
            # Health and frontend checks run on the VM through the edge nginx
            # (Cloudflare returns 403 to Actions runners).
            sudo /usr/bin/bash /opt/nivesh-staging/repo/deploy/cloudpe/ci-deploy.sh \
              app "${{ steps.config.outputs.branch }}" --frontend-only
