name: Build & publish Android APK → staging app VM [dev]

# Rebuilds and publishes the staging v5 Android APK on EVERY push to `dev`, so the
# sideload APK at
#   https://staging.niveshcopilot.com/downloads/nivesh-v5-staging-debug.apk
# always matches what staging serves.
#
# Rewritten 2026-10-21. The previous version SSHed to nidp-stack-vm to build,
# because the Android toolchain (/opt/android-sdk, JDK 17) and the download
# webroot (/var/www/nidp-downloads, served at data.niveshcopilot.com/downloads/)
# lived only on that GCP VM. Staging moved to CloudPe and that VM is gone — the
# hostname answers HTTP 522 — so this now:
#   1. builds on the GitHub runner, which needs no build box at all, and
#   2. publishes to the staging APP VM, whose edge nginx serves /downloads/ from
#      /opt/nivesh-staging/downloads.
# The CloudPe app VM cannot build this itself: it has no host JDK/Node/Android SDK
# and no outbound port 80, so apt cannot install one (see
# frontend-v5/scripts/build-android-apk.sh).
#
# Secrets required (same ones deploy-frontend-staging.yml uses):
#   STAGING_APP_VM_HOST  IP of the CloudPe staging app VM
#   STAGING_SSH_USER     CI/CD Linux user on that VM (needs sudo)
#   STAGING_SSH_KEY      private key for that user

"on":
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build the APK from (default: dev)'
        type: string
        default: dev

concurrency:
  # Unlike the deploy workflows, cancelling is the RIGHT behaviour here: this job
  # only has to leave the newest commit's APK in the webroot, so an in-flight
  # build for an older commit is wasted work the moment a newer push lands.
  group: android-apk-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build on the runner, publish to the app VM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-v5/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve build identity
        id: ver
        run: |
          set -euo pipefail
          # versionCode must increase on every build AND stay above the codes
          # already sideloaded by hand (which were plain YYYYMMDD), so scale the
          # date by 10 and use the run number for the within-day slot. Comfortably
          # under Android's 2100000000 ceiling until year 2099.
          DAY="$(date -u +%Y%m%d)"
          CODE=$(( DAY * 10 + ${{ github.run_number }} % 10 ))
          NAME="$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

      - name: Build staging APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          # The script defaults these to the on-VM paths; the runner's own
          # ANDROID_HOME/JAVA_HOME (set by the setup actions) take precedence.
          # APK_WEBROOT is absent on the runner, so the script builds and warns
          # instead of publishing — the publish step below does that over SSH.
        run: bash scripts/build-android-apk.sh

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nivesh-v5-staging-${{ steps.ver.outputs.code }}
          if-no-files-found: error
          path: frontend-v5/nivesh-v5-staging-debug.apk

      # Stream the APK over the ssh EXEC channel (`ssh … 'cat > file'`) rather
      # than scp/sftp: appleboy/scp-action (drone-scp) fails on these VMs with
      # "error copy file to dest", while the plain exec channel works — the same
      # approach android-release.yml uses. An end-to-end sha256 check guards
      # against a truncated transfer.
      - name: Publish APK to the staging app VM
        env:
          SSH_KEY:  ${{ secrets.STAGING_SSH_KEY }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_APP_VM_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          APK="nivesh-v5-staging-debug.apk"   # cwd is frontend-v5 (job default)
          WEBROOT=/opt/nivesh-staging/downloads
          SSH="ssh -i $HOME/.ssh/id_deploy -p 22 -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          echo "▸ streaming $APK ($(stat -c%s "$APK") bytes) over ssh → /tmp/$APK"
          $SSH "$SSH_USER@$SSH_HOST" "cat > /tmp/$APK" < "$APK"

          echo "▸ installing into $WEBROOT (sudo)"
          # Drop earlier APKs so only the current build is downloadable.
          REMOTE="set -e; \
            test -s /tmp/$APK; \
            sudo mkdir -p $WEBROOT; \
            sudo rm -f $WEBROOT/*.apk; \
            sudo install -m 644 /tmp/$APK $WEBROOT/$APK; \
            rm -f /tmp/$APK; \
            ls -l $WEBROOT/$APK; \
            sha256sum $WEBROOT/$APK"
          REMOTE_SHA="$($SSH "$SSH_USER@$SSH_HOST" "$REMOTE" | awk 'END{print $1}')"
          LOCAL_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"

          echo "local  sha256: $LOCAL_SHA"
          echo "remote sha256: $REMOTE_SHA"
          [ "$LOCAL_SHA" = "$REMOTE_SHA" ] || { echo "::error::sha256 mismatch after upload"; exit 1; }
          echo "✓ published & verified"

      # Authoritative check, run ON THE VM: Cloudflare answers GitHub runner
      # egress with HTTP 403, so a public fetch from here cannot be a gate.
      - name: Verify the download through the edge nginx (on the VM)
        env:
          SSH_KEY:  ${{ secrets.STAGING_SSH_KEY }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_APP_VM_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -p 22 -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          URL="https://127.0.0.1:8443/downloads/nivesh-v5-staging-debug.apk"
          OUT="$($SSH "$SSH_USER@$SSH_HOST" \
            "curl -sk -o /dev/null -w '%{http_code} %{size_download} %{content_type}' \
             -H 'Host: staging.niveshcopilot.com' '$URL'")"
          echo "edge nginx → $OUT"
          case "$OUT" in
            200\ *android.package-archive*) echo "✓ served with the APK media type" ;;
            *) echo "::error::unexpected response from the edge: $OUT"; exit 1 ;;
          esac

      - name: Public URL (advisory)
        continue-on-error: true
        run: |
          URL="https://staging.niveshcopilot.com/downloads/nivesh-v5-staging-debug.apk"
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$URL" 2>/dev/null || echo "000")
          case "$HTTP" in
            200) echo "✅ Public URL serving the APK (HTTP 200)." ;;
            403) echo "ℹ️  HTTP 403 — Cloudflare blocked this runner, not an APK problem. The VM-side check above is authoritative." ;;
            *)   echo "::warning::Public URL returned HTTP $HTTP — the APK is verified published on the VM." ;;
          esac
