name: Build & release Android APK → nidp-stack-vm [staging]

# Rebuilds and publishes the staging Android APK whenever a new dev build of the
# v5 web app lands — i.e. the same event that redeploys the frontend to staging
# (a push to `dev` touching frontend-v5/**). Keeps the sideload APK at
#   https://data.niveshcopilot.com/downloads/nivesh-v5-staging-debug.apk
# in lockstep with what staging serves.
#
# Why this SSHes to nidp-stack-vm (NOT nivesh-app-vm, where the app deploys):
# the Android toolchain (/opt/android-sdk, JDK 17) and the download webroot
# (/var/www/nidp-downloads, served by the `nidp` nginx site at
# data.niveshcopilot.com/downloads/) live ONLY on nidp-stack-vm. The build
# reuses the already-authenticated dev checkout at /opt/nidp/dev-repo/nivesh.ai
# that deploy-nidp-staging.yml maintains, then runs the existing
# frontend-v5/scripts/build-android-apk.sh (which bakes VITE_API_BASE_URL to
# staging, assembles the debug APK, and publishes it).
#
# Runs independently of the app deploy (own concurrency group) so a broken APK
# build never fails the staging app rollout, and vice-versa.
#
# Secrets required (same as the NIDP staging deploy):
#   DEVOPS_SSH_KEY   Ed25519 private key for the devops Linux user
#   DEVOPS_SSH_USER  devops
#   NIDP_VM_HOST     IP of nidp-stack-vm
"on":
  push:
    branches: [dev]
    paths:
      - 'frontend-v5/**'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build the APK from (default: dev)'
        type: string
        default: dev

concurrency:
  group: deploy-android-staging
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build & publish staging APK [nidp-stack-vm]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve branch
        id: config
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: SSH → rebuild & publish staging APK
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.NIDP_VM_HOST }}
          username:        ${{ secrets.DEVOPS_SSH_USER }}
          key:             ${{ secrets.DEVOPS_SSH_KEY }}
          port:            22
          timeout:         10m
          command_timeout: 30m
          script: |
            set -euo pipefail
            log() { printf '\033[1;36m[apk-staging-ci]\033[0m %s\n' "$*"; }
            ok()  { printf '\033[1;32m[apk-staging-ci]\033[0m ✅ %s\n' "$*"; }

            BRANCH="${{ steps.config.outputs.branch }}"
            DEV_REPO=/opt/nidp/dev-repo/nivesh.ai
            FE="$DEV_REPO/frontend-v5"

            log "=== STAGING Android APK build (GitHub Actions) ==="
            log "    Branch : $BRANCH"
            log "    Commit : ${{ github.sha }}"

            # Refresh the shared dev checkout. Mirror deploy-nidp-staging.yml
            # exactly: fix ownership first (files added by other users block a
            # reset when running as devops), and pass safe.directory INLINE so
            # git never has to write ~/.gitconfig (unwritable under OS Login).
            GIT=(git -c "safe.directory=$DEV_REPO")
            ME="$(id -un)"
            log "Updating dev checkout at $DEV_REPO..."
            sudo chown -R "$ME:$ME" "$DEV_REPO" 2>/dev/null || true
            "${GIT[@]}" -C "$DEV_REPO" fetch  --quiet origin "$BRANCH"
            "${GIT[@]}" -C "$DEV_REPO" checkout --quiet "$BRANCH"
            "${GIT[@]}" -C "$DEV_REPO" reset --hard --quiet "origin/$BRANCH"
            ok "Code → $("${GIT[@]}" -C "$DEV_REPO" log -1 --oneline)"

            # Install deps for the build (node/npm are at /usr/bin on the VM).
            # `npm ci` is clean and lockfile-exact; the build script does not do
            # it itself.
            #
            # Heal a root-owned npm cache before installing. `npm ci` runs as the
            # deploy user but the next step runs the build script under sudo, so
            # anything that ever touches ~/.npm as root leaves entries this user
            # cannot write — npm then dies with EACCES on _cacache/tmp and the
            # whole build fails. (Run 29691137497 died exactly this way; the cache
            # had been root-owned since 2026-07-09.) Cheap, idempotent, and it
            # turns a hard failure into a no-op.
            log "Ensuring npm cache is writable by $ME..."
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.npm" 2>/dev/null || true

            log "Installing web deps (npm ci)..."
            cd "$FE"
            npm ci --no-audit --no-fund

            # Build + publish as root: the build script writes the APK into the
            # root-owned Android SDK output tree and copies it to the root-owned
            # webroot (/var/www/nidp-downloads). It sets ANDROID_HOME / JAVA_HOME /
            # VITE_API_BASE_URL itself and prints the published sha256 + URL.
            log "Building & publishing APK (sudo)..."
            sudo bash "$FE/scripts/build-android-apk.sh"
            ok "APK build script finished."

      - name: Verify published APK is live
        run: |
          URL="https://data.niveshcopilot.com/downloads/nivesh-v5-staging-debug.apk"
          echo "Checking $URL ..."
          # Retry briefly in case the edge cache lags right after publish.
          for i in 1 2 3 4 5; do
            HTTP=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" 2>/dev/null || echo "000")
            LEN=$(curl -sSI --max-time 20 "$URL" 2>/dev/null \
              | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
            LEN=${LEN:-0}
            echo "  attempt $i → HTTP $HTTP, content-length=$LEN"
            if [[ "$HTTP" == "200" && "$LEN" -gt 1000000 ]]; then
              echo "APK is live ($LEN bytes)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Published APK not reachable (HTTP $HTTP, len $LEN) — build step may have failed to publish."
          exit 1
