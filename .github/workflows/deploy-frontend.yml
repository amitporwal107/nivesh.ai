name: Deploy frontend → CloudPe prod VM [prod]

# Triggers on pushes to main when frontend code changes (v2 or v5).
# Passes --frontend-only so the backend image is NOT rebuilt.
#
# Production runs on the CloudPe prod VM (see deploy/cloudpe-prod/README.md); the deploy is
# one on-VM command, deploy/cloudpe-prod/ci-deploy.sh. It refuses any branch but main.
"on":
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend-v5/**'
      - 'deploy/nivesh-app/Dockerfile.frontend.prod'
      - 'deploy/nivesh-app/Dockerfile.frontend-v5.prod'
      - 'deploy/nivesh-staging/app-frontend-nginx.conf'

  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy frontend [prod]
    runs-on: ubuntu-latest

    steps:
      # Secrets: PROD_VM_HOST, PROD_SSH_USER, PROD_SSH_KEY (see deploy-backend.yml).
      - name: SSH → deploy frontend [prod]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.PROD_VM_HOST }}
          username:        ${{ secrets.PROD_SSH_USER }}
          key:             ${{ secrets.PROD_SSH_KEY }}
          port:            22
          timeout:         10m
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "=== PROD frontend deploy ==="
            echo "    Commit : ${{ github.sha }}"
            # Health and frontend checks run on the VM through the host nginx
            # (Cloudflare returns 403 to Actions runners).
            sudo /usr/bin/bash /opt/nivesh/repo/deploy/cloudpe-prod/ci-deploy.sh \
              app main --frontend-only
