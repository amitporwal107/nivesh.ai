name: Deploy backend → CloudPe app VM [staging]

# Triggers on pushes to dev when backend code changes.
# Passes --backend-only so the frontend images are NOT rebuilt.
#
# Staging runs on the CloudPe app VM (see deploy/cloudpe/README.md). The whole
# deploy is one on-VM command, deploy/cloudpe/ci-deploy.sh, which syncs the
# checkout, builds, restarts, health-checks through the edge nginx, reinstalls
# the cache-clear cron and clears the performance caches.
"on":
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '!backend/nidp/**'
      # copilot_agent lives under backend/nidp/ but EXECUTES in the Nivesh app
      # backend (imported by routes/chat.py), not the NIDP stack — so its
      # changes must redeploy the app VM. Re-include it after the nidp
      # exclusion (last matching pattern wins).
      - 'backend/nidp/services/copilot_agent/**'
      - 'deploy/nivesh-app/Dockerfile.backend.prod'
      - 'deploy/nivesh-staging/**'
      - 'deploy/cloudpe/app/**'
      - 'deploy/cloudpe/lib/**'
      - 'deploy/cloudpe/ci-deploy.sh'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: dev)'
        type: string
        default: dev
      run_migrations:
        description: 'Run DB migrations after redeploy'
        type: boolean
        default: false

concurrency:
  group: deploy-app-staging
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend [staging]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve branch
        id: config
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Secrets (staging-only; the prod workflows keep NIVESH_VM_HOST / DEVOPS_SSH_*):
      #   STAGING_APP_VM_HOST  IP of the CloudPe app VM
      #   STAGING_SSH_USER     CI user on the VM (sudo limited to ci-deploy.sh)
      #   STAGING_SSH_KEY      that user's Ed25519 private key
      - name: SSH → deploy backend [staging]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.STAGING_APP_VM_HOST }}
          username:        ${{ secrets.STAGING_SSH_USER }}
          key:             ${{ secrets.STAGING_SSH_KEY }}
          port:            22
          timeout:         10m
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "=== STAGING backend deploy ==="
            echo "    Branch : ${{ steps.config.outputs.branch }}"
            echo "    Commit : ${{ github.sha }}"
            MIGRATE=""
            if [[ "${{ github.event.inputs.run_migrations }}" == "true" ]]; then MIGRATE="--migrate"; fi
            # The health check runs on the VM, through the edge nginx on
            # loopback: Cloudflare returns 403 to Actions runners, so a check
            # from here could never pass.
            sudo /usr/bin/bash /opt/nivesh-staging/repo/deploy/cloudpe/ci-deploy.sh \
              app "${{ steps.config.outputs.branch }}" --backend-only $MIGRATE
