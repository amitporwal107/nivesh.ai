name: Deploy → CloudPe NIDP VM [staging]

# Triggers when NIDP backend code changes on the dev branch.
# Deploys to the STAGING NIDP stack on the CloudPe NIDP VM
# (/opt/nidp/dev-repo/nivesh.ai — see deploy/cloudpe/README.md).
# The prod 'Deploy → nidp-stack-vm' workflow (main branch) is NOT affected.
"on":
  push:
    branches: [dev]
    paths:
      - 'backend/nidp/**'
      - 'deploy/cloudpe/nidp/**'
      - 'deploy/cloudpe/lib/**'
      - 'deploy/cloudpe/ci-deploy.sh'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from (default: dev)'
        type: string
        default: dev
      run_migrations:
        description: 'Run NIDP DB migrations before restarting services (staging DB on port 5434)'
        type: boolean
        default: false

concurrency:
  # One group for everything that drives the staging NIDP checkout, so two
  # deploys never race on the same clone (index.lock / ref-lock failures).
  # cancel-in-progress stays false: cancelling a deploy half-done is worse
  # than waiting.
  group: nidp-staging-dev-repo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy NIDP staging
    runs-on: ubuntu-latest

    steps:
      # Secrets (staging-only; prod keeps NIDP_VM_HOST / DEVOPS_SSH_*):
      #   STAGING_NIDP_VM_HOST  IP of the CloudPe NIDP VM
      #   STAGING_SSH_USER      CI user on the VM (sudo limited to ci-deploy.sh)
      #   STAGING_SSH_KEY       that user's Ed25519 private key
      #
      # ci-deploy.sh syncs the checkout, installs requirements into the venv,
      # optionally migrates, restarts the DaaS container and the Query API
      # unit, and health-checks both directly and through nginx — on the VM,
      # since those ports are loopback-only.
      - name: Deploy NIDP staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:             ${{ secrets.STAGING_NIDP_VM_HOST }}
          username:         ${{ secrets.STAGING_SSH_USER }}
          key:              ${{ secrets.STAGING_SSH_KEY }}
          port:             22
          timeout:          5m
          command_timeout:  20m
          script: |
            set -euo pipefail
            BR="${{ github.event.inputs.branch || github.ref_name }}"
            echo "=== NIDP STAGING deploy: branch=$BR commit=${{ github.sha }} ==="
            MIGRATE=""
            if [[ "${{ github.event.inputs.run_migrations }}" == "true" ]]; then MIGRATE="--migrate"; fi
            sudo /usr/bin/bash /opt/nidp/dev-repo/nivesh.ai/deploy/cloudpe/ci-deploy.sh \
              nidp "$BR" $MIGRATE
