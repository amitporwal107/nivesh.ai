name: Deploy → Grafana Provisioning [staging + prod]

# Deploys Grafana datasources, dashboards, and plugin config to nidp-stack-vm
# WITHOUT requiring a dev→main merge.  Reads grafana files from the dev or main
# repo on the VM, reads GCP SA key from /opt/nidp/secrets/log-triage-sa.json,
# and recreates the Grafana container to pick up the new plugin + env vars.
#
# Run from the Actions tab → Deploy → Grafana Provisioning → Run workflow
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch for grafana config (dev for staging, main for prod)'
        type: string
        default: dev

concurrency:
  group: deploy-grafana
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Grafana provisioning to nidp-stack-vm
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Grafana provisioning + restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.NIDP_VM_HOST }}
          username:        ${{ secrets.DEVOPS_SSH_USER }}
          key:             ${{ secrets.DEVOPS_SSH_KEY }}
          port:            22
          timeout:         5m
          command_timeout: 10m
          script: |
            set -euo pipefail
            log()  { printf '\033[1;36m[grafana-ci]\033[0m %s\n' "$*"; }
            ok()   { printf '\033[1;32m[grafana-ci]\033[0m ✅ %s\n' "$*"; }
            warn() { printf '\033[1;33m[grafana-ci]\033[0m ⚠  %s\n' "$*"; }

            BRANCH="${{ github.event.inputs.branch || 'dev' }}"
            log "=== Grafana deploy triggered by GitHub Actions ==="
            log "    Branch : $BRANCH"
            log "    Commit : ${{ github.sha }}"

            # ── 1. Update source repo ───────────────────────────────────────────
            if [[ "$BRANCH" == "dev" ]]; then
              SRC_REPO=/opt/nidp/dev-repo/nivesh.ai
              log "Pulling dev branch into $SRC_REPO ..."
              sudo chown -R $USER:$USER "$SRC_REPO" 2>/dev/null || true
              git -C "$SRC_REPO" config --global --add safe.directory "$SRC_REPO" 2>/dev/null || true
              git -C "$SRC_REPO" fetch --quiet origin dev
              git -C "$SRC_REPO" reset --hard --quiet origin/dev
              ok "Code at $SRC_REPO → $(git -C $SRC_REPO log -1 --oneline)"
            else
              SRC_REPO=/opt/nidp/repo
              log "Pulling $BRANCH branch into $SRC_REPO ..."
              sudo -u nidp git -C "$SRC_REPO" fetch --quiet origin "$BRANCH"
              sudo -u nidp git -C "$SRC_REPO" reset --hard --quiet "origin/$BRANCH"
              ok "Code at $SRC_REPO → $(git -C $SRC_REPO log -1 --oneline)"
            fi

            SRC="$SRC_REPO/backend/nidp/deploy/vm/grafana"
            DST=/opt/nidp/grafana/provisioning
            INFRA_COMPOSE="$SRC_REPO/backend/nidp/deploy/vm/docker-compose.infra.yml"

            # ── 2. Copy provisioning files ─────────────────────────────────────
            log "Installing datasources → $DST/datasources/"
            mkdir -p "$DST/datasources" "$DST/dashboards/prod" "$DST/dashboards/staging" "$DST/alerting"
            cp "$SRC/datasources.yml"  "$DST/datasources/datasources.yml"
            cp "$SRC/dashboards.yml"   "$DST/dashboards/dashboards.yml"

            DASHBOARDS="job_health infra dq_chain dq_analytics feed_sched environment_overview app_logs"
            for dash in $DASHBOARDS; do
              if [[ -f "$SRC/dashboards/prod/$dash.json" ]]; then
                cp "$SRC/dashboards/prod/$dash.json"    "$DST/dashboards/prod/$dash.json"
                log "  prod/$dash.json ✓"
              fi
              if [[ -f "$SRC/dashboards/staging/$dash.json" ]]; then
                cp "$SRC/dashboards/staging/$dash.json" "$DST/dashboards/staging/$dash.json"
                log "  staging/$dash.json ✓"
              fi
            done
            if [[ -d "$SRC/alerting" ]]; then
              cp "$SRC/alerting/"*.yaml "$DST/alerting/" 2>/dev/null || true
            fi
            chmod -R a+rX "$DST"
            ok "Provisioning files installed."

            # ── 3. Read GCP SA key from VM secrets (no GitHub secret needed) ───
            SA_KEY_FILE=/opt/nidp/secrets/log-triage-sa.json
            if [[ -f "$SA_KEY_FILE" ]]; then
              GCP_LOG_TRIAGE_PRIVATE_KEY="$(jq -r .private_key "$SA_KEY_FILE")"
              export GCP_LOG_TRIAGE_PRIVATE_KEY
              ok "GCP SA key loaded from $SA_KEY_FILE"
            else
              warn "SA key not found at $SA_KEY_FILE — Cloud Logging datasource will have no credentials."
              warn "Place the log-triage SA JSON at $SA_KEY_FILE on the VM."
              GCP_LOG_TRIAGE_PRIVATE_KEY=""
              export GCP_LOG_TRIAGE_PRIVATE_KEY
            fi

            # ── 4. Recreate Grafana container ──────────────────────────────────
            # `docker compose up -d` (not `docker restart`) re-injects env vars
            # including GCP_LOG_TRIAGE_PRIVATE_KEY and GF_INSTALL_PLUGINS.
            log "Recreating nidp-grafana container..."
            sudo -E docker compose -f "$INFRA_COMPOSE" up -d grafana
            sleep 10

            # ── 5. Health check ────────────────────────────────────────────────
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              ok "Grafana healthy at https://data.niveshcopilot.com/grafana"
              log "  Dashboard: 'Centralized Application Logs' (env/service/severity filters)"
            else
              echo "::error::Grafana did not come up. Check: sudo docker logs nidp-grafana --tail 50"
              exit 1
            fi

      - name: Verify datasource provisioned
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.NIDP_VM_HOST }}
          username: ${{ secrets.DEVOPS_SSH_USER }}
          key:      ${{ secrets.DEVOPS_SSH_KEY }}
          script: |
            sleep 5
            HTTP=$(curl -su admin:admin -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:3000/api/datasources/name/Google%20Cloud%20Logging 2>/dev/null || echo "000")
            echo "Google Cloud Logging datasource HTTP → $HTTP"
            if [[ "$HTTP" == "200" ]]; then
              echo "✅ Datasource provisioned successfully"
            elif [[ "$HTTP" == "404" ]]; then
              echo "::warning::Datasource not found yet — plugin may still be installing (first run takes ~60s)"
            else
              echo "::warning::Unexpected HTTP $HTTP — check Grafana logs"
            fi
