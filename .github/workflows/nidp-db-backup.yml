name: NIDP — Database backup to GCS (retired)

# RETIRED 2026-11-01. This ran nightly against the GCP nidp-stack-vm and uploaded to a GCS bucket;
# both are gone, and its last 8 scheduled runs (24–31 Oct) all failed — i.e. it was producing NO backup.
#
# Production NIDP now runs on the CloudPe prod VM, which takes its own WEEKLY snapshot from cron:
#   /etc/cron.d/nidp-prod-db-snapshot   Sunday 03:30 IST  → /opt/nidp/dumps   (the NIDP warehouse)
#   /etc/cron.d/nivesh-prod-db-snapshot Sunday 02:30 IST  → /opt/nivesh/dumps  (the app Postgres)
# See deploy/cloudpe/backup/README.md ("Production"). A VM cron is used instead of GitHub's scheduler so
# the backup does not depend on Actions, SSH reachability or a CI sudo right.
#
# Kept as a manual-only stub that fails with this message, so nobody runs it expecting a backup.
"on":
  workflow_dispatch:

jobs:
  retired:
    name: Retired — see deploy/cloudpe/backup/README.md
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Retired. NIDP backups are a weekly cron on the CloudPe prod VM (/opt/nidp/dumps)."
          exit 1
