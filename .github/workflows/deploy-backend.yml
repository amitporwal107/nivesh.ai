name: Deploy backend → nivesh-app-vm [prod]

# Triggers on pushes to main when backend code changes.
# Passes --backend-only so the frontend image is NOT rebuilt.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/nidp/**'
      - 'deploy/nivesh-app/Dockerfile.backend.prod'
      - 'deploy/nivesh-app/docker-compose.prod.yml'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: main)'
        type: string
        default: main
      run_migrations:
        description: 'Run DB migrations after redeploy'
        type: boolean
        default: false

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend [prod]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve branch
        id: config
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: SSH → redeploy backend [prod]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.NIVESH_VM_HOST }}
          username:        ${{ secrets.DEVOPS_SSH_USER }}
          key:             ${{ secrets.DEVOPS_SSH_KEY }}
          port:            22
          timeout:         10m
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "=== PROD backend deploy ==="
            echo "    Branch : ${{ steps.config.outputs.branch }}"
            echo "    Commit : ${{ github.sha }}"

            sudo BRANCH="${{ steps.config.outputs.branch }}" \
              bash /opt/nivesh/deploy/redeploy.sh --backend-only

            if [[ "${{ github.event.inputs.run_migrations }}" == "true" ]]; then
              echo "=== Running DB migrations ==="
              sudo docker compose \
                -f /opt/nivesh/deploy/docker-compose.prod.yml \
                --env-file /opt/nivesh/.env.prod \
                --profile migrate \
                run --rm migrate
            fi

      - name: Install cache-clear cron [prod]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.NIVESH_VM_HOST }}
          username:        ${{ secrets.DEVOPS_SSH_USER }}
          key:             ${{ secrets.DEVOPS_SSH_KEY }}
          port:            22
          timeout:         1m
          command_timeout: 1m
          script: |
            sudo install -m 644 /opt/nivesh/repo/deploy/nivesh-app/cache-clear.cron \
              /etc/cron.d/nivesh-cache-clear

      - name: Health check [prod]
        run: |
          sleep 15
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 10 https://niveshcopilot.com/api/health \
            2>/dev/null || echo "000")
          echo "Health check → HTTP $HTTP"
          [[ "$HTTP" == "200" ]] || echo "::warning::Health check returned $HTTP"

      - name: Clear performance caches [prod]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.NIVESH_VM_HOST }}
          username:        ${{ secrets.DEVOPS_SSH_USER }}
          key:             ${{ secrets.DEVOPS_SSH_KEY }}
          port:            22
          timeout:         2m
          command_timeout: 3m
          script: |
            echo "=== Clearing performance caches ==="
            sudo /usr/bin/docker exec nivesh-backend python -m scripts.clear_performance_caches
            echo "=== Cache clear done ==="
