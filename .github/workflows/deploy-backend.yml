name: Deploy backend → CloudPe prod VM [prod]

# Triggers on pushes to main when backend code changes.
# Passes --backend-only so the frontend images are NOT rebuilt.
#
# Production runs on the CloudPe prod VM, together with the NIDP stack (see
# deploy/cloudpe-prod/README.md). The whole deploy is one on-VM command,
# deploy/cloudpe-prod/ci-deploy.sh, which syncs the checkout to origin/main, builds,
# restarts, health-checks through the host nginx on loopback, reinstalls the
# cron jobs and clears the performance caches. It refuses any branch but main.
"on":
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/nidp/**'
      # copilot_agent lives under backend/nidp/ but EXECUTES in the Nivesh app
      # backend (imported by routes/chat.py), not the NIDP stack — so its
      # changes must redeploy the app. Re-include it after the nidp
      # exclusion (last matching pattern wins).
      - 'backend/nidp/services/copilot_agent/**'
      - 'deploy/nivesh-app/Dockerfile.backend.prod'
      - 'deploy/nivesh-staging/app-frontend-nginx.conf'
      - 'deploy/cloudpe-prod/app/**'
      - 'deploy/cloudpe-prod/edge/**'
      - 'deploy/cloudpe-prod/lib.sh'
      - 'deploy/cloudpe-prod/deploy-app.sh'
      - 'deploy/cloudpe-prod/ci-deploy.sh'

  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run DB migrations after redeploy'
        type: boolean
        default: false

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend [prod]
    runs-on: ubuntu-latest

    steps:
      # Secrets (prod; the staging workflows use the STAGING_* ones):
      #   PROD_VM_HOST   IP of the CloudPe prod VM
      #   PROD_SSH_USER  CI user on the VM (sudo limited to ci-deploy.sh)
      #   PROD_SSH_KEY   that user's Ed25519 private key
      - name: SSH → deploy backend [prod]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.PROD_VM_HOST }}
          username:        ${{ secrets.PROD_SSH_USER }}
          key:             ${{ secrets.PROD_SSH_KEY }}
          port:            22
          timeout:         10m
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "=== PROD backend deploy ==="
            echo "    Commit : ${{ github.sha }}"
            MIGRATE=""
            if [[ "${{ github.event.inputs.run_migrations }}" == "true" ]]; then MIGRATE="--migrate"; fi
            # The health check runs on the VM, through the host nginx on loopback:
            # Cloudflare returns 403 to Actions runners, so a check from here could never pass.
            sudo /usr/bin/bash /opt/nivesh/repo/deploy/cloudpe-prod/ci-deploy.sh \
              app main --backend-only $MIGRATE
