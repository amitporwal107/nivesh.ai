name: Deploy → nivesh-app-vm [staging]

# Triggers on pushes to dev when app code changes.
# Deploys to the STAGING stack on nivesh-app-vm (/opt/nivesh-staging/).
# The prod 'Deploy → nivesh-app-vm' workflow (main branch) is NOT affected.
"on":
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '!backend/nidp/**'
      - 'deploy/nivesh-app/**'
      - 'deploy/nivesh-staging/**'

  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options:
          - both
          - frontend-only
          - backend-only
        default: both
      branch:
        description: 'Branch to deploy (default: dev)'
        type: string
        default: dev
      run_migrations:
        description: 'Run DB migrations after redeploy'
        type: boolean
        default: false

# Never cancel a running staging deploy — let it finish.
concurrency:
  group: deploy-app-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to nivesh-app-vm [staging]
    runs-on: ubuntu-latest

    steps:
      # ── Resolve deploy args ──────────────────────────────────────────────
      - name: Resolve deploy target and branch
        id: config
        run: |
          TARGET="${{ github.event.inputs.target || 'both' }}"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"

          ARGS=""
          [[ "$TARGET" == "frontend-only" ]] && ARGS="--frontend-only"
          [[ "$TARGET" == "backend-only"  ]] && ARGS="--backend-only"

          echo "args=$ARGS"       >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"   >> "$GITHUB_OUTPUT"

      # ── Deploy via SSH ────────────────────────────────────────────────────
      # Secrets required (same as prod job — same VM, same devops user):
      #   DEVOPS_SSH_KEY   Ed25519 private key for the devops Linux user
      #   DEVOPS_SSH_USER  devops
      #   NIVESH_VM_HOST   IP of nivesh-app-vm
      #
      # STAGING: runs redeploy-staging.sh against /opt/nivesh-staging/
      #          NOT the prod redeploy.sh / /opt/nivesh/
      - name: SSH into VM and redeploy staging stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:             ${{ secrets.NIVESH_VM_HOST }}
          username:         ${{ secrets.DEVOPS_SSH_USER }}
          key:              ${{ secrets.DEVOPS_SSH_KEY }}
          port:             22
          timeout:          10m
          command_timeout:  30m
          script: |
            set -euo pipefail
            echo "=== STAGING deploy triggered by GitHub Actions ==="
            echo "    Branch : ${{ steps.config.outputs.branch }}"
            echo "    Target : ${{ steps.config.outputs.target }}"
            echo "    Commit : ${{ github.sha }}"
            echo ""

            # Git ≥2.35.2 rejects repos owned by a different user when running as root.
            # Mark safe BEFORE calling redeploy-staging.sh so the fetch inside it succeeds.
            sudo git config --global --add safe.directory /opt/nivesh-staging/repo

            # STAGING: run the staging redeploy script (not prod redeploy.sh).
            # redeploy-staging.sh does: git reset --hard origin/dev → docker compose build → up → health check.
            sudo bash /opt/nivesh-staging/repo/deploy/nivesh-staging/redeploy-staging.sh \
              "${{ steps.config.outputs.branch }}"

            # Run DB migrations (opt-in).
            if [[ "${{ github.event.inputs.run_migrations }}" == "true" ]]; then
              echo ""
              echo "=== Running STAGING DB migrations ==="
              sudo docker compose \
                -f /opt/nivesh-staging/repo/deploy/nivesh-staging/docker-compose.staging.yml \
                --env-file /opt/nivesh-staging/.env.staging \
                --profile migrate \
                run --rm app-migrate
            else
              echo "(migrations skipped — set workflow input run_migrations=true to run them)"
            fi

      # ── Post-deploy health probe ──────────────────────────────────────────
      # Use -k (insecure) — staging may use a self-signed cert.
      # Warn but do not fail if staging DNS is not yet live.
      - name: External health check [staging]
        run: |
          echo "Waiting 20s for staging containers to stabilise..."
          sleep 20
          HTTP=$(curl -sfk -o /dev/null -w "%{http_code}" \
            --max-time 15 https://staging.niveshcopilot.com/api/healthz \
            2>/dev/null || echo "000")
          echo "Staging health check → HTTP $HTTP"
          [[ "$HTTP" == "200" ]] || echo "::warning::Staging health check returned $HTTP (DNS may not be live)"
