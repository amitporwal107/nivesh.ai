name: Deploy → nidp-stack-vm [cron + systemd] (retired)

# RETIRED. This workflow installed backend/nidp/deploy/vm/nidp.cron, the unit files and
# nginx.conf on the old GCP nidp-stack-vm. Production now runs on the CloudPe prod VM, where
#   - the feed crontab is generated from deploy/cloudpe/nidp/nidp-staging.cron and kept in sync
#     by deploy-nidp.sh on every NIDP deploy (deploy-nidp.yml),
#   - the Query API unit is deploy/cloudpe-prod/nidp/nidp-query-api.service,
#   - nginx is deploy/cloudpe-prod/edge/nginx-prod.conf.
# Running the old installer there would overwrite /etc/cron.d/nidp with the GCP schedule, so it
# only runs when started by hand and always stops with this message.
"on":
  workflow_dispatch:

jobs:
  retired:
    name: Retired — see deploy-nidp.yml
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Retired. NIDP cron, unit and nginx changes deploy with deploy-nidp.yml (CloudPe prod VM)."
          exit 1
