name: Deploy → nivesh-app-vm

# Triggers on pushes to the deploy branch when app code changes.
# Also triggerable manually with granular control.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '!backend/nidp/**'
      - 'deploy/nivesh-app/**'

  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options:
          - both
          - frontend-only
          - backend-only
        default: both
      branch:
        description: 'Branch to deploy (default: main)'
        type: string
        default: main
      run_migrations:
        description: 'Run DB migrations after redeploy (re-runs all .sql; safe if every file uses IF NOT EXISTS / ON CONFLICT)'
        type: boolean
        default: false

# Only one deploy at a time; new pushes cancel in-progress deploys.
concurrency:
  group: deploy-app
  cancel-in-progress: false   # never cancel a running deploy — let it finish

jobs:
  deploy:
    name: Deploy to nivesh-app-vm
    runs-on: ubuntu-latest

    steps:
      # ── Resolve deploy args ──────────────────────────────────────────────
      - name: Resolve deploy target and branch
        id: config
        run: |
          TARGET="${{ github.event.inputs.target || 'both' }}"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"

          ARGS=""
          [[ "$TARGET" == "frontend-only" ]] && ARGS="--frontend-only"
          [[ "$TARGET" == "backend-only"  ]] && ARGS="--backend-only"

          echo "args=$ARGS"       >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"   >> "$GITHUB_OUTPUT"

      # ── Deploy via SSH ────────────────────────────────────────────────────
      # Secrets required:
      #   DEVOPS_SSH_KEY   Ed25519 private key for the 'devops' Linux user
      #   DEVOPS_SSH_USER  'devops'  (the CI/CD Linux user on both VMs)
      #   NIVESH_VM_HOST   IP of nivesh-app-vm (34.100.186.141)
      #
      # One-time VM setup: sudo bash backend/nidp/deploy/vm/setup_devops_access.sh '<pub-key>'
      # See: docs/DEVOPS_IDENTITY_SETUP.md
      - name: SSH into VM and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:             ${{ secrets.NIVESH_VM_HOST }}
          username:         ${{ secrets.DEVOPS_SSH_USER }}
          key:              ${{ secrets.DEVOPS_SSH_KEY }}
          port:             22
          timeout:          10m
          command_timeout:  30m
          script: |
            set -euo pipefail
            echo "=== Deploy triggered by GitHub Actions ==="
            echo "    Branch : ${{ steps.config.outputs.branch }}"
            echo "    Target : ${{ steps.config.outputs.target }}"
            echo "    Commit : ${{ github.sha }}"
            echo ""

            # Run the existing redeploy script as root with the correct branch.
            sudo BRANCH="${{ steps.config.outputs.branch }}" \
              bash /opt/nivesh/deploy/redeploy.sh ${{ steps.config.outputs.args }}

            # Run DB migrations (opt-in via workflow_dispatch input).
            # Invokes the existing migrate compose service — re-runs every
            # .sql file in /app/backend/migrations/, relying on the existing
            # 'IF NOT EXISTS / ON CONFLICT' discipline + 'already exists' grep
            # suppression for idempotency. Same behavior as a manual run.
            if [[ "${{ github.event.inputs.run_migrations }}" == "true" ]]; then
              echo ""
              echo "=== Running DB migrations ==="
              sudo docker compose \
                -f /opt/nivesh/deploy/docker-compose.prod.yml \
                --env-file /opt/nivesh/.env.prod \
                --profile migrate \
                run --rm migrate
            else
              echo "(migrations skipped — set workflow input run_migrations=true to run them)"
            fi

      # ── Post-deploy health probe from runner ──────────────────────────────
      - name: External health check
        run: |
          echo "Waiting 15s for containers to stabilise..."
          sleep 15
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 10 https://niveshcopilot.com/api/health \
            2>/dev/null || echo "000")
          echo "Health check → HTTP $HTTP"
          [[ "$HTTP" == "200" ]] || { echo "::warning::Health check returned $HTTP"; }
