# Backend unit tests on every pull request to dev and main (Phase 4.1: "tests run in CI and fail when a regression changes
# expected results without an intentional update").
#
# What runs: an explicit ALLOWLIST of backend/tests files that collect and pass with no Mongo, no Postgres, no running API
# server, no secrets and no env files: the PRD worked examples A-H, the exit rules, the order-path guard, the risk, cost,
# strategy, backtest and desk suites, and every other suite that met that bar in a clean python:3.11-slim run on 2026-10-27
# (236 files, about 6,300 tests), plus the Phase 1 risk suites merged later that day and this PR's new suites. A suite left out needs a live service, a deployed API URL (REACT_APP_BACKEND_URL), a local
# env/fixture file, or fails on this tree already; the list of exclusions and the reason for each is in the PR that added this
# file. Add a new suite here when it is written; move a suite out only with a reason in the PR.
#
# Dependencies are resolved the way the production image does (deploy/nivesh-app/Dockerfile.backend.prod): uv, the same two
# overrides, and emergentintegrations left out (it lives on a private index; nothing here imports it). Every version is
# pinned: the runner image, Python, the actions (by commit SHA), uv, and backend/requirements.txt itself (all ==).
#
# No secrets: the env below is placeholders so deps.py imports; nothing connects to them.
name: Backend — unit tests

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Backend unit tests (allowlist)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: unit_test
      OPENAI_API_KEY: unit-test-placeholder
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11.17"
      - name: Install dependencies
        run: |
          pip install --quiet --disable-pip-version-check uv==0.13.0
          grep -v '^emergentintegrations' requirements.txt > /tmp/req.txt
          printf 'openai>=2.26.0\npdfminer.six==20251230\n' > /tmp/overrides.txt
          uv pip install --system --no-cache --override /tmp/overrides.txt -r /tmp/req.txt
      - name: Unit tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_action_badge_sub_action.py
          tests/test_action_recommendation_schema.py
          tests/test_advisor_prompt_context.py
