name: Deploy → nidp-stack-vm

# Triggers when NIDP backend code changes on the main branch.
on:
  push:
    branches: [main]
    paths:
      - 'backend/nidp/**'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        type: string
        default: main
      run_migrations:
        description: 'Run DB migrations after deploy. Default ON — nidp.cli migrate skips already-applied files via nidp.schema_migrations, so re-running is a no-op. Untick only for code-only redeploys (e.g. revert that touches no SQL).'
        type: boolean
        default: true

concurrency:
  group: deploy-nidp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy NIDP to nidp-stack-vm
    runs-on: ubuntu-latest

    steps:
      # ── Deploy via SSH ────────────────────────────────────────────────────
      # Secrets required:
      #   DEVOPS_SSH_KEY   Ed25519 private key for the 'devops' Linux user
      #   DEVOPS_SSH_USER  'devops'  (the CI/CD Linux user on both VMs)
      #   NIDP_VM_HOST     IP of nidp-stack-vm (34.93.60.254)
      #
      # One-time VM setup: sudo bash backend/nidp/deploy/vm/setup_devops_access.sh '<pub-key>'
      # See: docs/DEVOPS_IDENTITY_SETUP.md
      - name: Deploy NIDP code and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:             ${{ secrets.NIDP_VM_HOST }}
          username:         ${{ secrets.DEVOPS_SSH_USER }}
          key:              ${{ secrets.DEVOPS_SSH_KEY }}
          port:             22
          timeout:          5m
          command_timeout:  15m
          script: |
            set -euo pipefail
            log() { printf '\033[1;36m[nidp-ci]\033[0m %s\n' "$*"; }
            ok()  { printf '\033[1;32m[nidp-ci]\033[0m ✅ %s\n' "$*"; }

            log "=== NIDP deploy triggered by GitHub Actions ==="
            log "    Branch : ${{ github.event.inputs.branch || 'main' }}"
            log "    Commit : ${{ github.sha }}"

            # Pull latest code and reinstall deps (if requirements changed)
            sudo -u nidp /opt/nidp/repo/backend/nidp/deploy/vm/deploy.sh \
              --branch="${{ github.event.inputs.branch || 'main' }}"

            # Run pending DB migrations before restarting services.
            # nidp.cli migrate tracks applied files in nidp.schema_migrations
            # and skips them on re-run — safe + idempotent on every deploy.
            # Gating rule:
            #   - push event           → always run (the migration files in the
            #                            push ARE the change we're deploying).
            #   - workflow_dispatch    → honour the run_migrations input
            #                            (defaults to true; untick for
            #                            code-only redeploys like reverts).
            EVENT='${{ github.event_name }}'
            RUN_MIGRATIONS_INPUT='${{ github.event.inputs.run_migrations }}'
            if [[ "$EVENT" == "push" || "$RUN_MIGRATIONS_INPUT" != "false" ]]; then
              log "=== Running pending NIDP migrations (event=$EVENT) ==="
              sudo -u nidp bash -c '
                set -a; . /opt/nidp/nidp.env; set +a
                cd /opt/nidp/repo/backend &&
                /opt/nidp/venv/bin/python -m nidp.cli migrate
              '
              ok "Migrations done."
            else
              log "(migrations skipped — workflow_dispatch with run_migrations=false)"
            fi

            # Restart live services to pick up the new code
            for svc in nidp-daas-api nidp-query-api; do
              if sudo systemctl is-active --quiet "$svc" 2>/dev/null; then
                sudo systemctl restart "$svc"
                ok "$svc restarted"
              else
                log "$svc not active — skipping"
              fi
            done

            ok "Deploy complete."

      # ── Health check ──────────────────────────────────────────────────────
      - name: Health check DaaS API
        run: |
          sleep 10
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 "https://data.niveshcopilot.com/daas/health" \
            2>/dev/null || echo "000")
          echo "DaaS health → HTTP $HTTP"
          [[ "$HTTP" == "200" ]] || echo "::warning::DaaS health returned $HTTP"
