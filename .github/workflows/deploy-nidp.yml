name: Deploy → CloudPe prod VM [NIDP]

# Triggers when NIDP backend code changes on the main branch.
# Deploys the NIDP stack that runs next to the app on the CloudPe prod VM
# (/opt/nidp, see deploy/cloudpe-prod/README.md). ci-deploy.sh syncs the shared
# checkout to origin/main, installs requirements into the venv, optionally
# migrates, restarts the DaaS container and the Query API unit, re-syncs the
# cron feeds (when they are installed) and health-checks both directly and
# through nginx — on the VM, since those ports are loopback-only.
"on":
  push:
    branches: [main]
    paths:
      - 'backend/nidp/**'
      # The prod feed crontab is generated from the staging cron file.
      - 'deploy/cloudpe/nidp/nidp-staging.cron'
      - 'deploy/cloudpe-prod/nidp/**'
      - 'deploy/cloudpe-prod/edge/**'
      - 'deploy/cloudpe-prod/lib.sh'
      - 'deploy/cloudpe-prod/deploy-nidp.sh'
      - 'deploy/cloudpe-prod/ci-deploy.sh'

  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run NIDP DB migrations before restarting services'
        type: boolean
        default: false

concurrency:
  group: deploy-nidp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy NIDP [prod]
    runs-on: ubuntu-latest

    steps:
      # Secrets: PROD_VM_HOST, PROD_SSH_USER, PROD_SSH_KEY (see deploy-backend.yml).
      - name: Deploy NIDP [prod]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:             ${{ secrets.PROD_VM_HOST }}
          username:         ${{ secrets.PROD_SSH_USER }}
          key:              ${{ secrets.PROD_SSH_KEY }}
          port:             22
          timeout:          5m
          command_timeout:  30m
          script: |
            set -euo pipefail
            echo "=== NIDP PROD deploy: commit=${{ github.sha }} ==="
            MIGRATE=""
            if [[ "${{ github.event.inputs.run_migrations }}" == "true" ]]; then MIGRATE="--migrate"; fi
            sudo /usr/bin/bash /opt/nivesh/repo/deploy/cloudpe-prod/ci-deploy.sh \
              nidp main $MIGRATE
